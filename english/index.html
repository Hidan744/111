<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spotlight 3 Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#F2F7E8; --surface:#FFFFFF; --surface-2:#E6F0D4; --ink:#1D2A44; --muted:#5A687C; --line:#D5E2C0;
  --lime:#6FAE12; --lime-deep:#3F6B06; --lime-soft:#DDF0BC;
  --red:#DE3A2E; --red-soft:#FBE0DC; --yellow:#FFC43D; --sky:#2E93C8; --sky-soft:#D9EEF9;
  --ok:#2E9D4E; --ok-soft:#D8F2DF; --bad:#D6453A; --bad-soft:#FBE1DE;
  --shadow:0 3px 0 rgba(29,42,68,.14);
  --display:"Rubik","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101723; --surface:#1A2332; --surface-2:#223047; --ink:#EEF3E6; --muted:#A3B0C2; --line:#2C3A50;
    --lime:#95D13A; --lime-deep:#C4EE85; --lime-soft:#2A3B1E;
    --red:#FF6B5E; --red-soft:#43231F; --yellow:#FFCF5C; --sky:#63B9E6; --sky-soft:#1C3345;
    --ok:#5CD17C; --ok-soft:#1E3A28; --bad:#FF7A6E; --bad-soft:#442320;
    --shadow:0 3px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101723; --surface:#1A2332; --surface-2:#223047; --ink:#EEF3E6; --muted:#A3B0C2; --line:#2C3A50;
  --lime:#95D13A; --lime-deep:#C4EE85; --lime-soft:#2A3B1E;
  --red:#FF6B5E; --red-soft:#43231F; --yellow:#FFCF5C; --sky:#63B9E6; --sky-soft:#1C3345;
  --ok:#5CD17C; --ok-soft:#1E3A28; --bad:#FF7A6E; --bad-soft:#442320;
  --shadow:0 3px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.stop:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo span:nth-child(1){color:var(--red)}.logo span:nth-child(2){color:#F08A1C}.logo span:nth-child(3){color:var(--lime)}.logo span:nth-child(4){color:var(--sky)}
.logo b{color:var(--ink);font-weight:800}
.score{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .st{color:var(--yellow);font-size:18px;line-height:1}
.back{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 14px;font-weight:800}

/* hero */
.hello{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--lime);color:#fff;border-radius:22px;padding:20px;margin-top:4px;box-shadow:var(--shadow)}
.hello h1{font-size:clamp(24px,5.5vw,34px);font-weight:800}
.hello p{margin:6px 0 0;font-weight:700;opacity:.95}
.rank{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;text-align:center;font-weight:800;min-width:110px}
.rank .big{font-size:34px;line-height:1}
.rank small{display:block;font-size:13px;opacity:.9;font-weight:700}
.lvlbar{grid-column:1/-1;height:12px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .5s}
.lvlnote{grid-column:1/-1;margin-top:-8px;font-size:14px;font-weight:700;opacity:.95}

/* route */
.sec-title{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body);font-weight:800;margin:26px 0 10px}
.route{position:relative;display:grid;gap:12px;padding-left:34px}
.route::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:4px dashed var(--line)}
.part{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);margin:8px 0 -2px -34px;display:flex;align-items:center;gap:8px}
.part::before{content:"";width:30px;height:4px;background:var(--line);border-radius:4px}
.stop{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);width:100%;transition:transform .12s}
.stop:hover{transform:translateY(-2px)}
.stop:active{transform:translateY(1px)}
.dot{position:absolute;left:-30px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.stop.done .dot{background:var(--lime);border-color:var(--lime)}
.stop.started .dot{border-color:var(--lime)}
.bus{position:absolute;left:-42px;top:50%;margin-top:-22px;font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff}
.stop h3{font-size:19px;font-weight:700}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stop .ru{color:var(--muted);font-size:15px;font-weight:700}
.mini{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini .bar{width:64px;height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--yellow)}

/* module */
.mhead{display:flex;gap:14px;align-items:center;margin-top:4px}
.mhead .num{width:60px;height:60px;font-size:28px;border-radius:18px;flex-shrink:0}
.mhead h1{font-size:clamp(24px,5vw,32px);font-weight:800}
.mhead p{margin:2px 0 0;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:150px}
.game .ic{font-size:34px;line-height:1}
.game h3{font-size:18px}
.game p{margin:0;color:var(--muted);font-size:14px;font-weight:700;flex:1}
.stars{font-size:20px;letter-spacing:2px;color:var(--line)}
.stars .on{color:var(--yellow)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{perspective:700px;background:none;border:0;padding:0;height:140px}
.card .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;backface-visibility:hidden;box-shadow:var(--shadow)}
.card .b{transform:rotateY(180deg);background:var(--lime-soft)}
.card .em{font-size:42px;line-height:1.1;font-family:var(--display);font-weight:800}
.card .w{font-family:var(--display);font-weight:700;font-size:19px;text-align:center}
.card .t{font-weight:800;font-size:18px;text-align:center}
.hint{color:var(--muted);font-weight:700;font-size:14px;margin:0 0 12px}
.phr{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.line .spk{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);font-size:20px}
.line .en{font-family:var(--display);font-weight:700;font-size:18px}
.line .ru{color:var(--muted);font-weight:700;font-size:15px}
.rule{background:var(--sky-soft);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rule h3{font-size:17px;margin-bottom:4px}
.rule p{margin:0;font-weight:600}

/* game screen */
.gtop{display:flex;align-items:center;gap:12px;margin-top:4px}
.prog{flex:1;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s}
.qbox{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px 16px;margin-top:16px;text-align:center;box-shadow:var(--shadow)}
.task{font-weight:800;color:var(--muted);font-size:15px;margin:0 0 10px}
.qbig{font-size:72px;line-height:1.1;font-family:var(--display);font-weight:800}
.qru{font-weight:800;font-size:20px;margin-top:6px}
.qsent{font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,26px);line-height:1.35}
.qsent .gap{display:inline-block;min-width:70px;border-bottom:4px solid var(--sky);color:var(--sky);margin:0 4px}
.listen{width:110px;height:110px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:48px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.listen:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:84px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:21px;padding:10px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.opt.pic{font-size:52px;min-height:110px}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px;min-height:58px}
.slot{width:46px;height:54px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;background:var(--surface)}
.slot.full{border-style:solid;border-color:var(--sky);background:var(--sky-soft)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.let{width:52px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:var(--shadow)}
.let:disabled{opacity:.25;box-shadow:none}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--ink);font-family:var(--display)}
.next{border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 22px;font-weight:800;font-size:18px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:18px;box-shadow:var(--shadow)}
.btn.main{background:var(--lime);color:#fff}
.btn.alt{background:var(--surface);border:2px solid var(--line)}
.result{text-align:center;padding-block:20px}
.result .bigstars{font-size:64px;letter-spacing:6px;color:var(--line)}
.result .bigstars .on{color:var(--yellow);display:inline-block;animation:pop .5s both}
.result .bigstars .on:nth-child(2){animation-delay:.2s}.result .bigstars .on:nth-child(3){animation-delay:.4s}
.result h1{font-size:32px;margin-top:8px}
.result p{font-weight:700;color:var(--muted);font-size:18px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.parents{margin-top:28px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.parents h2{font-size:18px;margin-bottom:6px}
.parents p,.parents li{font-weight:600;color:var(--muted);font-size:15px}
.parents ul{margin:6px 0;padding-left:20px}
.link{background:none;border:0;padding:0;color:var(--red);font-weight:800;text-decoration:underline}
.confirm{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.sound{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;font-size:18px}

@media (max-width:520px){
  .games{grid-template-columns:1fr}
  .opts.three{grid-template-columns:1fr}
  .opts.three .opt{min-height:64px}
  .mini .bar{width:48px}
  .stop{gap:10px;padding:12px}
  .num{width:42px;height:42px;font-size:20px}
  .game{min-height:0}
  .hello{grid-template-columns:1fr}
  .rank{display:flex;align-items:center;gap:10px;text-align:left}
  .rank .big{font-size:28px}
  .logo{font-size:19px}
  .qbig{font-size:60px}
  .opt.pic{font-size:44px;min-height:96px}
}
.listen.slow{width:76px;height:76px;font-size:34px;background:var(--lime)}
.modal{position:fixed;inset:0;background:rgba(16,23,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:24px;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:24px}
.vh{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--body);font-weight:800;margin:16px 0 8px}
.vnote{color:var(--muted);font-weight:600;font-size:14px;margin:8px 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segb,.vopt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 8px;font-weight:800}
.segb.on,.vopt.on{border-color:var(--lime);background:var(--lime-soft)}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin:14px 0 10px}
.chk input{width:22px;height:22px;accent-color:var(--lime)}
.vlist{display:grid;gap:8px}
.vopt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 14px}
.vopt small{display:block;color:var(--muted);font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const GAMES = [
  {id:"listen", ic:"🔊", t:"Послушай и выбери", d:"Слушай слово и найди картинку"},
  {id:"pick",   ic:"🖼️", t:"Что на картинке?",  d:"Выбери английское слово"},
  {id:"spell",  ic:"🔤", t:"Собери слово",       d:"Составь слово из букв"},
  {id:"gram",   ic:"🧩", t:"Вставь слово",       d:"Грамматика из модуля"}
];
const RANKS = [[0,"🐣","Новичок"],[10,"🐤","Ученик"],[30,"🦊","Умник"],[55,"🦁","Знаток"],[80,"🚀","Звезда"],[108,"🏆","Чемпион Spotlight"]];
const PRAISE = ["Well done!","Great!","Super!","Excellent!","Good job!","Brilliant!","Fantastic!"];
const MAXSTARS = MODULES.length * GAMES.length * 3;

/* ===== Состояние ===== */
const KEY = "spotlight3-tutor";
let S = {stars:{}, last:null, sound:true};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const starOf = (m,g) => (S.stars[m] && S.stars[m][g]) || 0;
const modStars = m => GAMES.reduce((a,g)=>a+starOf(m,g.id),0);
const totalStars = () => MODULES.reduce((a,m)=>a+modStars(m.id),0);
function rankOf(n){ let r=RANKS[0], nx=null; for (let i=0;i<RANKS.length;i++){ if(n>=RANKS[i][0]){r=RANKS[i]; nx=RANKS[i+1]||null;} } return {r,nx}; }

/* ===== Звук и озвучка ===== */
const RATES = [[.6,"🐢 Медленно"],[.78,"🙂 Обычно"],[.92,"🐇 Быстрее"]];
if (S.rate==null) S.rate = .78;
if (S.repeat==null) S.repeat = false;
const hasTTS = "speechSynthesis" in window;
function engVoices(){
  if (!hasTTS) return [];
  try { return speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)); } catch(e){ return []; }
}
/* Чем выше балл, тем чище и естественнее голос */
function voiceScore(v){
  const n = v.name; let sc = 0;
  if (/natural|neural|online|premium|enhanced/i.test(n)) sc += 60;
  if (/google/i.test(n)) sc += 35;
  if (/sonia|libby|ryan|maisie|thomas|daniel|kate|serena|arthur|martha|stephanie|oliver|jamie|aria|jenny|guy|samantha|ava|allison|susan|karen|moira/i.test(n)) sc += 20;
  if (/en[-_]GB/i.test(v.lang)) sc += 15; else if (/en[-_]US/i.test(v.lang)) sc += 8;
  if (/espeak|compact|novelty|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|albert|fred|junior|ralph|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/i.test(n)) sc -= 80;
  return sc;
}
function rankedVoices(){ return engVoices().sort((a,b)=>voiceScore(b)-voiceScore(a)); }
function voice(){
  const vs = rankedVoices();
  return (S.voice && vs.find(v=>v.name===S.voice)) || vs[0] || null;
}
function say(text, opt){
  if (!hasTTS) return;
  opt = opt || {};
  const clean = text.replace(/[⬆️⬇️📦]/gu,"").trim();
  try {
    speechSynthesis.cancel();
    const v = voice();
    const mk = (t, rate) => { const u = new SpeechSynthesisUtterance(t); u.lang = v ? v.lang : "en-GB"; if (v) u.voice = v; u.rate = rate; u.pitch = 1; u.volume = 1; return u; };
    const short = clean.split(/\s+/).length <= 3;
    /* Короткие слова читаем чуть медленнее: так чётче слышны звуки */
    const rate = short ? Math.max(.5, S.rate - .08) : S.rate;
    /* Небольшая пауза после cancel(): иначе Chrome иногда «съедает» начало слова */
    setTimeout(()=>{
      try {
        speechSynthesis.resume();
        speechSynthesis.speak(mk(clean, rate));
        if ((S.repeat && short && !opt.once) || opt.twice) speechSynthesis.speak(mk(clean, Math.max(.5, rate - .12)));
      } catch(e){}
    }, 80);
  } catch(e){}
}
if (hasTTS) { try { speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged", ()=>{ const p=document.getElementById("vlist"); if (p) fillVoices(); }); } catch(e){} }

/* ===== Настройки голоса ===== */
function fillVoices(){
  const box = document.getElementById("vlist"); if (!box) return;
  const vs = rankedVoices(), cur = voice();
  if (!vs.length){ box.innerHTML = `<p class="vnote">На этом устройстве не нашлось английского голоса. На iPhone/iPad: Настройки → Универсальный доступ → Устный контент → Голоса → English — скачайте голос с пометкой «улучшенный». На Android: Настройки → Синтез речи → Google → установите английский язык.</p>`; return; }
  box.innerHTML = vs.slice(0,12).map((v,i)=>`<button class="vopt${cur&&v.name===cur.name?" on":""}" data-n="${esc(v.name)}"><span><b>${esc(v.name.replace(/^Microsoft |^Google /,""))}</b><small>${esc(v.lang)}${i===0?" · лучший на этом устройстве":""}</small></span><span aria-hidden="true">▶</span></button>`).join("");
  box.querySelectorAll(".vopt").forEach(b=>b.onclick=()=>{ S.voice=b.dataset.n; save(); fillVoices(); say("Hello! I'm your English teacher. Apple, pencil, Monday.", {once:true}); });
}
function openVoice(){
  const d = document.createElement("div"); d.className="modal"; d.id="modal";
  d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="vt">
    <div class="sheet-h"><h2 id="vt">Голос учителя</h2><button class="sound" id="vclose" aria-label="Закрыть">✕</button></div>
    <p class="vnote">Нажми на голос, чтобы послушать. Выбери тот, который звучит понятнее всего.</p>
    <h3 class="vh">Скорость</h3>
    <div class="seg">${RATES.map(r=>`<button class="segb${Math.abs(S.rate-r[0])<.01?" on":""}" data-r="${r[0]}">${r[1]}</button>`).join("")}</div>
    <label class="chk"><input type="checkbox" id="rep" ${S.repeat?"checked":""}> Повторять слово два раза (второй раз медленнее)</label>
    <button class="btn main" id="vtest" style="width:100%;margin-top:4px">🔊 Проверить: «Good morning! My name is Larry.»</button>
    <h3 class="vh">Голоса</h3><div id="vlist" class="vlist"></div>
    <p class="vnote">Совет: самые чистые голоса — с пометками «Natural», «Online» или «Google». Они есть в Chrome и Edge. На iPhone и iPad можно скачать улучшенный голос в настройках устройства.</p>
  </div>`;
  document.body.appendChild(d);
  const close=()=>{ d.remove(); };
  d.onclick=e=>{ if(e.target===d) close(); };
  document.getElementById("vclose").onclick=close;
  d.querySelectorAll(".segb").forEach(b=>b.onclick=()=>{ S.rate=+b.dataset.r; save(); d.querySelectorAll(".segb").forEach(x=>x.classList.toggle("on",x===b)); say("apple", {once:true}); });
  document.getElementById("rep").onchange=e=>{ S.repeat=e.target.checked; save(); };
  document.getElementById("vtest").onclick=()=>say("Good morning! My name is Larry.");
  fillVoices(); setTimeout(fillVoices, 400);
}
let AC=null;
function beep(ok){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880,1175] : [220,180];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*.09;
      o.type = ok ? "triangle" : "square"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(ok?.18:.07,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.2);
    });
  } catch(e){}
}

const modById = id => MODULES.find(m=>m.id===id);
function topBar(extra){
  const t = totalStars();
  return `<div class="top">
    <div class="brand">${extra||`<div class="logo" aria-label="Spotlight 3"><span>S</span><span>p</span><span>o</span><span>t</span><b>light 3</b></div>`}</div>
    <div class="score"><span class="chip"><span class="st">★</span>${t}</span>
    <button class="sound" id="vbtn" aria-label="Голос учителя">🗣️</button>
    <button class="sound" id="snd" aria-label="Звуки ${S.sound?"включены":"выключены"}">${S.sound?"🔔":"🔕"}</button></div></div>`;
}
function bindTop(){
  const vb=document.getElementById("vbtn"); if (vb) vb.onclick=openVoice;
  const b=document.getElementById("snd");
  if (b) b.onclick=()=>{ S.sound=!S.sound; save(); b.textContent=S.sound?"🔔":"🔕"; b.setAttribute("aria-label","Звуки "+(S.sound?"включены":"выключены")); };
}

/* ===== Главный экран: маршрут по модулям ===== */
function home(){
  const t = totalStars(), {r,nx} = rankOf(t);
  const pct = nx ? Math.round((t-r[0])/(nx[0]-r[0])*100) : 100;
  let html = topBar() + `<section class="hello">
     <div><h1>Hello! Let's learn English!</h1><p>Выбирай модуль, играй и собирай звёзды ★</p></div>
     <div class="rank"><div class="big">${r[1]}</div><div>${r[2]}<small>твоё звание</small></div></div>
     <div class="lvlbar"><i style="width:${pct}%"></i></div>
     <div class="lvlnote">${nx ? `До звания «${nx[2]}» ${nx[1]} осталось ${nx[0]-t} ★` : "Ты прошёл весь учебник! Ты настоящий чемпион!"}</div>
   </section>
   <h2 class="sec-title">Маршрут по учебнику</h2><div class="route">`;
  let part = 0;
  MODULES.forEach(m=>{
    if (m.part!==part){ part=m.part; html += `<div class="part">Часть ${part}</div>`; }
    const s = modStars(m.id), max = GAMES.length*3;
    const cls = s===max ? "done" : s>0 ? "started" : "";
    html += `<button class="stop ${cls}" data-m="${m.id}">
      <span class="dot"></span>${S.last===m.id?`<span class="bus" aria-hidden="true">🚌</span>`:""}
      <span class="num" style="background:${m.color}">${m.n}</span>
      <span><span class="eyebrow">${m.id==="s"?"Starter":"Module "+m.n}</span><h3>${esc(m.en)}</h3><span class="ru">${esc(m.ru)}</span></span>
      <span class="mini"><span>★ ${s}/${max}</span><span class="bar"><i style="width:${s/max*100}%"></i></span></span>
    </button>`;
  });
  html += `</div>
  <section class="parents"><h2>Для родителей</h2>
   <ul>
    <li>Всё построено по учебнику Spotlight 3 (Быкова, Дули, Поспелова, Эванс), части 1 и 2: Starter и модули 1–8.</li>
    <li>В каждом модуле есть карточки со словами, фразы и правило, а ещё четыре игры по 8 вопросов. Одна игра занимает 3–5 минут.</li>
    <li>Лучше заниматься понемногу, но каждый день: 10–15 минут. Слова и фразы озвучиваются британским голосом браузера. Если нет звука, проверьте громкость устройства.</li>
    <li>Звёзды сохраняются только на этом устройстве и в этом браузере.</li>
   </ul>
   <button class="link" id="reset">Сбросить прогресс</button><div id="rc"></div>
  </section>`;
  $app.innerHTML = html; bindTop(); window.scrollTo(0,0);
  $app.querySelectorAll(".stop").forEach(b=>b.onclick=()=>moduleView(b.dataset.m,"games"));
  document.getElementById("reset").onclick=()=>{
    document.getElementById("rc").innerHTML = `<div class="confirm">Удалить все звёзды? <button class="btn alt" id="rn">Нет</button><button class="btn main" id="ry" style="background:var(--red)">Да, сбросить</button></div>`;
    document.getElementById("rn").onclick=()=>document.getElementById("rc").innerHTML="";
    document.getElementById("ry").onclick=()=>{ S.stars={}; S.last=null; save(); home(); };
  };
}

/* ===== Экран модуля ===== */
function moduleView(id, tab){
  const m = modById(id); S.last=id; save();
  const tabs = [["games","🎮 Игры"],["words","🃏 Слова"],["phrases","💬 Фразы и правило"]];
  let body = "";
  if (tab==="games"){
    body = `<div class="games">` + GAMES.map(g=>`<button class="game" data-g="${g.id}"><span class="ic">${g.ic}</span><h3>${g.t}</h3><p>${g.d}</p>${starsHTML(starOf(id,g.id))}</button>`).join("") + `</div>`;
  } else if (tab==="words"){
    body = `<p class="hint">Нажми на карточку: услышишь слово и увидишь перевод.</p><div class="words">` +
      m.words.map((w,i)=>`<button class="card" data-i="${i}" aria-label="${esc(w[0])}"><span class="in"><span class="f"><span class="em">${w[2]}</span><span class="w">${esc(w[0])}</span></span><span class="b"><span class="em">${w[2]}</span><span class="t">${esc(w[1])}</span></span></span></button>`).join("") + `</div>`;
  } else {
    body = `<div class="rule"><h3>Запомни: ${esc(m.rule[0])}</h3><p>${esc(m.rule[1])}</p></div><p class="hint">Нажимай на фразы, слушай и повторяй вслух.</p><div class="phr">` +
      m.phrases.map((p,i)=>`<button class="line" data-i="${i}"><span class="spk">🔊</span><span><span class="en">${esc(p[0])}</span><br><span class="ru">${esc(p[1])}</span></span></button>`).join("") + `</div>`;
  }
  $app.innerHTML = topBar(`<button class="back" id="bk">← Маршрут</button>`) + `
    <div class="mhead"><span class="num" style="background:${m.color}">${m.n}</span><div><h1>${esc(m.en)}</h1><p>${esc(m.ru)}</p></div></div>
    <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab" role="tab" aria-selected="${t[0]===tab}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
    ${body}`;
  bindTop(); window.scrollTo(0,0);
  document.getElementById("bk").onclick=home;
  $app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>moduleView(id,b.dataset.t));
  $app.querySelectorAll(".game").forEach(b=>b.onclick=()=>startGame(id,b.dataset.g));
  $app.querySelectorAll(".card").forEach(b=>b.onclick=()=>{ const w=m.words[+b.dataset.i]; if(!b.classList.contains("flip")) say(w[0]); b.classList.toggle("flip"); });
  $app.querySelectorAll(".line").forEach(b=>b.onclick=()=>say(m.phrases[+b.dataset.i][0]));
}

/* ===== Игры ===== */
let G = null;
function buildQuestions(m, gid){
  const N = 8;
  if (gid==="gram") return pickN(m.grammar, N).map(g=>({type:"gram", q:g[0], ans:g[1][0], opts:shuffle(g[1]), ru:g[2]}));
  let pool = m.words;
  if (gid==="spell") pool = pool.filter(w=>/^[A-Za-z]{3,9}$/.test(w[0]));
  let qs = pickN(pool, Math.min(N,pool.length));
  while (qs.length < N) qs = qs.concat(pickN(pool, N-qs.length));
  return qs.map(w=>{
    const others = pickN(m.words.filter(x=>x[0]!==w[0] && x[2]!==w[2]), 3);
    const opts = shuffle([w, ...others]);
    if (gid==="spell") return {type:"spell", w, letters:shuffle(w[0].split("").map((c,i)=>({c,i})))};
    return {type:gid, w, opts};
  });
}
function startGame(mid, gid){
  const m = modById(mid);
  G = {m, gid, qs:buildQuestions(m,gid), i:0, right:0, done:false};
  renderQ();
}
function renderQ(){
  const q = G.qs[G.i], game = GAMES.find(g=>g.id===G.gid);
  let area = "";
  if (q.type==="listen"){
    area = `<p class="task">Послушай и выбери картинку</p><div class="row" style="margin-top:0;align-items:center"><button class="listen" id="play" aria-label="Послушать ещё раз">🔊</button><button class="listen slow" id="slow" aria-label="Послушать медленно">🐢</button></div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt pic" data-i="${i}" aria-label="${esc(o[1])}">${o[2]}</button>`).join("")}</div>`;
  } else if (q.type==="pick"){
    area = `<p class="task">Как это по-английски?</p><div class="qbig">${q.w[2]}</div><div class="qru">${esc(q.w[1])}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join("")}</div>`;
  } else if (q.type==="spell"){
    area = `<p class="task">Собери слово по буквам</p><div class="qbig">${q.w[2]}</div><div class="qru">${esc(q.w[1])}</div>
      <div class="slots" id="slots">${q.w[0].split("").map((_,i)=>`<span class="slot" data-s="${i}"></span>`).join("")}</div>
      <div class="letters">${q.letters.map((l,i)=>`<button class="let" data-k="${i}">${esc(l.c.toLowerCase()===l.c?l.c:l.c)}</button>`).join("")}</div>
      <div class="row"><button class="btn alt" id="hear">🔊 Подсказка</button><button class="btn alt" id="hslow">🐢 Медленно</button><button class="btn alt" id="undo">⌫ Стереть</button></div>`;
  } else {
    area = `<p class="task">Выбери слово, которое подходит</p><div class="qsent">${esc(q.q).replace("___",`<span class="gap" id="gap">?</span>`)}</div>
      <div class="qru" style="font-size:16px;color:var(--muted)">${esc(q.ru)}</div>
      <div class="opts three">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  }
  $app.innerHTML = `<div class="top"><div class="brand"><button class="back" id="quit">✕ Выйти</button></div><div class="score"><span class="chip">${G.i+1} / ${G.qs.length}</span><button class="sound" id="vbtn" aria-label="Голос учителя">🗣️</button></div></div>
    <div class="gtop"><span style="font-size:26px">${game.ic}</span><div class="prog"><i style="width:${G.i/G.qs.length*100}%"></i></div><span class="chip"><span class="st">✓</span>${G.right}</span></div>
    <div class="qbox" id="qbox">${area}</div><div id="fb"></div>`;
  document.getElementById("quit").onclick=()=>moduleView(G.m.id,"games");
  document.getElementById("vbtn").onclick=openVoice;
  if (q.type==="listen"){ document.getElementById("play").onclick=()=>say(q.w[0]); document.getElementById("slow").onclick=()=>{ const r=S.rate; S.rate=.5; say(q.w[0],{once:true}); S.rate=r; }; setTimeout(()=>say(q.w[0]),250); }
  if (q.type==="spell") bindSpell(q);
  else $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  const q = G.qs[G.i], i=+b.dataset.i;
  const chosen = q.type==="gram" ? q.opts[i] : q.opts[i][0];
  const right = q.type==="gram" ? q.ans : q.w[0];
  const ok = chosen===right;
  $app.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; const v = q.type==="gram"?q.opts[j]:q.opts[j][0]; if (v===right) x.classList.add("ok"); });
  if (!ok){ b.classList.add("bad","shake"); }
  if (q.type==="gram"){ const g=document.getElementById("gap"); g.textContent=right; }
  const full = q.type==="gram" ? q.q.replace("___", right) : right;
  feedback(ok, full, q.type==="gram" ? "" : q.w[1]);
}
function bindSpell(q){
  const word = q.w[0]; const placed = [];
  const slots = [...$app.querySelectorAll(".slot")], keys=[...$app.querySelectorAll(".let")];
  const draw = ()=>{ slots.forEach((s,i)=>{ const p=placed[i]; s.textContent = p!=null ? q.letters[p].c : ""; s.classList.toggle("full", p!=null); }); keys.forEach((k,i)=>k.disabled = placed.includes(i) || G.locked); };
  G.locked=false;
  keys.forEach(k=>k.onclick=()=>{
    if (G.locked) return;
    placed.push(+k.dataset.k); draw();
    if (placed.length===word.length){
      G.locked=true;
      const got = placed.map(p=>q.letters[p].c).join("");
      const ok = got.toLowerCase()===word.toLowerCase();
      slots.forEach((s,i)=>{ s.textContent=word[i]; s.classList.add(ok?"ok":"bad"); });
      if(!ok) document.getElementById("slots").classList.add("shake");
      keys.forEach(k=>k.disabled=true);
      document.getElementById("undo").disabled=true;
      feedback(ok, word, q.w[1]);
    }
  });
  document.getElementById("undo").onclick=()=>{ if(!G.locked){ placed.pop(); draw(); } };
  document.getElementById("hear").onclick=()=>say(word);
  document.getElementById("hslow").onclick=()=>{ const r=S.rate; S.rate=.5; say(word,{once:true}); S.rate=r; };
}
function feedback(ok, en, ru){
  if (ok) G.right++;
  beep(ok);
  setTimeout(()=>say(en), ok?300:450);
  const last = G.i===G.qs.length-1;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"ok":"bad"}">
    <span>${ok ? "✅ "+PRAISE[Math.floor(Math.random()*PRAISE.length)] : "Почти! Правильно:"} <span class="ans">${esc(en)}</span>${ru?` <span style="color:var(--muted)">— ${esc(ru)}</span>`:""}</span>
    <button class="next" id="nx">${last?"Готово":"Дальше →"}</button></div>`;
  const nx=document.getElementById("nx"); nx.focus();
  nx.onclick=()=>{ if(last) finish(); else { G.i++; renderQ(); } };
}
function finish(){
  const n = G.qs.length, r = G.right;
  const st = r===n ? 3 : r>=n-2 ? 2 : r>=n/2 ? 1 : 0;
  const before = totalStars(), rb = rankOf(before).r;
  S.stars[G.m.id] = S.stars[G.m.id] || {};
  const prev = S.stars[G.m.id][G.gid]||0;
  if (st>prev) S.stars[G.m.id][G.gid]=st;
  save();
  const ra = rankOf(totalStars()).r, newRank = ra!==rb;
  const title = st===3?"Excellent!":st===2?"Well done!":st===1?"Good try!":"Let's try again!";
  const note = st===3?"Всё правильно! Ты молодец!":st===0?"Ничего страшного. Повтори слова на карточках и попробуй ещё раз!":"Сыграй ещё раз, чтобы получить 3 звезды!";
  $app.innerHTML = topBar() + `<div class="result">
    <div class="bigstars">${[0,1,2].map(i=>`<span class="${i<st?"on":""}">★</span>`).join("")}</div>
    <h1>${title}</h1><p>Правильных ответов: ${r} из ${n}. ${note}</p>
    ${st>prev&&prev>0?`<p>Новый рекорд: было ${prev} ★, стало ${st} ★</p>`:""}
    ${newRank?`<p style="color:var(--ink);font-size:22px">Новое звание: ${ra[1]} ${ra[2]}!</p>`:""}
    <div class="row"><button class="btn main" id="again">Ещё раз</button><button class="btn alt" id="tomod">К модулю</button><button class="btn alt" id="tohome">Маршрут</button></div></div>`;
  bindTop(); say(title);
  if (st===3 || newRank) beep(true);
  document.getElementById("again").onclick=()=>startGame(G.m.id,G.gid);
  document.getElementById("tomod").onclick=()=>moduleView(G.m.id,"games");
  document.getElementById("tohome").onclick=home;
}

home();
</script>
