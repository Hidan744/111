<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Физика 10 Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E6EAF2; --ink:#16203A; --muted:#5B657C; --line:#D5DBE6;
  --navy:#1F2A50; --brass:#B07D3A; --brass-soft:#F3E7D3;
  --mech:#2F6FB5; --mkt:#C0562F; --el:#6B4FB8;
  --ok:#2E8B4E; --ok-soft:#DDF1E3; --bad:#C8423A; --bad-soft:#F9E0DD;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"PT Sans","Segoe UI",system-ui,sans-serif;
  --mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1322; --surface:#171F36; --surface-2:#222C47; --ink:#E8ECF5; --muted:#A2ABC0; --line:#2C3754;
    --navy:#27345F; --brass:#D9A865; --brass-soft:#3A2F1E;
    --mech:#6FA6E6; --mkt:#EE8A63; --el:#A58DEB;
    --ok:#62CF85; --ok-soft:#1C3827; --bad:#FF7C70; --bad-soft:#44221F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1322; --surface:#171F36; --surface-2:#222C47; --ink:#E8ECF5; --muted:#A2ABC0; --line:#2C3754;
  --navy:#27345F; --brass:#D9A865; --brass-soft:#3A2F1E;
  --mech:#6FA6E6; --mkt:#EE8A63; --el:#A58DEB;
  --ok:#62CF85; --ok-soft:#1C3827; --bad:#FF7C70; --bad-soft:#44221F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.f{font-family:var(--mono);white-space:nowrap}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-family:var(--serif);font-weight:700;font-size:20px}
.brand span{color:var(--brass)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.cover{background:var(--navy);color:#F2F4F8;border-radius:16px;padding:22px 22px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.cover .eyebrow{display:inline-block;background:var(--brass);color:#1F2A50;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.cover h1{font-size:clamp(30px,7vw,46px);margin-top:10px}
.cover p{margin:6px 0 0;opacity:.85;max-width:52ch}
.meter{text-align:right}
.meter b{display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--brass)}
.meter small{opacity:.8}
.consts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.consts span{font-family:var(--mono)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.sec h2{font-size:22px}
.exam{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tp{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.tp:hover{border-color:var(--brass)}
.tp .no{font-family:var(--mono);font-size:14px;color:#fff;border-radius:6px;padding:2px 7px;margin-top:2px}
.tp h3{font-size:18px}
.tp .sub{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bars div{font-size:12px;color:var(--muted)}
.bars i{display:block;height:6px;border-radius:6px;background:var(--surface-2);margin-top:3px;overflow:hidden}
.bars i b{display:block;height:100%;background:var(--brass)}

.thead{margin-top:4px}
.thead .ch{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.thead h1{font-size:clamp(26px,5.5vw,34px);margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flist{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.frow .f{font-size:18px;white-space:normal}
.frow span:last-child{color:var(--muted);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--brass)}
.mode h3{font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px;flex:1}
.mode .best{font-weight:700;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}

.prog{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--brass)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.qmeta{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qtext{font-size:19px;margin:8px 0 0;max-width:65ch}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.ansrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ansrow input{width:180px;max-width:100%;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:20px}
.ansrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.ansrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.unit{font-family:var(--mono);font-size:18px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:16px}
.btn.main{background:var(--brass);color:#1F2A50}
.btn.alt{background:var(--surface);border:1px solid var(--line)}
.hint{margin-top:10px;color:var(--muted);font-size:15px}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700;color:var(--ok)}
.fb.bad .h{color:var(--bad)}
.fb ol{margin:8px 0 0;padding-left:22px}
.fb li{padding:2px 0;font-family:var(--mono);font-size:15px}
.fb p{margin:8px 0 0}
.fb .foot{display:flex;justify-content:flex-end;margin-top:10px}
.result{text-align:center;padding-block:24px}
.grade{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;border:4px solid var(--brass);font-family:var(--serif);font-size:60px;color:var(--brass)}
.result h1{margin-top:12px;font-size:28px}
.result p{color:var(--muted)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.review{text-align:left;margin-top:20px;display:grid;gap:8px}
.review div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.review .x{color:var(--bad);font-weight:700}
.about{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15px;color:var(--muted)}
.about h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.about ul{margin:6px 0;padding-left:20px}
.link{background:none;border:0;padding:0;color:var(--bad);font-weight:700;text-decoration:underline}
.confirm{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:600px){
  .topics,.modes{grid-template-columns:1fr}
  .cover{grid-template-columns:1fr}
  .meter{text-align:left}
  .frow{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== Помощники ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function f(x){ if(!isFinite(x)) return "—"; if(x===0) return "0"; const a=Math.abs(x); const s = a>=1000 ? String(Math.round(x)) : String(Number(x.toPrecision(3))); return s.replace(".",",").replace("-","−"); }
const P=(q,ans,unit,steps)=>({kind:"calc",q,ans,unit,steps});
const g=10, K=9e9, GRAV=6.67e-11, NA=6.02e23, RG=8.31, kB=1.38e-23, E0=8.85e-12, QE=1.6e-19, ME=9.1e-31;
const GASES=[["кислород O₂",32],["азот N₂",28],["гелий He",4],["углекислый газ CO₂",44],["водород H₂",2],["вода H₂O",18]];

/* ===== Главы учебника: формулы, теория, генераторы задач ===== */
const SECTIONS=[
 {id:"mech", t:"Механика", color:"var(--mech)"},
 {id:"mkt", t:"Молекулярная физика. Термодинамика", color:"var(--mkt)"},
 {id:"el", t:"Электродинамика", color:"var(--el)"}
];
const TOPICS=[
{id:"kin", s:"mech", t:"Кинематика точки", sub:"Равномерное и равноускоренное движение, свободное падение",
 fm:[["v = v₀ + at","скорость при равноускоренном движении"],["s = v₀t + at²/2","перемещение при равноускоренном движении"],["s = (v² − v₀²)/(2a)","перемещение без времени"],["h = gt²/2, v = gt","свободное падение без начальной скорости"],["h_max = v₀²/(2g)","максимальная высота при броске вверх"],["v_ср = s_общ / t_общ","средняя путевая скорость"]],
 th:[["Материальная точка — это…",["тело, размерами которого можно пренебречь в условиях задачи","очень маленькое тело","тело массой меньше 1 г","точка на чертеже"],"Одно и то же тело может быть точкой в одной задаче и не быть в другой."],
     ["Что характеризует ускорение?",["быстроту изменения скорости","быстроту изменения координаты","путь, пройденный за 1 с","направление движения"],"a = Δv/Δt."],
     ["График v(t) равноускоренного движения — это…",["прямая, наклонённая к оси времени","прямая, параллельная оси времени","парабола","гипербола"],"v = v₀ + at — линейная функция времени."],
     ["Тело брошено вертикально вверх. Ускорение в верхней точке траектории…",["равно g и направлено вниз","равно нулю","равно g и направлено вверх","зависит от массы тела"],"Скорость в верхней точке равна нулю, но ускорение — всё время g."],
     ["Модули пути и перемещения совпадают, когда тело…",["движется прямолинейно в одном направлении","движется по окружности","вернулось в исходную точку","движется с ускорением"],"При повороте или смене направления путь больше модуля перемещения."],
     ["Единица ускорения в СИ",["м/с²","м/с","км/ч","Н"],"[a] = [v]/[t] = (м/с)/с."]],
 gen(L){
  if(L===1){ const k=pick(["v","s","ff","br"]);
   if(k==="v"){ const v0=R(0,10),a=R(1,5),t=R(2,10),v=v0+a*t; return P(`Автомобиль, имея скорость ${v0} м/с, начинает разгоняться с ускорением ${a} м/с². Какую скорость он приобретёт через ${t} с?`,v,"м/с",["v = v₀ + at",`v = ${v0} + ${a}·${t} = ${v} м/с`]); }
   if(k==="s"){ const v0=R(0,10),a=R(1,4),t=R(2,8),s=v0*t+a*t*t/2; return P(`Тело движется с начальной скоростью ${v0} м/с и ускорением ${a} м/с². Какое перемещение оно совершит за ${t} с?`,s,"м",["s = v₀t + at²/2",`s = ${v0}·${t} + ${a}·${t}²/2 = ${f(s)} м`]); }
   if(k==="ff"){ const t=R(1,5),h=5*t*t; return P(`Тело свободно падает без начальной скорости с высоты ${h} м. Сколько времени длится падение? (g = 10 м/с²)`,t,"с",["h = gt²/2 ⇒ t = √(2h/g)",`t = √(2·${h}/10) = √${2*h/10} = ${t} с`]); }
   const v0=R(10,30),a=R(2,6),s=v0*v0/(2*a); return P(`Автомобиль, двигавшийся со скоростью ${v0} м/с, тормозит с ускорением ${a} м/с². Найдите тормозной путь.`,s,"м",["s = v₀²/(2a) (конечная скорость 0)",`s = ${v0}²/(2·${a}) = ${v0*v0}/${2*a} = ${f(s)} м`]);
  }
  const k=pick(["up","hor","avg","meet"]);
  if(k==="up"){ const v0=R(10,40),h=v0*v0/20; return P(`Мяч бросили вертикально вверх со скоростью ${v0} м/с. На какую максимальную высоту он поднимется? Сопротивлением воздуха пренебречь.`,h,"м",["h_max = v₀²/(2g)",`h = ${v0}²/(2·10) = ${f(h)} м`]); }
  if(k==="hor"){ const t=R(1,4),h=5*t*t,v0=R(5,20),Lr=v0*t; return P(`Камень брошен горизонтально с высоты ${h} м со скоростью ${v0} м/с. На каком расстоянии по горизонтали он упадёт?`,Lr,"м",["Время падения: t = √(2h/g)",`t = √(2·${h}/10) = ${t} с`,"По горизонтали движение равномерное: L = v₀t",`L = ${v0}·${t} = ${Lr} м`]); }
  if(k==="avg"){ const v1=pick([40,60,80]),v2=pick([30,50,90,100]),t1=R(1,3),t2=R(1,3),s1=v1*t1,s2=v2*t2,va=(s1+s2)/(t1+t2); return P(`Автомобиль проехал ${s1} км со скоростью ${v1} км/ч, а затем ${s2} км со скоростью ${v2} км/ч. Найдите среднюю скорость на всём пути.`,va,"км/ч",[`t₁ = ${s1}/${v1} = ${t1} ч, t₂ = ${s2}/${v2} = ${t2} ч`,"v_ср = (s₁ + s₂)/(t₁ + t₂)",`v_ср = ${s1+s2}/${t1+t2} = ${f(va)} км/ч`]); }
  const v1=R(40,90),v2=R(40,90),t=R(1,4),d=(v1+v2)*t; return P(`Из двух городов, расстояние между которыми ${d} км, навстречу друг другу одновременно выехали машины со скоростями ${v1} и ${v2} км/ч. Через сколько часов они встретятся?`,t,"ч",["Скорость сближения: v = v₁ + v₂",`v = ${v1} + ${v2} = ${v1+v2} км/ч`,`t = ${d}/${v1+v2} = ${t} ч`]);
 }},
{id:"circ", s:"mech", t:"Движение по окружности", sub:"Период, частота, угловая скорость, центростремительное ускорение",
 fm:[["T = t/N, n = N/t, T = 1/n","период и частота обращения"],["v = 2πR/T = 2πRn","линейная скорость"],["ω = 2π/T = 2πn","угловая скорость"],["v = ωR","связь линейной и угловой скорости"],["a = v²/R = ω²R","центростремительное ускорение"]],
 th:[["Куда направлено ускорение при равномерном движении по окружности?",["к центру окружности","по касательной","от центра","вдоль скорости"],"Это центростремительное ускорение."],
     ["Равномерное движение по окружности — это движение…",["с ускорением: направление скорости меняется","без ускорения","с постоянным вектором скорости","равноускоренное прямолинейное"],"Модуль скорости постоянен, а направление меняется."],
     ["Период обращения — это…",["время одного полного оборота","число оборотов за 1 с","угол поворота за 1 с","радиус окружности"],"T измеряется в секундах."],
     ["Как связаны период T и частота n?",["T = 1/n","T = n","T = 2πn","T = n²"],"Частота — число оборотов за единицу времени."],
     ["Скорость тела на окружности увеличили в 2 раза (R не изменился). Центростремительное ускорение…",["увеличилось в 4 раза","увеличилось в 2 раза","не изменилось","уменьшилось в 2 раза"],"a = v²/R — квадратичная зависимость от v."]],
 gen(L){
  if(L===1){ const k=pick(["v","a","w"]);
   if(k==="v"){ const Rr=R(1,10),T=R(2,10),v=2*Math.PI*Rr/T; return P(`Точка движется по окружности радиусом ${Rr} м с периодом ${T} с. Найдите её линейную скорость.`,v,"м/с",["v = 2πR/T",`v = 2·3,14·${Rr}/${T} ≈ ${f(v)} м/с`]); }
   if(k==="a"){ const v=R(2,20),Rr=R(1,20),a=v*v/Rr; return P(`Автомобиль проходит закругление радиусом ${Rr} м со скоростью ${v} м/с. Чему равно центростремительное ускорение?`,a,"м/с²",["a = v²/R",`a = ${v}²/${Rr} = ${f(a)} м/с²`]); }
   const n=R(1,10),w=2*Math.PI*n; return P(`Колесо делает ${n} оборотов в секунду. Найдите его угловую скорость.`,w,"рад/с",["ω = 2πn",`ω = 2·3,14·${n} ≈ ${f(w)} рад/с`]);
  }

     ["Сопротивление металла при нагревании…",["увеличивается","уменьшается","не меняется","становится нулевым"],"Растёт амплитуда колебаний ионов решётки."],
     ["Закон электролиза Фарадея",["m = kIt","m = kU","m = It/k","m = kI²t"],"Масса вещества пропорциональна прошедшему заряду."],
     ["Носители тока в электролитах",["положительные и отрицательные ионы","электроны","дырки","нейтроны"],"Ионная проводимость."],
     ["Сверхпроводимость — это…",["исчезновение сопротивления при очень низкой температуре","очень большое сопротивление","ток в вакууме","пробой изолятора"],"Открыта Камерлинг-Оннесом в 1911 году."],
     ["Собственная проводимость полупроводника обусловлена…",["электронами и дырками","только ионами","только протонами","фотонами"],"При разрыве связей появляются пары электрон–дырка."]],
 gen(L){
  if(L===1){ const k=pick(["el","N"]);
   if(k==="el"){ const I=R(1,10),t=R(1,6)*10,m=0.33e-3*I*t*60; return P(`Через раствор медного купороса ${t} мин пропускали ток ${I} А. Сколько граммов меди выделилось на катоде? k = 0,33 мг/Кл.`,m,"г",["m = kIt",`m = 0,33·10⁻⁶·${I}·${t*60} кг ≈ ${f(m)} г`]); }
   const q=R(1,9)*0.16,N=q/QE/1e18; return P(`Через проводник прошёл заряд ${f(q)} Кл. Сколько электронов прошло? Ответ дайте в единицах 10¹⁸.`,N,"·10¹⁸",["N = q/e",`N = ${f(q)}/(1,6·10⁻¹⁹) = ${f(N)}·10¹⁸`]);
  }
  const k=pick(["time","RT"]);
  if(k==="time"){ const I=R(1,5),m=R(1,10)/2,t=m/(0.33e-3*I)/60; return P(`Сколько минут нужно пропускать ток ${I} А через раствор медного купороса, чтобы получить ${f(m)} г меди? k = 0,33 мг/Кл.`,t,"мин",["m = kIt ⇒ t = m/(kI)",`t = ${f(m)}/(0,33·10⁻³·${I}) ≈ ${f(t*60)} с ≈ ${f(t)} мин`]); }
  const R0=R(10,50),t=R(2,20)*10,Rt=R0*(1+0.0043*t); return P(`Сопротивление медной обмотки при 0 °C равно ${R0} Ом. Найдите её сопротивление при ${t} °C. α = 0,0043 К⁻¹.`,Rt,"Ом",["R = R₀(1 + αt)",`R = ${R0}·(1 + 0,0043·${t}) ≈ ${f(Rt)} Ом`]);
 }}
];
TOPICS.forEach((t,i)=>t.no=i+1);
const MODES=[["th","Теория","Тест по понятиям и формулам главы"],["b","Задачи: базовый","Задачи в одно действие"],["a","Задачи: углублённый","Задачи в два действия и больше"]];
const NQ=8;

/* ===== Состояние ===== */
const KEY="physics10-tutor";
let S={best:{}, last:null};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const best=(t,m)=>(S.best[t]&&S.best[t][m])||0;
const topicMastery=t=>Math.round((best(t,"th")+best(t,"b")+best(t,"a"))/3);
const totalMastery=()=>Math.round(TOPICS.reduce((a,t)=>a+topicMastery(t.id),0)/TOPICS.length);
const grade=p=>p>=90?5:p>=75?4:p>=50?3:2;
const byId=id=>TOPICS.find(t=>t.id===id);
const secOf=id=>SECTIONS.find(s=>s.id===id);
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== Главный экран ===== */
function home(){
  const tm=totalMastery();
  let h=`<div class="bar"><div class="brand">Физика <span>10</span></div><span class="pill">Освоено: ${tm}%</span></div>
  <section class="cover">
    <div><span class="eyebrow">Классический курс</span><h1>Физика 10</h1>
    <p>Тренажёр по учебнику Г. Я. Мякишева, Б. Б. Буховцева, Н. Н. Сотского. Базовый и углублённый уровни.</p></div>
    <div class="meter"><b>${tm}%</b><small>курса освоено</small></div>
  </section>
  <div class="consts">Константы в задачах: <span>g = 10 м/с²</span><span>R = 8,31 Дж/(моль·К)</span><span>N_A = 6,02·10²³</span><span>k = 9·10⁹ Н·м²/Кл²</span><span>e = 1,6·10⁻¹⁹ Кл</span></div>`;
  SECTIONS.forEach(sec=>{
    h+=`<div class="sec"><h2 style="color:${sec.color}">${sec.t}</h2><button class="exam" data-sec="${sec.id}">Контрольная по разделу</button></div><div class="topics">`;
    TOPICS.filter(t=>t.s===sec.id).forEach(t=>{
      h+=`<button class="tp" data-t="${t.id}"><span class="no" style="background:${sec.color}">${String(t.no).padStart(2,"0")}</span><span><h3>${t.t}</h3><span class="sub">${t.sub}</span>
       <span class="bars">${MODES.map(m=>`<div>${m[0]==="th"?"Теория":m[0]==="b"?"Базовый":"Углубл."} ${best(t.id,m[0])}%<i><b style="width:${best(t.id,m[0])}%"></b></i></div>`).join("")}</span></span></button>`;
    });
    h+=`</div>`;
  });
  h+=`<section class="about"><h2>Как устроен тренажёр</h2><ul>
    <li>16 тем по главам учебника: механика, молекулярная физика и термодинамика, электродинамика.</li>
    <li>В каждой теме есть шпаргалка с формулами, тест по теории и задачи двух уровней. Задачи каждый раз создаются заново с новыми числами.</li>
    <li>Ответ засчитывается с точностью до 2%, поэтому округлять можно. Десятичную дробь можно писать и через запятую, и через точку.</li>
    <li>После каждого ответа показывается решение по шагам. Оценка: 90% и выше — «5», от 75% — «4», от 50% — «3».</li>
    <li>Прогресс хранится только в этом браузере.</li></ul>
    <button class="link" id="reset">Сбросить прогресс</button><div id="rc"></div></section>`;
  $app.innerHTML=h; window.scrollTo(0,0);
  $app.querySelectorAll(".tp").forEach(b=>b.onclick=()=>topicView(b.dataset.t,"fm"));
  $app.querySelectorAll(".exam").forEach(b=>b.onclick=()=>startExam(b.dataset.sec));
  document.getElementById("reset").onclick=()=>{
    document.getElementById("rc").innerHTML=`<div class="confirm">Удалить весь прогресс? <button class="btn alt" id="rn">Нет</button><button class="btn main" id="ry">Да, сбросить</button></div>`;
    document.getElementById("rn").onclick=()=>document.getElementById("rc").innerHTML="";
    document.getElementById("ry").onclick=()=>{ S.best={}; save(); home(); };
  };
}

/* ===== Экран темы ===== */
function topicView(id,tab){
  const t=byId(id), sec=secOf(t.s); S.last=id; save();
  const body = tab==="fm"
    ? `<div class="flist">${t.fm.map(x=>`<div class="frow"><span class="f">${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div>`
    : `<div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m[0]}"><h3>${m[1]}</h3><p>${m[2]}. ${NQ} заданий.</p><span class="best">Лучший результат: ${best(id,m[0])}%</span></button>`).join("")}</div>
       <p class="note">Совет: сначала повторите формулы, затем пройдите тест по теории и только потом решайте задачи.</p>`;
  $app.innerHTML=`<div class="bar"><button class="back" id="bk">← Все темы</button><span class="pill">Освоено: ${topicMastery(id)}%</span></div>
   <div class="thead"><div class="ch" style="color:${sec.color}">${sec.t} · тема ${t.no}</div><h1>${t.t}</h1></div>
   <div class="tabs" role="tablist"><button class="tab" role="tab" data-v="fm" aria-selected="${tab==="fm"}">Формулы</button><button class="tab" role="tab" data-v="pr" aria-selected="${tab==="pr"}">Тренировка</button></div>${body}`;
  window.scrollTo(0,0);
  document.getElementById("bk").onclick=home;
  $app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>topicView(id,b.dataset.v));
  $app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>startRun(id,b.dataset.m));
}

/* ===== Прохождение ===== */
let G=null;
function thQ(t,item){ const [q,opts,why]=item; return {kind:"mc",q,ans:opts[0],opts:shuffle(opts),why,topic:t.t}; }
function startRun(id,mode){
  const t=byId(id); let qs;
  if(mode==="th") qs=shuffle(t.th).slice(0,Math.min(NQ,t.th.length)).map(x=>thQ(t,x));
  else { qs=[]; const seen=new Set(); for(let i=0;qs.length<NQ&&i<100;i++){ const q=t.gen(mode==="b"?1:2); if(!seen.has(q.q)){ seen.add(q.q); q.topic=t.t; qs.push(q); } } }
  G={id,mode,qs,i:0,right:0,wrong:[]}; renderQ();
}
function startExam(secId){
  const tps=TOPICS.filter(t=>t.s===secId), qs=[];
  for(let i=0;i<10;i++){ const t=tps[i%tps.length]; const q=t.gen(i<5?1:2); q.topic=t.t; qs.push(q); }
  G={id:null,sec:secId,mode:"exam",qs:shuffle(qs),i:0,right:0,wrong:[]}; renderQ();
}
function renderQ(){
  const q=G.qs[G.i];
  const title=G.mode==="exam"?`Контрольная · ${secOf(G.sec).t}`:`${byId(G.id).t} · ${MODES.find(m=>m[0]===G.mode)[1]}`;
  const inp = q.kind==="mc"
    ? `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`
    : `<div class="ansrow"><label for="ans" class="unit" style="font-family:var(--sans)">Ответ:</label><input id="ans" inputmode="${q.ans<0?"text":"decimal"}" autocomplete="off" placeholder="${q.ans<0?"например, −5":"число"}"><span class="unit">${q.unit}</span><button class="btn main" id="chk">Проверить</button><button class="btn alt" id="hnt">Подсказка</button></div><div class="hint" id="hintbox" hidden>Формула: <span class="f">${q.steps[0]}</span></div>`;
  $app.innerHTML=`<div class="bar"><button class="back" id="quit">✕ Выйти</button><span class="pill">${G.i+1} / ${G.qs.length}</span></div>
   <div style="display:flex;align-items:center;gap:10px"><div class="prog"><i style="width:${G.i/G.qs.length*100}%"></i></div><span class="pill">✓ ${G.right}</span></div>
   <div class="qcard"><div class="qmeta">${esc(title)}${G.mode==="exam"?` · ${esc(q.topic)}`:""}</div><p class="qtext">${q.q}</p>${inp}</div><div id="fb"></div>`;
  window.scrollTo(0,0);
  document.getElementById("quit").onclick=()=>G.id?topicView(G.id,"pr"):home();
  if(q.kind==="mc") $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>chooseMC(b));
  else {
    const inpEl=document.getElementById("ans"); inpEl.focus({preventScroll:true});
    inpEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checkCalc(); } });
    document.getElementById("chk").onclick=checkCalc;
    document.getElementById("hnt").onclick=()=>{ document.getElementById("hintbox").hidden=false; };
  }
}
function parseNum(s){ s=String(s).trim().replace(/\s+/g,"").replace(",",".").replace(/[−–]/g,"-"); if(!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN; return parseFloat(s); }
function checkCalc(){
  const q=G.qs[G.i], el=document.getElementById("ans"); if(el.disabled) return;
  const v=parseNum(el.value);
  if(isNaN(v)){ el.classList.add("bad"); el.placeholder="введите число"; el.value=""; setTimeout(()=>el.classList.remove("bad"),600); return; }
  const ok=Math.abs(v-q.ans)<=Math.max(Math.abs(q.ans)*0.02,1e-9);
  el.disabled=true; el.classList.add(ok?"ok":"bad");
  document.getElementById("chk").disabled=true; document.getElementById("hnt").disabled=true;
  feedback(ok,`<ol>${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`,`${f(q.ans)} ${q.unit}`);
}
function chooseMC(b){
  const q=G.qs[G.i], ok=q.opts[+b.dataset.i]===q.ans;
  $app.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(q.opts[j]===q.ans) x.classList.add("ok"); });
  if(!ok) b.classList.add("bad");
  feedback(ok,`<p>${q.why}</p>`,q.ans);
}
function feedback(ok,expl,ansText){
  const q=G.qs[G.i]; if(ok) G.right++; else G.wrong.push({q:q.q,a:ansText});
  const last=G.i===G.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok?"Верно":"Неверно. Правильный ответ: "+esc(ansText)}</div>${expl}<div class="foot"><button class="btn main" id="nx">${last?"Результат":"Далее →"}</button></div></div>`;
  const nx=document.getElementById("nx"); nx.focus({preventScroll:true});
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
  nx.onclick=()=>{ if(last) finish(); else { G.i++; renderQ(); } };
}
function finish(){
  const pc=Math.round(G.right/G.qs.length*100), gr=grade(pc);
  let rec="";
  if(G.id){ S.best[G.id]=S.best[G.id]||{}; const prev=S.best[G.id][G.mode]||0; if(pc>prev){ S.best[G.id][G.mode]=pc; if(prev>0) rec=`<p>Новый лучший результат: ${prev}% → ${pc}%</p>`; } save(); }
  const msg=gr===5?"Отлично!":gr===4?"Хорошо":gr===3?"Удовлетворительно":"Нужно повторить";
  $app.innerHTML=`<div class="bar"><div class="brand">Физика <span>10</span></div><span class="pill">Освоено: ${totalMastery()}%</span></div>
   <div class="result"><div class="grade">${gr}</div><h1>${msg}</h1><p>Верно ${G.right} из ${G.qs.length} (${pc}%)</p>${rec}
   ${G.wrong.length?`<div class="review"><b>Над чем поработать:</b>${G.wrong.map(w=>`<div>${w.q}<br><span class="x">Ответ: ${esc(w.a)}</span></div>`).join("")}</div>`:""}
   <div class="row"><button class="btn main" id="again">Ещё раз</button>${G.id?`<button class="btn alt" id="tt">К теме</button>`:""}<button class="btn alt" id="hm">Все темы</button></div></div>`;
  window.scrollTo(0,0);
  document.getElementById("again").onclick=()=>G.mode==="exam"?startExam(G.sec):startRun(G.id,G.mode);
  const tt=document.getElementById("tt"); if(tt) tt.onclick=()=>topicView(G.id,"pr");
  document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
