<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Мой фитнес-тренер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#E3E8E6; --ink:#171B1A; --muted:#5E6966; --line:#D3DAD7;
  --accent:#F0533A; --accent-ink:#FFFFFF; --accent-soft:#FDE3DD;
  --teal:#1B7F70; --teal-soft:#D7EEE9; --warn:#B7791F; --warn-soft:#FBEFD9;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1211; --surface:#181D1C; --surface-2:#232A28; --ink:#EDF2F0; --muted:#9AA7A3; --line:#2C3432;
    --accent:#FF6B52; --accent-ink:#1A0F0C; --accent-soft:#3A1E18;
    --teal:#4CC2AE; --teal-soft:#16302B; --warn:#E3A948; --warn-soft:#352A15;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1211; --surface:#181D1C; --surface-2:#232A28; --ink:#EDF2F0; --muted:#9AA7A3; --line:#2C3432;
  --accent:#FF6B52; --accent-ink:#1A0F0C; --accent-soft:#3A1E18;
  --teal:#4CC2AE; --teal-soft:#16302B; --warn:#E3A948; --warn-soft:#352A15;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px}
.logo{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.logo b{color:var(--accent)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav button{border:0;background:none;border-radius:10px;padding:6px 4px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.hero{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px;display:grid;gap:14px}
.hero .lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hero h1{font-size:clamp(28px,7vw,40px)}
.hero p{margin:0;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.hero .chip{background:rgba(255,255,255,.12);color:inherit}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--surface);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:#fff}
.btn.wide{width:100%}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec h2{font-size:20px}
.sec small{color:var(--muted);font-weight:600}
.days{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.day.next{border:2px solid var(--accent)}
.day .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day h3{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase}
.day .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.day ol{margin:8px 0 10px;padding-left:20px;color:var(--muted)}
.day li{padding:1px 0}
.day li b{color:var(--ink);font-weight:700}
.note{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px}
.warn{background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px}

.exc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.exc.done{border-color:var(--teal)}
.exc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exc h3{font-size:17px;font-weight:800}
.exc .meta{font-size:13px;color:var(--muted);font-weight:600}
.exc .sug{font-size:13px;font-weight:700;color:var(--teal);margin-top:4px}
.small{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.set .n{font-weight:800;color:var(--muted);text-align:center}
.set label{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 8px;min-width:0}
.set input{width:100%;min-width:0;border:0;background:none;padding:9px 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.set input:focus{outline:none}
.set label:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.set label span{font-size:12px;color:var(--muted);font-weight:700}
.tick{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800;color:var(--muted)}
.tick.on{background:var(--teal);border-color:var(--teal);color:#fff}
.tech{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.tech ul{margin:4px 0;padding-left:18px}
.tech .err{color:var(--accent);font-weight:700}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alts .small{white-space:normal;text-align:left;max-width:100%}


.form{display:grid;gap:18px}
.field h3{font-size:15px;font-weight:800;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.o{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.o b{display:block;font-size:15px}
.o span{font-size:13px;color:var(--muted)}
.o[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.opts.four .o,.opts.three .o{text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.hist{display:grid;gap:8px}
.hrow{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hrow b{font-weight:800}
.wform{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wform input{flex:1;min-width:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700}
.chart{width:100%;height:auto;margin-top:8px;display:block}
.lib details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
.lib summary{font-weight:800;cursor:pointer}
.lib summary span{font-weight:600;color:var(--muted);font-size:13px}
.lib ul{margin:6px 0;padding-left:18px;font-size:14px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}
@media (max-width:560px){
  .opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{gap:8px}
  .stat b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ===== Упражнения (зал) ===== */

 goblet:{n:"Гоблет-присед с гантелью",g:"Ноги и ягодицы",u:"kg",lim:["knee"],cues:["Гантель у груди, локти вниз","Садись между пяток, колени смотрят туда же, куда носки","Спина ровная, опускайся до параллели бедра с полом или чуть ниже"],err:"Колени заваливаются внутрь, пятки отрываются от пола"},

/* ===== Генерация программы ===== */
function allowed(id){ return !E[id].lim.some(l=>S.profile.limits.includes(l)) && !(E[id].adv && S.profile.level==="beg"); }
function eqScore(id){ const e=EQ[id], pref=S.profile.equip||"mix"; if(pref==="machines") return (e==="m"||e==="c")?0:(e==="db"||e==="bw")?1:2; if(pref==="free") return (e==="bb"||e==="db"||e==="kb")?0:(e==="bw"||e==="c")?1:2; return 0; }
function byPref(list){ return list.map((c,i)=>[c,i]).sort((a,b)=>eqScore(a[0])-eqScore(b[0])||a[1]-b[1]).map(x=>x[0]); }
function plan(){
  const p=S.profile, keys=WEEK[p.focus][p.days], seen={}, slotN={};
  return keys.map((k,di)=>{
    const tpl=TPL[k], variant=seen[k]=(seen[k]||0)+1;
    let slots=tpl.s.slice();
    let n=6+(p.dur===75?1:0)-(p.dur===45?1:0)-(p.level==="beg"?1:0);
    n=Math.max(4,n);
    ["abd","delt","calf","core"].forEach(x=>{ if(slots.length<n && !slots.includes(x)) slots.push(x); });
    slots=slots.slice(0,n);
    const used=new Set();
    const ex=slots.map((sl,si)=>{
      const key=`${di}:${si}`;
      let id=S.swaps[key];
      if(!id || !allowed(id) || used.has(id)){
        const cands=byPref(SLOTS[sl].filter(c=>allowed(c)&&!used.has(c)));
        const top=cands.filter(c=>eqScore(c)===eqScore(cands[0]||c));
        const pool=top.length?top:Object.keys(E).filter(c=>allowed(c)&&!used.has(c)&&E[c].g===E[SLOTS[sl][0]].g);
        const idx=(slotN[sl]||0)+variant-1;
        id=pool.length?pool[idx%pool.length]:SLOTS.core.find(c=>!used.has(c)&&allowed(c))||"plank";
      }
      slotN[sl]=(slotN[sl]||0)+1;
      used.add(id);
      return {id,slot:sl,key};
    });
    return {di,key:k,title:tpl.t,ex};
  });
}
function scheme(id){
  const g=GOALS[S.profile.goal], lv=S.profile.level; const u=E[id].u;
  let sets=g.sets+(lv==="adv"&&S.profile.goal==="muscle"?1:0)-(lv==="beg"&&S.profile.goal!=="loss"?0:0);
  let reps=g.reps;
  if(u==="sec") reps=lv==="beg"?"20–30 с":lv==="mid"?"30–45 с":"45–60 с";
  else if(id==="deadbug") reps="8–10 на сторону";
  else if(id==="kbgetup") reps="3–5 на сторону";
  else if(id==="kbhalo") reps="8–10 в каждую сторону";
  else if(id==="kbswing") reps="15–20";
  else if(S.profile.goal==="muscle"&&["bbsquat","frontsquat","deadlift","sumodl","bench","ohp","hacksquat"].includes(id)) reps="6–10";
  if(["lunge","bulgarian","stepup","kickback","cableabd","dbrow","bbrevlunge","glutemachine","kbrow","kbpress","cablelateral"].includes(id)) reps=reps+" на сторону";
  return {sets,reps,rest:g.rest};
}
function topReps(r){ const m=String(r).match(/(\d+)(?:–(\d+))?/); return m?+(m[2]||m[1]):10; }

 lib:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 8h6M9 12h6"/></svg>'
};
function nav(){
  const items=[["plan","Программа"],["prog","Прогресс"],["lib","Упражнения"]];
  document.getElementById("nav").innerHTML=items.map(([k,t])=>`<button data-k="${k}" ${S.tab===k?'aria-current="page"':""}>${ICONS[k]}${t}${k==="plan"&&S.active?" •":""}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(tab){ S.tab=tab; S.setup=false; save(); render(); window.scrollTo(0,0); }
function render(){
  nav();
  if(S.setup) return setupView();
  if(S.tab==="work") S.tab="plan";
  ({plan:planView,prog:progView,lib:libView})[S.tab]();
}

/* ===== Программа ===== */
function planView(){
  if(S.active) return workView();
  const p=S.profile, g=GOALS[p.goal], pl=plan(), nd=nextDay();
  const week=S.sessions.filter(s=>Date.now()-s.end<7*864e5).length;
  const minsAll=S.sessions.reduce((a,s)=>a+Math.max(1,Math.round((s.end-s.start)/60000)),0);
  const firstRun=!S.sessions.length;
  $app.innerHTML=`<div class="head"><div class="logo">Мой <b>фитнес</b>-тренер</div><button class="ghost" id="edit">Параметры</button></div>
   <section class="hero"><div class="lab">Твоя программа</div><h1>${g.t}</h1>
    <div class="chips"><span class="chip">${LEVELS[p.level][0]}</span><span class="chip">${p.days} трен. в неделю</span><span class="chip">${FOCUS[p.focus][0]}</span><span class="chip">~${p.dur} мин</span><span class="chip">${EQUIP[p.equip||"mix"][0]}</span>${p.limits.map(l=>`<span class="chip">Бережём: ${LIMITS[l].toLowerCase()}</span>`).join("")}</div>
    <p>${g.d}. Отдых между подходами — ${g.rest} с.</p>
    <button class="btn main" id="startNext">Начать: день ${nd+1} — ${pl[nd].title}</button></section>
   ${firstRun?`<div class="note">Это стартовая программа. Нажми «Параметры», чтобы выбрать цель, уровень, число дней, акцент и ограничения. Программа сразу перестроится.</div>`:""}
   <div class="stats"><div class="stat"><b class="num">${S.sessions.length}</b><span>тренировок всего</span></div><div class="stat"><b class="num">${week}/${p.days}</b><span>за 7 дней</span></div><div class="stat"><b class="num">${minsAll>=120?Math.round(minsAll/60)+" ч":minsAll+" мин"}</b><span>в зале</span></div></div>
   <div class="sec"><h2>Неделя</h2><small>Дни идут по кругу</small></div>
   <div class="days">${pl.map(d=>`<div class="day ${d.di===nd?"next":""}"><div class="top"><div><div class="tag">День ${d.di+1}${d.di===nd?" · следующая":""}</div><h3>${d.title}</h3></div><button class="small" data-start="${d.di}">Начать</button></div>
     <ol>${d.ex.map(e=>{const sc=scheme(e.id);return `<li><b>${E[e.id].n}</b> <span class="chip" style="font-size:11px;padding:1px 7px">${EQN[EQ[e.id]]}</span> — ${sc.sets} × ${sc.reps}</li>`;}).join("")}</ol>
     <div class="muted" style="font-size:14px">В конце: ${g.fin}</div></div>`).join("")}</div>
   <div class="warn">Перед началом тренировок проконсультируйся с врачом, особенно если есть хронические заболевания, травмы или беременность. При острой боли упражнение сразу прекращай.</div>`;
  document.getElementById("edit").onclick=()=>{ S.setup=true; render(); window.scrollTo(0,0); };
  document.getElementById("startNext").onclick=()=>{ startWorkout(nd); go("plan"); };
  $app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{ startWorkout(+b.dataset.start); go("plan"); });
}

/* ===== Параметры ===== */
function setupView(){
  const p=JSON.parse(JSON.stringify(S.profile)); p.equip=p.equip||"mix";
  const draw=()=>{
    const opt=(group,val,title,sub)=>`<button class="o" data-g="${group}" data-v="${val}" aria-pressed="${group==="limits"?p.limits.includes(val):String(p[group])===String(val)}"><b>${title}</b>${sub?`<span>${sub}</span>`:""}</button>`;
    $app.innerHTML=`<div class="head"><div class="logo">Параметры</div><button class="ghost" id="cancel">Отмена</button></div>
     <div class="form">
      <div class="field"><h3>Цель</h3><div class="opts">${Object.entries(GOALS).map(([k,g])=>opt("goal",k,g.t,g.d)).join("")}</div></div>
      <div class="field"><h3>Уровень подготовки</h3><div class="opts three">${Object.entries(LEVELS).map(([k,l])=>opt("level",k,l[0],l[1])).join("")}</div></div>
      <div class="field"><h3>Тренировок в неделю</h3><div class="opts four">${[2,3,4,5].map(d=>opt("days",d,d,"")).join("")}</div></div>
      <div class="field"><h3>Длительность тренировки</h3><div class="opts three">${[45,60,75].map(d=>opt("dur",d,d+" мин","")).join("")}</div></div>
      <div class="field"><h3>Инвентарь</h3><div class="opts three">${Object.entries(EQUIP).map(([k,f])=>opt("equip",k,f[0],f[1])).join("")}</div></div>
      <div class="field"><h3>Акцент</h3><div class="opts three">${Object.entries(FOCUS).map(([k,f])=>opt("focus",k,f[0],f[1])).join("")}</div></div>
      <div class="field"><h3>Что беречь (можно несколько)</h3><div class="opts three">${Object.entries(LIMITS).map(([k,l])=>opt("limits",k,l,"")).join("")}</div><p class="muted" style="font-size:14px;margin:8px 0 0">Упражнения, которые нагружают выбранную зону, будут заменены на более щадящие.</p></div>
      <button class="btn main wide" id="apply">Сохранить и собрать программу</button>
     </div>
     <div class="card"><h3 style="font-size:16px">Резервная копия</h3><p class="muted" style="font-size:14px;margin:4px 0 0">Все записи хранятся только в этом браузере. Скопируй резервную копию в заметки, чтобы не потерять историю или перенести её на другое устройство.</p>
      <div class="row"><button class="btn alt" id="exp">Показать копию</button><button class="btn alt" id="imp">Восстановить</button></div><div id="bk"></div></div>
     <div class="card"><button class="btn alt" id="reset" style="color:var(--accent)">Удалить все данные</button><div id="rc"></div></div>`;
    document.getElementById("cancel").onclick=()=>{ S.setup=false; render(); };
    $app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{ const g=b.dataset.g,v=b.dataset.v;
      if(g==="limits"){ p.limits=p.limits.includes(v)?p.limits.filter(x=>x!==v):p.limits.concat(v); }
      else p[g]=(g==="days"||g==="dur")?+v:v; draw(); });
    document.getElementById("apply").onclick=()=>{ const changed=p.days!==S.profile.days||p.focus!==S.profile.focus||p.equip!==(S.profile.equip||"mix")||p.level!==S.profile.level; S.profile=p; if(changed) S.swaps={}; S.setup=false; S.tab="plan"; save(); render(); window.scrollTo(0,0); };
    document.getElementById("exp").onclick=()=>{ const data=JSON.stringify({profile:S.profile,sessions:S.sessions,last:S.last,weights:S.weights,swaps:S.swaps});
      document.getElementById("bk").innerHTML=`<textarea id="bkt" readonly>${esc(data)}</textarea><div class="row"><button class="btn teal" id="cp">Скопировать</button><span id="cpm" class="muted"></span></div>`;
      document.getElementById("cp").onclick=()=>{ const t=document.getElementById("bkt"); navigator.clipboard.writeText(t.value).then(()=>{document.getElementById("cpm").textContent="Скопировано";}).catch(()=>{ t.focus(); t.select(); document.getElementById("cpm").textContent="Выделено — скопируй вручную"; }); }; };
    document.getElementById("imp").onclick=()=>{
      document.getElementById("bk").innerHTML=`<label for="imt" class="muted" style="font-size:14px">Вставь сюда сохранённую копию:</label><textarea id="imt"></textarea><div class="row"><button class="btn teal" id="doimp">Восстановить</button><span id="imm" class="muted"></span></div>`;
      document.getElementById("doimp").onclick=()=>{ try{ const d=JSON.parse(document.getElementById("imt").value); if(!d.profile||!Array.isArray(d.sessions)) throw 0; Object.assign(S,{profile:d.profile,sessions:d.sessions,last:d.last||{},weights:d.weights||[],swaps:d.swaps||{}}); save(); document.getElementById("imm").textContent="Готово: данные восстановлены"; }catch(e){ document.getElementById("imm").textContent="Не получилось: это не похоже на копию из тренера"; } }; };
    document.getElementById("reset").onclick=()=>{ document.getElementById("rc").innerHTML=`<div class="row"><span>Удалить историю, веса и настройки?</span><button class="btn alt" id="rn">Нет</button><button class="btn main" id="ry">Да, удалить</button></div>`;
      document.getElementById("rn").onclick=()=>document.getElementById("rc").innerHTML="";
      document.getElementById("ry").onclick=()=>{ S=JSON.parse(JSON.stringify(DEF)); save(); render(); }; };
  };
  draw();
}

/* ===== Тренировка ===== */
function startWorkout(di){
  const d=plan()[di];
  S.active={di,title:d.title,start:Date.now(),open:null,ex:d.ex.map(e=>({id:e.id,key:e.key,slot:e.slot,done:false}))};
  save();
}
function workView(){
  const a=S.active, g=GOALS[S.profile.goal];
  const done=a.ex.filter(e=>e.done).length;
  $app.innerHTML=`<div class="head"><div><div class="logo">День ${a.di+1}</div><div class="muted" style="font-weight:700">${a.title} · сделано ${done} из ${a.ex.length}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="ghost" id="finishTop" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Завершить</button><button class="ghost" id="cancelW">Отменить</button></div></div>
   <div id="cw"></div>
   <div class="note"><b>Разминка 5–7 минут:</b> эллипс или дорожка, затем вращения в суставах.</div>
   ${a.ex.map((e,i)=>{ const x=E[e.id], sc=scheme(e.id);
     return `<div class="exc ${e.done?"done":""}"><div class="top"><div><h3>${i+1}. ${x.n}</h3><div class="meta">${EQN[EQ[e.id]]} · <b style="color:var(--ink)">${sc.sets} × ${sc.reps}</b> · отдых ${sc.rest} с</div></div>
       <button class="tick ${e.done?"on":""}" data-done="${i}" style="min-width:120px;padding:0 12px;font-size:15px;white-space:nowrap" aria-pressed="${e.done}">${e.done?"✓ Сделано":"Сделано"}</button></div>
       <div class="row" style="margin-top:8px"><button class="small" data-tech="${i}">Техника</button><button class="small" data-swap="${i}">Заменить</button></div>
       ${a.open===`t${i}`?`<div class="tech"><ul>${x.cues.map(c=>`<li>${c}</li>`).join("")}</ul><div class="err">Ошибка: ${x.err}</div></div>`:""}
       ${a.open===`s${i}`?`<div class="alts">${byPref(SLOTS[e.slot].filter(c=>c!==e.id&&allowed(c)&&!a.ex.some(y=>y.id===c))).map(c=>`<button class="small" data-alt="${i}:${c}">${E[c].n} · ${EQN[EQ[c]]}</button>`).join("")||'<span class="muted" style="font-size:14px">Подходящих замен нет</span>'}</div>`:""}
     </div>`; }).join("")}
   <div class="note"><b>В конце:</b> ${g.fin}</div>
   <div class="row" style="margin-top:16px"><button class="btn main wide" id="finish">Завершить тренировку</button></div>`;
  $app.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{ const e=a.ex[+b.dataset.done]; e.done=!e.done; save(); render(); });
  $app.querySelectorAll("[data-tech]").forEach(b=>b.onclick=()=>{ a.open=a.open===`t${b.dataset.tech}`?null:`t${b.dataset.tech}`; render(); });
  $app.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{ a.open=a.open===`s${b.dataset.swap}`?null:`s${b.dataset.swap}`; render(); });
  $app.querySelectorAll("[data-alt]").forEach(b=>b.onclick=()=>{ const [i,c]=b.dataset.alt.split(":"); const e=a.ex[+i]; e.id=c; S.swaps[e.key]=c; a.open=null; save(); render(); });
  document.getElementById("cancelW").onclick=()=>{ document.getElementById("cw").innerHTML=`<div class="warn row" style="align-items:center">Отменить тренировку без сохранения? <button class="btn alt" id="cn">Нет</button><button class="btn main" id="cy">Да</button></div>`;
    document.getElementById("cn").onclick=()=>document.getElementById("cw").innerHTML=""; document.getElementById("cy").onclick=()=>{ S.active=null; save(); go("plan"); }; };
  document.getElementById("finish").onclick=finishWorkout;
  document.getElementById("finishTop").onclick=finishWorkout;
}
function finishWorkout(){
  const a=S.active; const ex=a.ex.filter(e=>e.done).map(e=>{ const sc=scheme(e.id); return {id:e.id,sets:sc.sets,reps:sc.reps}; });
  if(!ex.length){ document.getElementById("cw").innerHTML=`<div class="warn">Отметь хотя бы одно упражнение кнопкой «Сделано», чтобы сохранить тренировку.</div>`; window.scrollTo(0,0); return; }
  const sess={di:a.di,title:a.title,start:a.start,end:Date.now(),ex}; S.sessions.push(sess); S.active=null; save();
  const mins=Math.max(1,Math.round((sess.end-sess.start)/60000));
  nav();
  $app.innerHTML=`<div class="head"><div class="logo">Готово!</div></div><section class="hero"><div class="lab">Тренировка сохранена</div><h1>${a.title}</h1>
   <div class="chips"><span class="chip">${mins} мин</span><span class="chip">${plural(ex.length,"упражнение","упражнения","упражнений")}</span></div><p>Отличная работа. Следующая тренировка — день ${nextDay()+1}. Не забудь пить воду и хорошо выспаться.</p></section>
   <div class="row"><button class="btn teal" id="shareNow">Скинуть результат</button><button class="btn main" id="toPlan">К программе</button></div><div id="shareHost"></div>`;
  document.getElementById("toPlan").onclick=()=>go("plan");
  document.getElementById("shareNow").onclick=()=>shareBox(document.getElementById("shareHost"),sess);
}

/* ===== Скинуть результат ===== */
function sessionText(s){
  const mins=Math.max(1,Math.round((s.end-s.start)/60000));
  const d=new Date(s.end).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
  const lines=s.ex.map((e,i)=>{ const x=E[e.id];
    if(Array.isArray(e.sets)) return `${i+1}. ${x.n}: ${e.sets.map(z=>z.w?`${String(z.w).replace(".",",")}×${z.r}`:`${z.r}`).join(", ")}`;
    return `${i+1}. ${x.n} — ${e.sets} × ${e.reps}`; });
  return [`🏋️ Тренировка ${d} — ${s.title}`,`⏱ ${mins} мин · ${plural(s.ex.length,"упражнение","упражнения","упражнений")}`,"",...lines,"",`Цель: ${GOALS[S.profile.goal].t.toLowerCase()} · всего тренировок: ${S.sessions.length}`].join("\n");
}
function shareBox(host,s){
  const txt=sessionText(s);
  host.innerHTML=`<div class="card"><h3 style="font-size:16px">Результат для отправки</h3><p class="muted" style="font-size:14px;margin:4px 0 8px">Скопируй текст и вставь в WhatsApp, Telegram или заметки.</p>
   <textarea readonly aria-label="Текст результата">${esc(txt)}</textarea><div class="row"><button class="btn teal" data-cp>Скопировать</button><span class="muted" data-msg style="align-self:center"></span></div></div>`;
  const t=host.querySelector("textarea"), m=host.querySelector("[data-msg]");
  t.style.minHeight=Math.min(420,60+txt.split("\n").length*20)+"px";
  host.querySelector("[data-cp]").onclick=()=>{ const sel=()=>{ t.focus(); t.select(); m.textContent="Текст выделен — нажми «Копировать» в меню"; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ m.textContent="Скопировано ✓"; }).catch(sel); }catch(e){ sel(); } };
}

/* ===== Прогресс ===== */
function progView(){
  const w=S.weights.slice().sort((a,b)=>a.d-b.d), lastW=w[w.length-1];
  const diff=w.length>1?lastW.kg-w[0].kg:0;
  const week=S.sessions.filter(s=>Date.now()-s.end<7*864e5).length;
  const list=S.sessions.map((s,i)=>[s,i]).reverse().slice(0,20);
  $app.innerHTML=`<div class="head"><div class="logo">Прогресс</div></div>
   <div class="stats" style="margin-top:0">
    <div class="stat"><b class="num">${S.sessions.length}</b><span>тренировок</span></div>
    <div class="stat"><b class="num">${week}/${S.profile.days}</b><span>на этой неделе</span></div>
    <div class="stat"><b class="num">${lastW?String(lastW.kg).replace(".",","):"—"}</b><span>${lastW?(w.length>1?`вес, ${diff>0?"+":diff<0?"−":"±"}${Math.abs(diff).toFixed(1).replace(".",",")} кг`:"вес, кг"):"вес не записан"}</span></div>
   </div>
   <div class="wform"><input id="wkg" inputmode="decimal" placeholder="Мой вес сегодня, кг" aria-label="Мой вес сегодня, кг"><button class="btn teal" id="wadd">Записать</button></div>
   <div id="wmsg" class="muted" style="font-size:14px;margin-top:6px"></div>
   <div class="sec"><h2>Мои тренировки</h2></div>
   ${list.length?`<div class="hist">${list.map(([s,i])=>`<div><div class="hrow" style="align-items:center"><span><b>${fmtD(s.end)}</b> · ${s.title}</span><button class="small" data-share="${i}">Скинуть</button></div><div data-sh="${i}"></div></div>`).join("")}</div>`
     :`<p class="muted">Пока пусто. Нажми «Начать» во вкладке «Программа», а после тренировки — «Завершить». Она появится здесь, и её можно будет скинуть.</p>`}`;
  $app.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.share, h=$app.querySelector(`[data-sh="${i}"]`); if(h.innerHTML) h.innerHTML=""; else shareBox(h,S.sessions[i]); });
  document.getElementById("wadd").onclick=()=>{ const v=parseFloat(document.getElementById("wkg").value.replace(",","."));
    if(!(v>25&&v<300)){ document.getElementById("wmsg").textContent="Введи вес в килограммах, например 62,5"; return; }
    const today=new Date(); today.setHours(12,0,0,0); S.weights=S.weights.filter(x=>new Date(x.d).toDateString()!==today.toDateString()); S.weights.push({d:today.getTime(),kg:v}); save(); render(); };
}

/* ===== Библиотека ===== */
function libView(){
  const groups={}; Object.entries(E).forEach(([id,x])=>{ (groups[x.g]=groups[x.g]||[]).push([id,x]); });
  $app.innerHTML=`<div class="head"><div class="logo">Упражнения</div></div><p class="muted" style="margin-top:0">Техника выполнения и частые ошибки. Упражнения с пометкой «осторожно» тренер не ставит в программу, если в параметрах выбрано беречь эту зону.</p>
   <div class="lib">${Object.entries(groups).map(([g,list])=>`<div class="sec"><h2>${g}</h2></div>${list.map(([id,x])=>`<details><summary>${x.n} <span>· ${EQN[EQ[id]]}${x.adv?" · не для новичков":""}</span> ${x.lim.length?`<span>· осторожно: ${x.lim.map(l=>LIMITS[l].toLowerCase()).join(", ")}</span>`:""}</summary><ul>${x.cues.map(c=>`<li>${c}</li>`).join("")}</ul><div style="font-size:14px;color:var(--accent);font-weight:700">Ошибка: ${x.err}</div></details>`).join("")}`).join("")}</div>`;
}

render();
</script>
</body>
</html>
