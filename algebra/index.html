<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Алгебра 10–11 Тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E6EAF2; --ink:#16203A; --muted:#5B657C; --line:#D5DBE6;
  --navy:#3E3A8C; --brass:#B8407C; --brass-soft:#F6DDEA;
  --c1:#4B47B0; --c2:#A8367A;
  --ok:#2E8B4E; --ok-soft:#DDF1E3; --bad:#C8423A; --bad-soft:#F9E0DD;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"PT Sans","Segoe UI",system-ui,sans-serif;
  --mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1322; --surface:#171F36; --surface-2:#222C47; --ink:#E8ECF5; --muted:#A2ABC0; --line:#2C3754;
    --navy:#2E2B6B; --brass:#EE86BC; --brass-soft:#3F2233;
    --c1:#9C98F0; --c2:#EE86BC;
    --ok:#62CF85; --ok-soft:#1C3827; --bad:#FF7C70; --bad-soft:#44221F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1322; --surface:#171F36; --surface-2:#222C47; --ink:#E8ECF5; --muted:#A2ABC0; --line:#2C3754;
  --navy:#2E2B6B; --brass:#EE86BC; --brass-soft:#3F2233;
  --c1:#9C98F0; --c2:#EE86BC;
  --ok:#62CF85; --ok-soft:#1C3827; --bad:#FF7C70; --bad-soft:#44221F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.f{font-family:var(--mono);white-space:nowrap}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-family:var(--serif);font-weight:700;font-size:20px}
.brand span{color:var(--brass)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.cover{background:var(--navy);color:#F2F4F8;border-radius:16px;padding:22px 22px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.cover .eyebrow{display:inline-block;background:#F6DDEA;color:#3E3A8C;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.cover h1{font-size:clamp(30px,7vw,46px);margin-top:10px}
.cover p{margin:6px 0 0;opacity:.85;max-width:52ch}
.meter{text-align:right}
.meter b{display:block;font-family:var(--serif);font-size:44px;line-height:1;color:#F6DDEA}
.meter small{opacity:.8}
.consts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.consts span{font-family:var(--mono)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.sec h2{font-size:22px}
.exam{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tp{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.tp:hover{border-color:var(--brass)}
.tp .no{font-family:var(--mono);font-size:14px;color:#fff;border-radius:6px;padding:2px 7px;margin-top:2px}
.tp h3{font-size:18px}
.tp .sub{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bars div{font-size:12px;color:var(--muted)}
.bars i{display:block;height:6px;border-radius:6px;background:var(--surface-2);margin-top:3px;overflow:hidden}
.bars i b{display:block;height:100%;background:var(--brass)}

.thead{margin-top:4px}
.thead .ch{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.thead h1{font-size:clamp(26px,5.5vw,34px);margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flist{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.frow .f{font-size:18px;white-space:normal}
.frow span:last-child{color:var(--muted);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--brass)}
.mode h3{font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px;flex:1}
.mode .best{font-weight:700;font-size:14px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}

.prog{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--brass)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.qmeta{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qtext sup,.qtext sub{font-size:.7em}
.opt .f{white-space:normal}
.qtext{font-size:19px;margin:8px 0 0;max-width:65ch}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.ansrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ansrow input{width:180px;max-width:100%;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:20px}
.ansrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.ansrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.unit{font-family:var(--mono);font-size:18px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:16px}
.btn.main{background:var(--brass);color:#fff}
.btn.alt{background:var(--surface);border:1px solid var(--line)}
.hint{margin-top:10px;color:var(--muted);font-size:15px}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .h{font-weight:700;color:var(--ok)}
.fb.bad .h{color:var(--bad)}
.fb ol{margin:8px 0 0;padding-left:22px}
.fb li{padding:2px 0;font-family:var(--mono);font-size:15px}
.fb p{margin:8px 0 0}
.fb .foot{display:flex;justify-content:flex-end;margin-top:10px}
.result{text-align:center;padding-block:24px}
.grade{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;border:4px solid var(--brass);font-family:var(--serif);font-size:60px;color:var(--brass)}
.result h1{margin-top:12px;font-size:28px}
.result p{color:var(--muted)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.review{text-align:left;margin-top:20px;display:grid;gap:8px}
.review div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.review .x{color:var(--bad);font-weight:700}
.about{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15px;color:var(--muted)}
.about h2{font-size:18px;color:var(--ink);margin-bottom:6px}
.about ul{margin:6px 0;padding-left:20px}
.link{background:none;border:0;padding:0;color:var(--bad);font-weight:700;text-decoration:underline}
.confirm{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:600px){
  .topics,.modes{grid-template-columns:1fr}
  .cover{grid-template-columns:1fr}
  .meter{text-align:left}
  .frow{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== Помощники ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function f(x){ if(!isFinite(x)) return "—"; if(Math.abs(x)<1e-12) return "0"; const a=Math.abs(x); const s = a>=1000 ? String(Math.round(x)) : String(Number(x.toPrecision(3))); return s.replace(".",",").replace("-","−"); }
const sg=n=>n<0?`− ${-n}`:`+ ${n}`;
const P=(q,ans,unit,steps)=>({kind:"calc",q,ans,unit,steps});
function M(q,ans,wrong,steps){ const opts=[ans]; for(const w of shuffle(wrong)){ if(opts.length>=4) break; if(!opts.includes(w)) opts.push(w); } return {kind:"mc",q,ans,opts:shuffle(opts),why:`<ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol>`}; }
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(p,q)=>{ const s=(p<0)!==(q<0)?"−":""; p=Math.abs(p); q=Math.abs(q); const d=gcd(p,q); p/=d; q/=d; return q===1?`${s}${p}`:`${s}${p}/${q}`; };
const fact=n=>n<=1?1:n*fact(n-1);
const C=(n,k)=>fact(n)/(fact(k)*fact(n-k));

/* ===== Тригонометрические таблицы ===== */
const SIN={0:"0",30:"1/2",45:"√2/2",60:"√3/2",90:"1",120:"√3/2",135:"√2/2",150:"1/2",180:"0",210:"−1/2",225:"−√2/2",240:"−√3/2",270:"−1",300:"−√3/2",315:"−√2/2",330:"−1/2"};
const COS={0:"1",30:"√3/2",45:"√2/2",60:"1/2",90:"0",120:"−1/2",135:"−√2/2",150:"−√3/2",180:"−1",210:"−√3/2",225:"−√2/2",240:"−1/2",270:"0",300:"1/2",315:"√2/2",330:"√3/2"};
const TG={0:"0",30:"√3/3",45:"1",60:"√3",90:"не существует",120:"−√3",135:"−1",150:"−√3/3",180:"0",210:"√3/3",225:"1",240:"√3",270:"не существует",300:"−√3",315:"−1",330:"−√3/3"};
const RAD={0:"0",30:"π/6",45:"π/4",60:"π/3",90:"π/2",120:"2π/3",135:"3π/4",150:"5π/6",180:"π",210:"7π/6",225:"5π/4",240:"4π/3",270:"3π/2",300:"5π/3",315:"7π/4",330:"11π/6",360:"2π"};
const VALS=["0","1/2","√2/2","√3/2","1","−1/2","−√2/2","−√3/2","−1","√3","√3/3","−√3","−√3/3","не существует"];
const norm=d=>((d%360)+360)%360;
const radOf=d=>d<0?"−"+RAD[-d]:RAD[d];

/* ===== Главы учебника ===== */
const SECTIONS=[
 {id:"g10", t:"10 класс", color:"var(--c1)"},
 {id:"g11", t:"11 класс", color:"var(--c2)"}
];
const TOPICS=[
{id:"prog", s:"g10", ch:"Глава I", t:"Бесконечно убывающая геометрическая прогрессия", sub:"Сумма прогрессии, периодические дроби",
 fm:[["S = b₁/(1 − q), |q| < 1","сумма бесконечно убывающей геометрической прогрессии"],["bₙ = b₁·qⁿ⁻¹","n-й член прогрессии"],["0,(a) = a/9, 0,(ab) = ab/99","периодическая дробь → обыкновенная"]],
 th:[["Геометрическая прогрессия бесконечно убывающая, если…",["|q| < 1","q > 1","q < 0","q = 1"],"Только тогда существует конечная сумма."],
     ["Сумма бесконечно убывающей геометрической прогрессии",["S = b₁/(1 − q)","S = b₁/(1 + q)","S = b₁·q/(1 − q)","S = (b₁ + bₙ)/2"],"Формула из §3."],
     ["Число 0,(3) равно…",["1/3","3/10","1/30","3/100"],"0,333… = 3/9 = 1/3."],
     ["Каждое действительное число — это…",["бесконечная десятичная дробь","конечная десятичная дробь","обыкновенная дробь","целое число"],"Рациональные числа — периодические дроби, иррациональные — непериодические."]],
 gen(L){
  if(L===1){ const qd=pick([2,3,4,5]),neg=Math.random()<.3,b1=R(1,9)*(neg?qd+1:qd-1),q=(neg?-1:1)/qd,S=b1/(1-q);
   return P(`Найдите сумму бесконечно убывающей геометрической прогрессии: b₁ = ${b1}, q = ${neg?"−":""}1/${qd}.`,S,"",["S = b₁/(1 − q)",`S = ${b1}/(1 ${neg?"+":"−"} 1/${qd}) = ${b1}/(${frac(qd+(neg?1:-1),qd)}) = ${f(S)}`]); }
  if(Math.random()<.5){ const two=Math.random()<.5, n=two?R(10,98):R(1,8), den=two?99:9, ans=frac(n,den);
   const wr=[frac(n,two?100:10),frac(n,two?90:99),frac(n+1,den),frac(n,two?999:90)];
   return M(`Запишите периодическую дробь 0,(${two?String(n).padStart(2,"0"):n}) в виде обыкновенной несократимой дроби.`,ans,wr,[`0,(${two?String(n).padStart(2,"0"):n}) = ${n}/${den}`,`Сокращаем: ${ans}`]); }
  const qd=pick([2,3,4]),S=R(2,12)*qd,b1=S*(1-1/qd);
  return P(`Сумма бесконечно убывающей геометрической прогрессии равна ${S}, знаменатель q = 1/${qd}. Найдите первый член b₁.`,b1,"",["S = b₁/(1 − q) ⇒ b₁ = S(1 − q)",`b₁ = ${S}·(1 − 1/${qd}) = ${f(b1)}`]);
 }},
{id:"root", s:"g10", ch:"Глава I", t:"Корень натуральной степени", sub:"Арифметический корень и его свойства",
 fm:[["ⁿ√(aⁿ) = a, a ≥ 0","определение арифметического корня"],["ⁿ√(ab) = ⁿ√a·ⁿ√b","корень из произведения"],["ⁿ√(a/b) = ⁿ√a/ⁿ√b","корень из частного"],["(ⁿ√a)ᵏ = ⁿ√(aᵏ)","возведение корня в степень"],["ⁿ√(ᵏ√a) = ⁿᵏ√a","корень из корня"],["²ᵏ√(a²ᵏ) = |a|","корень чётной степени из чётной степени"]],
 th:[["Корень нечётной степени из отрицательного числа…",["существует и отрицателен","не существует","равен нулю","положителен"],"Например, ∛(−8) = −2."],
     ["√(a²) равен…",["|a|","a","−a","a²"],"Корень чётной степени всегда неотрицателен."],
     ["⁴√(−16)…",["не существует в действительных числах","= −2","= 2","= ±2"],"Корень чётной степени из отрицательного числа не определён."],
     ["ⁿ√a·ⁿ√b равно…",["ⁿ√(ab)","ⁿ√(a + b)","²ⁿ√(ab)","ⁿ√a + ⁿ√b"],"Свойство корня из произведения."]],
 gen(L){
  const T=[[2,4],[2,9],[2,16],[2,25],[3,8],[3,27],[3,64],[3,125],[4,16],[4,81],[5,32],[4,625],[3,216],[6,64]];
  if(L===1){ if(Math.random()<.5){ const [n,v]=pick(T),r=Math.round(Math.pow(v,1/n)); return P(`Вычислите: <span class="f">${n===2?"":n}√${v}</span>`,r,"",[`${r}${n===2?"²":n===3?"³":n===4?"⁴":n===5?"⁵":"⁶"} = ${v}`,`Ответ: ${r}`]); }
   const a=R(2,5),b=R(2,5); return P(`Вычислите: <span class="f">∛${a**3}·∛${b**3}</span>`,a*b,"",["ⁿ√a·ⁿ√b = ⁿ√(ab)",`∛${a**3}·∛${b**3} = ${a}·${b} = ${a*b}`]); }
  const k=pick(["div","neg","mul"]);
  if(k==="div"){ const r=R(2,5),m=pick([2,3,4]),v=m*r**3; return P(`Вычислите: <span class="f">∛${v} : ∛${m}</span>`,r,"",["ⁿ√a : ⁿ√b = ⁿ√(a/b)",`∛(${v}/${m}) = ∛${r**3} = ${r}`]); }
  if(k==="neg"){ const r=R(2,6); return P(`Вычислите: <span class="f">∛(−${r**3}) + ⁴√${(r-1)**4||1}</span>`,-r+Math.max(r-1,1),"",[`∛(−${r**3}) = −${r}`,`⁴√${(r-1)**4||1} = ${Math.max(r-1,1)}`,`−${r} + ${Math.max(r-1,1)} = ${-r+Math.max(r-1,1)}`]); }
  const a=R(2,3),b=R(2,3); return P(`Вычислите: <span class="f">⁴√${a**4*b**4}</span>`,a*b,"",[`${a**4*b**4} = ${a**4}·${b**4}`,`⁴√${a**4}·⁴√${b**4} = ${a}·${b} = ${a*b}`]);
 }},
{id:"pow", s:"g10", ch:"Глава I", t:"Степень с рациональным показателем", sub:"a^(m/n), свойства степеней",
 fm:[["a^(m/n) = ⁿ√(aᵐ), a > 0","определение степени с рациональным показателем"],["aᵖ·a^q = a^(p+q)","умножение степеней"],["aᵖ : a^q = a^(p−q)","деление степеней"],["(aᵖ)^q = a^(pq)","возведение степени в степень"],["a⁻ᵖ = 1/aᵖ","отрицательный показатель"]],
 th:[["a^(1/2) — это…",["√a","a/2","2a","a²"],"Степень 1/n — корень n-й степени."],
     ["aᵖ·a^q равно…",["a^(p+q)","a^(pq)","a^(p−q)","(2a)^(p+q)"],"При умножении показатели складываются."],
     ["(aᵖ)^q равно…",["a^(pq)","a^(p+q)","a^(p/q)","aᵖ + a^q"],"При возведении в степень показатели перемножаются."],
     ["a⁰ при a ≠ 0 равно…",["1","0","a","не определено"],"Любое ненулевое число в нулевой степени равно 1."]],
 gen(L){
  const B=[[8,3],[27,3],[16,4],[81,4],[32,5],[4,2],[9,2],[25,2],[64,3],[64,6]];
  if(L===1){ const [b,n]=pick(B),r=Math.round(Math.pow(b,1/n)),m=R(1,3),neg=Math.random()<.25;
   const val=neg?1/Math.pow(r,m):Math.pow(r,m);
   return P(`Вычислите: <span class="f">${b}<sup>${neg?"−":""}${m}/${n}</sup></span>`,val,"",[`${b} = ${r}${["","","²","³","⁴","⁵","⁶"][n]}`,`${b}^(${neg?"−":""}${m}/${n}) = ${r}^(${neg?"−":""}${m}) = ${neg?"1/"+Math.pow(r,m):Math.pow(r,m)}`]); }
  const k=pick(["mul","pp","div"]);

 th:[["Сколькими способами можно рассадить 3 человек на 3 стула?",["6","3","9","27"],"3! = 6."],
     ["Сочетания отличаются от размещений тем, что…",["порядок элементов не важен","порядок важен","элементы повторяются","берутся все элементы"],"Cₙᵏ = Aₙᵏ/k!."],
     ["Вероятность любого события лежит в пределах…",["от 0 до 1","от −1 до 1","от 0 до 100","от 1 до n"],"0 ≤ P(A) ≤ 1."],
     ["0! равен…",["1","0","не определён","−1"],"По определению."],
     ["Вероятность невозможного события",["0","1","0,5","не определена"],"m = 0."]],
 gen(L){
  if(L===1){ const k=pick(["P","A","C","die"]);
   if(k==="P"){ const n=R(3,6); return P(`Сколькими способами можно выстроить в очередь ${n} человек?`,fact(n),"",[`Pₙ = n!`,`${n}! = ${fact(n)}`]); }
   if(k==="A"){ const n=R(5,10),kk=R(2,3),v=fact(n)/fact(n-kk); return P(`Из ${n} учеников нужно выбрать ${kk===2?"старосту и его заместителя":"старосту, заместителя и казначея"}. Сколькими способами это можно сделать?`,v,"",["Порядок важен — размещения",`A${n}^${kk} = ${n}!/${n-kk}! = ${v}`]); }
   if(k==="C"){ const n=R(5,10),kk=R(2,3),v=C(n,kk); return P(`Сколькими способами можно выбрать ${kk} книги из ${n}?`,v,"",["Порядок не важен — сочетания",`C${n}^${kk} = ${n}!/(${kk}!·${n-kk}!) = ${v}`]); }
   const t=pick([["чётное число очков",3],["число очков больше 4",2],["число очков, кратное 3",2],["6 очков",1]]); return P(`Бросают игральный кубик. Найдите вероятность того, что выпадет ${t[0]}. Ответ дайте десятичной дробью.`,t[1]/6,"",[`Всего исходов n = 6, благоприятных m = ${t[1]}`,`P = ${t[1]}/6 ≈ ${f(t[1]/6)}`]);
  }
  const k=pick(["dice","urn","coins"]);
  if(k==="dice"){ const s=R(4,10); let m=0; for(let a=1;a<=6;a++) for(let b=1;b<=6;b++) if(a+b===s) m++; return P(`Бросают два игральных кубика. Найдите вероятность того, что сумма очков равна ${s}. Ответ округлите до сотых.`,m/36,"",["Всего исходов: 6·6 = 36",`Благоприятных (пары с суммой ${s}): ${m}`,`P = ${m}/36 ≈ ${f(m/36)}`]); }
  if(k==="urn"){ const r=R(3,6),w=R(2,5),n=r+w,v=C(r,2)/C(n,2); return P(`В урне ${r} красных и ${w} белых шаров. Наугад вынимают 2 шара. Найдите вероятность того, что оба красные. Ответ округлите до сотых.`,v,"",[`n = C${n}² = ${C(n,2)}`,`m = C${r}² = ${C(r,2)}`,`P = ${C(r,2)}/${C(n,2)} ≈ ${f(v)}`]); }
  const n=pick([2,3,4]),v=1-1/2**n; return P(`Монету бросают ${n} раза. Найдите вероятность того, что орёл выпадет хотя бы один раз.`,v,"",[`Противоположное событие — ни одного орла: (1/2)^${n} = 1/${2**n}`,`P = 1 − 1/${2**n} = ${f(v)}`]);
 }}
];
TOPICS.forEach((t,i)=>t.no=i+1);

const MODES=[["th","Теория","Тест по определениям, свойствам и формулам"],["b","Обязательные задачи","Базовый уровень"],["a","Дополнительные задачи","Углублённый уровень"]];
const NQ=8;

/* ===== Состояние ===== */
const KEY="algebra1011-tutor";
let S={best:{}, last:null};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const best=(t,m)=>(S.best[t]&&S.best[t][m])||0;
const topicMastery=t=>Math.round((best(t,"th")+best(t,"b")+best(t,"a"))/3);
const totalMastery=()=>Math.round(TOPICS.reduce((a,t)=>a+topicMastery(t.id),0)/TOPICS.length);
const grade=p=>p>=90?5:p>=75?4:p>=50?3:2;
const byId=id=>TOPICS.find(t=>t.id===id);
const secOf=id=>SECTIONS.find(s=>s.id===id);
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== Главный экран ===== */
function home(){
  const tm=totalMastery();
  let h=`<div class="bar"><div class="brand">Алгебра <span>10–11</span></div><span class="pill">Освоено: ${tm}%</span></div>
  <section class="cover">
    <div><span class="eyebrow">Базовый и углублённый уровни</span><h1>Алгебра и начала анализа</h1>
    <p>Тренажёр по учебнику Ш. А. Алимова, Ю. М. Колягина и др. для 10–11 классов.</p></div>
    <div class="meter"><b>${tm}%</b><small>курса освоено</small></div>
  </section>
  <div class="consts">Ответ вводится числом: целым, десятичной дробью (0,75) или обыкновенной дробью (3/4).</div>`;
  SECTIONS.forEach(sec=>{
    h+=`<div class="sec"><h2 style="color:${sec.color}">${sec.t}</h2><button class="exam" data-sec="${sec.id}">Контрольная за ${sec.t}</button></div><div class="topics">`;
    TOPICS.filter(t=>t.s===sec.id).forEach(t=>{
      h+=`<button class="tp" data-t="${t.id}"><span class="no" style="background:${sec.color}">${String(t.no).padStart(2,"0")}</span><span><span class="sub" style="margin:0 0 2px">${t.ch}</span><h3>${t.t}</h3><span class="sub">${t.sub}</span>
       <span class="bars">${MODES.map(m=>`<div>${m[0]==="th"?"Теория":m[0]==="b"?"Обязат.":"Дополн."} ${best(t.id,m[0])}%<i><b style="width:${best(t.id,m[0])}%"></b></i></div>`).join("")}</span></span></button>`;
    });
    h+=`</div>`;
  });
  h+=`<section class="about"><h2>Как устроен тренажёр</h2><ul>
    <li>14 тем по главам учебника: 10 класс — действительные числа, степенная, показательная и логарифмическая функции, тригонометрия; 11 класс — производная, интеграл, комбинаторика и вероятность.</li>
    <li>В каждой теме есть шпаргалка с формулами, тест по теории и задачи двух уровней, как в учебнике: обязательные и дополнительные. Задачи каждый раз создаются заново.</li>
    <li>Числовой ответ засчитывается с точностью до 2%: можно вводить десятичную дробь, округлённую до сотых, или обыкновенную дробь вида 3/4. Если ответ — формула, её выбирают из вариантов.</li>
    <li>После каждого ответа показывается решение по шагам. Оценка: 90% и выше — «5», от 75% — «4», от 50% — «3».</li>
    <li>Прогресс хранится только в этом браузере.</li></ul>
    <button class="link" id="reset">Сбросить прогресс</button><div id="rc"></div></section>`;
  $app.innerHTML=h; window.scrollTo(0,0);
  $app.querySelectorAll(".tp").forEach(b=>b.onclick=()=>topicView(b.dataset.t,"fm"));
  $app.querySelectorAll(".exam").forEach(b=>b.onclick=()=>startExam(b.dataset.sec));
  document.getElementById("reset").onclick=()=>{
    document.getElementById("rc").innerHTML=`<div class="confirm">Удалить весь прогресс? <button class="btn alt" id="rn">Нет</button><button class="btn main" id="ry">Да, сбросить</button></div>`;
    document.getElementById("rn").onclick=()=>document.getElementById("rc").innerHTML="";
    document.getElementById("ry").onclick=()=>{ S.best={}; save(); home(); };
  };
}

/* ===== Экран темы ===== */
function topicView(id,tab){
  const t=byId(id), sec=secOf(t.s); S.last=id; save();
  const body = tab==="fm"
    ? `<div class="flist">${t.fm.map(x=>`<div class="frow"><span class="f">${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div>`
    : `<div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m[0]}"><h3>${m[1]}</h3><p>${m[2]}. ${NQ} заданий.</p><span class="best">Лучший результат: ${best(id,m[0])}%</span></button>`).join("")}</div>
       <p class="note">Совет: сначала повторите формулы, затем пройдите тест по теории и только потом решайте задачи.</p>`;
  $app.innerHTML=`<div class="bar"><button class="back" id="bk">← Все темы</button><span class="pill">Освоено: ${topicMastery(id)}%</span></div>
   <div class="thead"><div class="ch" style="color:${sec.color}">${sec.t} · ${t.ch}</div><h1>${t.t}</h1></div>
   <div class="tabs" role="tablist"><button class="tab" role="tab" data-v="fm" aria-selected="${tab==="fm"}">Формулы</button><button class="tab" role="tab" data-v="pr" aria-selected="${tab==="pr"}">Тренировка</button></div>${body}`;
  window.scrollTo(0,0);
  document.getElementById("bk").onclick=home;
  $app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>topicView(id,b.dataset.v));
  $app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>startRun(id,b.dataset.m));
}

/* ===== Прохождение ===== */
let G=null;
function thQ(t,item){ const [q,opts,why]=item; return {kind:"mc",q,ans:opts[0],opts:shuffle(opts),why:`<p>${why}</p>`,topic:t.t}; }
function startRun(id,mode){
  const t=byId(id); let qs;
  if(mode==="th") qs=shuffle(t.th).slice(0,Math.min(NQ,t.th.length)).map(x=>thQ(t,x));
  else { qs=[]; const seen=new Set(); for(let i=0;qs.length<NQ&&i<100;i++){ const q=t.gen(mode==="b"?1:2); if(!seen.has(q.q)){ seen.add(q.q); q.topic=t.t; qs.push(q); } } }
  G={id,mode,qs,i:0,right:0,wrong:[]}; renderQ();
}
function startExam(secId){
  const tps=TOPICS.filter(t=>t.s===secId), qs=[];
  const pool=shuffle(tps); for(let i=0;i<10;i++){ const t=pool[i%pool.length]; const q=t.gen(i<5?1:2); q.topic=t.t; qs.push(q); }
  G={id:null,sec:secId,mode:"exam",qs:shuffle(qs),i:0,right:0,wrong:[]}; renderQ();
}
function renderQ(){
  const q=G.qs[G.i];
  const title=G.mode==="exam"?`Контрольная · ${secOf(G.sec).t}`:`${byId(G.id).t} · ${MODES.find(m=>m[0]===G.mode)[1]}`;
  const inp = q.kind==="mc"
    ? `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="f">${o}</span></button>`).join("")}</div>`
    : `<div class="ansrow"><label for="ans" class="unit" style="font-family:var(--sans)">Ответ:</label><input id="ans" inputmode="${q.ans<0||!Number.isInteger(q.ans)?"text":"decimal"}" autocomplete="off" placeholder="${q.ans<0?"например, −5":"например, 3/4"}">${q.unit?`<span class="unit">${q.unit}</span>`:""}<button class="btn main" id="chk">Проверить</button><button class="btn alt" id="hnt">Подсказка</button></div><div class="hint" id="hintbox" hidden>Формула: <span class="f">${q.steps[0]}</span></div>`;
  $app.innerHTML=`<div class="bar"><button class="back" id="quit">✕ Выйти</button><span class="pill">${G.i+1} / ${G.qs.length}</span></div>
   <div style="display:flex;align-items:center;gap:10px"><div class="prog"><i style="width:${G.i/G.qs.length*100}%"></i></div><span class="pill">✓ ${G.right}</span></div>
   <div class="qcard"><div class="qmeta">${esc(title)}${G.mode==="exam"?` · ${esc(q.topic)}`:""}</div><p class="qtext">${q.q}</p>${inp}</div><div id="fb"></div>`;
  window.scrollTo(0,0);
  document.getElementById("quit").onclick=()=>G.id?topicView(G.id,"pr"):home();
  if(q.kind==="mc") $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>chooseMC(b));
  else {
    const inpEl=document.getElementById("ans"); inpEl.focus({preventScroll:true});
    inpEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); checkCalc(); } });
    document.getElementById("chk").onclick=checkCalc;
    document.getElementById("hnt").onclick=()=>{ document.getElementById("hintbox").hidden=false; };
  }
}
function parseNum(s){ s=String(s).trim().replace(/\s+/g,"").replace(/,/g,".").replace(/[−–]/g,"-"); const fr=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/); if(fr){ const d=parseFloat(fr[2]); return d?parseFloat(fr[1])/d:NaN; } if(!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return NaN; return parseFloat(s); }
function checkCalc(){
  const q=G.qs[G.i], el=document.getElementById("ans"); if(el.disabled) return;
  const v=parseNum(el.value);
  if(isNaN(v)){ el.classList.add("bad"); el.placeholder="введите число"; el.value=""; setTimeout(()=>el.classList.remove("bad"),600); return; }
  const ok=Math.abs(v-q.ans)<=Math.max(Math.abs(q.ans)*0.02,1e-9);
  el.disabled=true; el.classList.add(ok?"ok":"bad");
  document.getElementById("chk").disabled=true; document.getElementById("hnt").disabled=true;
  feedback(ok,`<ol>${q.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`,`${f(q.ans)}${q.unit?" "+q.unit:""}`);
}
function chooseMC(b){
  const q=G.qs[G.i], ok=q.opts[+b.dataset.i]===q.ans;
  $app.querySelectorAll(".opt").forEach((x,j)=>{ x.disabled=true; if(q.opts[j]===q.ans) x.classList.add("ok"); });
  if(!ok) b.classList.add("bad");
  feedback(ok,q.why,q.ans);
}
function feedback(ok,expl,ansText){
  const q=G.qs[G.i]; if(ok) G.right++; else G.wrong.push({q:q.q,a:ansText});
  const last=G.i===G.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="h">${ok?"Верно":"Неверно. Правильный ответ: "+ansText}</div>${expl}<div class="foot"><button class="btn main" id="nx">${last?"Результат":"Далее →"}</button></div></div>`;
  const nx=document.getElementById("nx"); nx.focus({preventScroll:true});
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
  nx.onclick=()=>{ if(last) finish(); else { G.i++; renderQ(); } };
}
function finish(){
  const pc=Math.round(G.right/G.qs.length*100), gr=grade(pc);
  let rec="";
  if(G.id){ S.best[G.id]=S.best[G.id]||{}; const prev=S.best[G.id][G.mode]||0; if(pc>prev){ S.best[G.id][G.mode]=pc; if(prev>0) rec=`<p>Новый лучший результат: ${prev}% → ${pc}%</p>`; } save(); }
  const msg=gr===5?"Отлично!":gr===4?"Хорошо":gr===3?"Удовлетворительно":"Нужно повторить";
  $app.innerHTML=`<div class="bar"><div class="brand">Алгебра <span>10–11</span></div><span class="pill">Освоено: ${totalMastery()}%</span></div>
   <div class="result"><div class="grade">${gr}</div><h1>${msg}</h1><p>Верно ${G.right} из ${G.qs.length} (${pc}%)</p>${rec}
   ${G.wrong.length?`<div class="review"><b>Над чем поработать:</b>${G.wrong.map(w=>`<div>${w.q}<br><span class="x">Ответ: ${w.a}</span></div>`).join("")}</div>`:""}
   <div class="row"><button class="btn main" id="again">Ещё раз</button>${G.id?`<button class="btn alt" id="tt">К теме</button>`:""}<button class="btn alt" id="hm">Все темы</button></div></div>`;
  window.scrollTo(0,0);
  document.getElementById("again").onclick=()=>G.mode==="exam"?startExam(G.sec):startRun(G.id,G.mode);
  const tt=document.getElementById("tt"); if(tt) tt.onclick=()=>topicView(G.id,"pr");
  document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
