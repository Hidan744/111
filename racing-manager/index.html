<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Пит-Уолл</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: экран пит-уолла — шапка команды, прокручиваемая панель, нижняя таб-панель как в мобильном приложении */
:root{
  --bg:#0b0f14; --panel:#121a23; --panel2:#18222e; --line:#243242;
  --fg:#e8eef4; --muted:#8597ab; --accent:#ffb020; --accent-ink:#1a1100;
  --good:#3fd27f; --bad:#ff5a4f; --info:#55b6ff;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --team:#ff8a1f;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:16px}
.btn.small{padding:7px 11px;min-height:34px;font-size:13px}
.btn.small.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.chip{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.stat{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv>div{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--team) 14%,transparent)}
.tblwrap{overflow-x:auto}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* header */
.top{padding-block:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--team) 0 35%,transparent 35%)}
.badge{width:40px;height:40px;border-radius:8px;background:var(--team);display:grid;place-items:center;font-family:var(--display);color:#0b0f14;font-size:13px;flex:none}
.money{font-family:var(--mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
/* tabbar */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tabs button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent)}
/* title */
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px}
.logo{font-family:var(--display);font-size:52px;line-height:.95;letter-spacing:.01em}
.logo span{color:var(--accent)}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--fg) 0 10px,var(--bg) 10px 20px);opacity:.9;border-radius:2px}
.teampick{display:flex;flex-direction:column;gap:8px}
.teampick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.teampick button.on{border-color:var(--accent);background:var(--panel2)}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:12px;font:inherit;min-height:44px}
/* race */
.racehead{padding-block:8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.lapbox{font-family:var(--display);font-size:20px}
canvas.track{width:100%;display:block;background:var(--panel);border-radius:10px;border:1px solid var(--line)}
.drvctl{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--team);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tyre{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:3px solid;font-size:10px;font-weight:700;font-family:var(--mono);flex:none;background:#0b0f14;color:#e8eef4}
.pitrow{display:flex;gap:6px;align-items:center}
.pitrow button.tbtn{width:40px;height:40px;border-radius:50%;border:3px solid;font-family:var(--mono);font-weight:700;background:var(--bg)}
.pitrow button.tbtn.on{box-shadow:0 0 0 3px var(--accent);background:var(--panel2)}
.feed{font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.feed div{padding-left:10px;border-left:2px solid var(--line)}
.flag{padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em}
.flag.sc{background:#ffd23f;color:#1a1400}
.flag.wet{background:var(--info);color:#04131f}
.flag.dry{background:var(--panel2);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:90%;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.pos{font-family:var(--display);font-size:13px;width:22px;text-align:center}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.podium div{background:var(--panel2);border-radius:8px 8px 0 0;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.podium div b{font-family:var(--display);font-size:22px}
.podium .p1{min-height:110px;border-top:3px solid var(--accent)}
.podium .p2{min-height:90px}
.podium .p3{min-height:76px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 3D, раскладки для компьютера, настройки */
.cols{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.narrow{max-width:720px;width:100%;margin-inline:auto}
.show{width:100%;aspect-ratio:16/9;max-width:100%;display:block;border-radius:10px;background:radial-gradient(ellipse at 50% 70%,#1d2a38,#0b0f14 70%);touch-action:pan-y;cursor:grab}
.racebody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:10px 24px;display:flex;flex-direction:column;gap:10px}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.viewport{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#06090c;aspect-ratio:16/10;max-width:100%;flex:none}
.viewport>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.viewport>canvas.mini{inset:8px 8px auto auto;width:30%;height:auto;aspect-ratio:1.6;background:rgba(11,15,20,.62);border-radius:8px;border:1px solid rgba(232,238,244,.12)}
.hud{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.zoomctl{position:absolute;right:8px;bottom:8px}
.spdtop{flex:none}
.spdtop button{min-height:34px;padding:6px 10px}
@media (max-width:600px){.racehead{flex-wrap:wrap}.spdtop{width:100%;display:flex}.spdtop button{flex:1;padding:6px 2px;font-size:12px}.racehead .lapbox{font-size:17px}}
.tower{position:absolute;left:8px;top:8px;background:rgba(8,11,15,.86);border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:12.5px;width:300px;max-width:52%;z-index:2}
.tower .th{cursor:pointer}
.tower .th{display:flex;justify-content:space-between;padding:4px 7px;background:var(--accent);color:var(--accent-ink);font-weight:600;letter-spacing:.06em}
.tower .tr{display:grid;grid-template-columns:20px 4px 38px 1fr 20px 34px 22px;gap:6px;align-items:center;padding:0 8px;height:21px;border-top:1px solid rgba(255,255,255,.05);cursor:pointer}
.tower .tr svg{display:block}
.tower .tr .w{text-align:right}
.tower .tr .a{text-align:right;color:#9fb0c2}
.tower .tr.fo{box-shadow:inset 2px 0 0 #fff}
.tower .tr.me{background:rgba(255,176,32,.2)}
.tower .tr .g{text-align:right;color:#c9d3dd;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.tower .tr i{width:10px;height:10px;border-radius:50%;border:2px solid;display:block}
.tower .tr.out{opacity:.45}
.ovright{position:absolute;right:8px;top:8px;width:30%;display:flex;flex-direction:column;gap:6px;z-index:2}
.ovright canvas{display:block;width:100%;aspect-ratio:1.6;background:rgba(11,15,20,.62);border-radius:8px;border:1px solid rgba(232,238,244,.12)}
.ovfc{background:rgba(8,11,15,.84);border-radius:6px;padding:6px 8px;font-size:11px;display:flex;flex-direction:column;gap:4px;color:#e8eef4}
.ovfc .ms{display:flex;gap:1px;height:7px;border-radius:2px;overflow:hidden}
.ovfc .ms i{flex:1;background:#3b4652;display:block}
.ovfc .ms i.w{background:var(--info)}
.ovfc .dr{display:flex;gap:5px;align-items:center;font-family:var(--mono);white-space:nowrap;overflow:hidden}
@media (max-width:600px){.tower{font-size:10px;width:218px}.tower .tr{grid-template-columns:16px 3px 30px 1fr 15px 28px 16px;height:16px;gap:4px}.tower .tr svg{width:15px;height:15px}.ovright{width:40%}.ovfc{font-size:10px;padding:4px 6px}}
.wxstrip{display:flex;gap:1px;height:16px;border-radius:4px;overflow:hidden}
.wxstrip i{flex:1;background:#3b4652;display:block}
.wxstrip i.w{background:var(--info)}
.wxstrip i.f{opacity:.55}
.wxstrip i.p{filter:brightness(.55)}
.wxstrip i.c{box-shadow:inset 0 0 0 2px var(--accent)}
.fcard h3{margin-top:2px}
.tyretab td,.tyretab th{padding:4px 3px;font-size:12px}
.stratl{display:flex;flex-direction:column;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.wearf{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.wearf b{color:var(--fg)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media (max-width:600px){.agrid{grid-template-columns:1fr}}
.ovr{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:8px;font-family:var(--display);font-size:17px;flex:none}
.ovr.a{background:var(--good);color:#04130a}.ovr.b{background:var(--accent);color:var(--accent-ink)}.ovr.c{background:var(--info);color:#04131f}.ovr.d{background:var(--panel2);color:var(--fg)}
.tcol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.tcol small{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.tcol small.best{color:var(--good)}
.days{display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
.days span{flex:1;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 2px;border-radius:6px;background:var(--panel);color:var(--muted)}
.days span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.days span.done{color:var(--good)}
.hudtag{background:rgba(11,15,20,.72);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:11px;color:var(--fg)}
.camseg{display:flex;gap:4px;flex-wrap:wrap}
.camseg button{background:rgba(11,15,20,.72);border:1px solid rgba(232,238,244,.16);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;min-height:32px}
.camseg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lights{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:flex;gap:8px;background:#06090c;padding:10px 12px;border-radius:10px;border:1px solid #243242}
.lights i{width:22px;height:22px;border-radius:50%;background:#2a1416;display:block}
.lights i.on{background:#ff2a1f;box-shadow:0 0 14px #ff2a1f}
.slider{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.fb{font-size:12.5px}
tr[data-a]{cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8}
@media (max-width:600px){.viewport{aspect-ratio:4/3}.camseg button{padding:4px 7px;font-size:11px;min-height:28px}}
@media (min-width:900px){
  #app{max-width:1180px}
  .cols{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .tabs{grid-template-columns:repeat(6,minmax(0,130px));justify-content:center}
}
@media (min-width:960px){
  #app.wide{max-width:1680px}
  .racebody{display:grid;grid-template-columns:minmax(0,1fr) 400px;overflow:hidden;padding-block:12px}
  .racebody .viewport{aspect-ratio:auto;height:100%}
  .racebody .side{overflow-y:auto;min-height:0;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.subnav{display:flex;flex:none;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}.subnav .btn{flex:none;white-space:nowrap}
[id^=sec-]{scroll-margin-top:8px}
.stand{display:flex;flex-direction:column;gap:12px}
.stand .sh h1{font-family:var(--display);font-style:italic;font-size:clamp(28px,6vw,46px);line-height:1;margin:2px 0 0;letter-spacing:-.01em;text-transform:uppercase}
.slead{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--tc) 70%,#000);border-top:3px solid var(--accent);border-radius:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,#0d131a),#0d131a 70%);overflow:hidden}
.slead b{font-family:var(--display);font-style:italic;font-size:clamp(22px,5vw,34px);line-height:1.05}
.slead .sp{position:absolute;right:18px;bottom:14px;font-family:var(--display);font-size:clamp(34px,8vw,56px);line-height:1;text-align:right}.slead .sp small{display:block;font-size:11px;font-family:var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.slead .sn{position:absolute;right:14px;top:-10px;font-family:var(--display);font-size:90px;color:rgba(255,255,255,.05);line-height:1}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;background:#0f151c}
.srow.me{background:color-mix(in srgb,var(--tc) 14%,#0f151c)}
.srow .sn{font-family:var(--display);font-size:20px;color:var(--muted);width:28px;text-align:center}
.srow b{display:block;font-size:15px}.srow span.ell{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.srow .sp{font-family:var(--display);font-size:22px;text-align:right;line-height:1}.srow .sp small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted)}
.attn .sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.attn .sumrow>div{background:var(--panel2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.attn .sumrow b{font-family:var(--display);font-size:22px;line-height:1.1}.attn .sumrow b small{font-size:12px;color:var(--muted)}.attn .sumrow span:last-child{font-size:11px;color:var(--muted)}
.attn .okc{color:var(--good)!important}.attn .bdc{color:var(--bad)!important}
.aitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--line)}
.aitem b{display:block;font-size:14px}.aitem span{display:block;font-size:12px;color:var(--muted)}
.aitem .aic{flex:none;width:22px;height:22px;border-radius:50%;display:grid!important;place-items:center;font-weight:700;font-size:12px;color:#0b0f14!important;background:var(--muted)}
.aitem.l3{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel2))}.aitem.l3 .aic{background:var(--bad)}
.aitem.l2{border-left-color:var(--accent)}.aitem.l2 .aic{background:var(--accent)}
.aitem.l1{border-left-color:var(--info)}.aitem.l1 .aic{background:var(--info)}
/* ---------- экран гонки в стиле трансляции ---------- */
:root{--act:#2fd1bf;--act-ink:#04201d;--slate:#141d27;--slate2:#1c2733}
.rtitle{font-family:var(--display);font-size:20px;font-style:italic}
.stage{display:flex;flex-direction:column;gap:8px;min-height:0}
.rbar{display:flex;align-items:center;gap:10px;background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:6px 10px;flex-wrap:wrap}
.rb-gp{display:flex;flex-direction:column;line-height:1.1;min-width:0}.rb-gp b{font-family:var(--display);font-size:15px}.rb-gp span{font-size:11px;color:var(--muted)}

.rb-wx .wxi svg{width:28px;height:28px;display:block}
.rbar .spdtop{flex:none;width:auto}.rbar .spdtop button{min-width:38px}.rbar .spdtop button.on{background:var(--act);color:var(--act-ink)}
.rb-lap{font-family:var(--display);font-size:20px;letter-spacing:.04em;padding:4px 10px;background:#0b1117;border-radius:8px;white-space:nowrap}
.rtop{position:absolute;right:calc(30% + 16px);top:8px;display:flex;gap:8px;align-items:center;background:rgba(14,20,27,.88);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 16px;font-family:var(--display);font-size:13px;letter-spacing:.08em;z-index:3;white-space:nowrap;pointer-events:none}
.rtoast{position:absolute;right:8px;bottom:58px;max-width:min(440px,56%);z-index:4;display:flex;gap:10px;align-items:center;background:rgba(20,29,39,.95);border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--act);border-radius:10px;padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:tin .25s ease-out}
.rtoast.fast{border-left-color:#b65cff}.rtoast.fast .tl{color:#c88bff;font-family:var(--display);letter-spacing:.06em}
.rtoast.mine{border-left-color:var(--team)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tower{background:rgba(14,20,27,.9);border:1px solid rgba(255,255,255,.07);border-radius:8px;width:330px;font-family:var(--body);font-size:13px}

.tower .th button{font:inherit;color:var(--act);border:1px solid rgba(47,209,191,.4);border-radius:5px;padding:2px 6px;min-height:0;background:none}
.tower .tr{grid-template-columns:24px 4px minmax(0,1fr) 20px 34px 58px 24px;height:24px;gap:6px;padding:0 6px}
.tower .tr .ps{display:grid;place-items:center;height:18px;background:#e8eef4;color:#0b0f14;border-radius:4px;font-family:var(--mono);font-size:11px}
.tower .tr.me .ps{background:var(--act);color:var(--act-ink)}
.tower .tr .tb{height:16px;width:4px;border-radius:2px}
.tower .tr .nmc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tower .tr .nmc.fl{color:#c88bff}
.tower .tr .g{font-family:var(--mono);font-size:11.5px}
.tower .tr .a{font-family:var(--mono);font-size:10px}
.tower .tr em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}
.tower .tr em.pt{background:#e0263a;color:#fff}.tower .tr em.st{color:#ff6b6b}
.tower .tr.me{background:rgba(47,209,191,.13)}
.drvctl{background:var(--slate);border:1px solid var(--line);border-left:0;border-radius:12px;padding:0 0 10px;overflow:hidden;gap:8px;flex:none}
.drvctl>*:not(.dh){margin-inline:10px}
.drvctl .dh{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,#0b1117),#16202a 85%)}

.drvctl .dn{display:block;font-family:var(--display);font-size:16px}.drvctl .dh span.ell{display:block;font-size:12px;color:rgba(255,255,255,.75)}
.btn.ghost{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.15)}
.drvctl .dg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gauge{background:var(--slate2);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:70px;text-align:center}
.gauge>span{display:flex;align-items:center;gap:4px}.gauge>span b,.gauge>b{font-family:var(--display);font-size:18px}.gauge small{font-size:10px;color:var(--muted);line-height:1.1}
.btn.pitbtn{background:var(--act);color:var(--act-ink);border:0;font-family:var(--display);font-size:17px;min-height:46px;border-radius:999px;letter-spacing:.04em}

@media (max-width:959px){.stage{flex:none}}
@media (max-width:600px){.rtop{display:none!important}.tower{width:236px;font-size:11px}.tower .tr{grid-template-columns:18px 3px minmax(32px,1fr) 14px 28px 42px 16px;height:17px;gap:4px;padding:0 4px}.tower .tr .ps{height:14px;font-size:9px}.tower .tr .tb{height:12px}.tower .tr .g{font-size:9.5px}

.intro{position:fixed;inset:0;z-index:60;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;background:radial-gradient(120% 80% at 50% 42%,#17222e 0%,#07090c 68%);transition:opacity .55s}
.intro.bye{opacity:0;pointer-events:none}
.intro::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.018) 22px 24px)}

.intro.go .i-streaks i{animation-duration:.42s;height:3px}

.i-top{position:absolute;top:calc(9% + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .6s .2s}

.intro.run .i-top,.intro.wait .i-top{opacity:1}
.i-lights{position:relative;display:flex;gap:clamp(6px,2vw,12px);padding:12px 14px;background:#040608;border:1px solid #1d2733;border-radius:12px;box-shadow:0 14px 50px #000;transition:opacity .35s .25s,transform .5s .2s}

.i-bar{height:5px;width:0;margin:14px auto 12px;background:linear-gradient(90deg,#c8102e,var(--team));border-radius:3px;box-shadow:0 0 18px #c8102e88}
.i-sub{font-family:var(--mono);font-size:13px;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);opacity:0}
.intro.go .i-logo{animation:ilogo .75s cubic-bezier(.2,.9,.25,1.15) .1s forwards}
.intro.go .i-logo .logo::after{animation:ishine 1s ease-in-out .75s forwards}
.intro.go .i-bar{animation:ibar .7s cubic-bezier(.3,.8,.2,1) .45s forwards}
.intro.go .i-sub{animation:isub .9s ease-out .7s forwards}

.intro.go .i-wipe{animation:iwipe .55s cubic-bezier(.6,0,.3,1) forwards}

.i-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.intro.go .i-flash{animation:iflash .45s ease-out}

.i-tap{position:absolute;bottom:calc(14% + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg);display:none;animation:ipulse 1.4s ease-in-out infinite}
.intro.wait .i-tap{display:block}

.i-skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:none}

@media (prefers-reduced-motion:reduce){.intro *{animation-duration:.01s!important}}

const BPM=132,ST=60/BPM/4;   // длительность шестнадцатой
const mtof=m=>440*Math.pow(2,(m-69)/12);
const AU_OK=!!(window.AudioContext||window.webkitAudioContext);
const auVol=()=>[0,.42,.8][SET.music]||0;
function auCtx(){
  if(AU.ctx)return AU.ctx;if(!AU_OK)return null;
  const c=AU.ctx=new(window.AudioContext||window.webkitAudioContext)();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
  AU.out=c.createGain();AU.out.gain.value=0;AU.out.connect(comp);
  AU.sfx=c.createGain();AU.sfx.gain.value=auVol();AU.sfx.connect(comp);
  AU.mus=c.createGain();AU.mus.connect(AU.out);
  const len=c.sampleRate*2.2|0,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  AU.rev=c.createConvolver();AU.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.3;AU.rev.connect(rg);rg.connect(AU.mus);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  document.addEventListener('visibilitychange',()=>{if(document.hidden)c.suspend();else c.resume()});
  return c;
}
function aTone(t,type,f,dur,v,dest,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*.6);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(dest||AU.mus);o.start(t);o.stop(t+dur+.03)}
function aNoise(t,dur,type,f,q,v,dest,f2,a){const c=AU.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;s.loop=true;
  fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  if(a){g.gain.setValueAtTime(.0008,t);g.gain.exponentialRampToValueAtTime(v,t+dur*.95);g.gain.linearRampToValueAtTime(0,t+dur)}else{g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur)}
  s.connect(fl);fl.connect(g);g.connect(dest||AU.mus);s.start(t,Math.random()*.5);s.stop(t+dur+.03)}
// синтезатор: несколько расстроенных осцилляторов через фильтр с огибающей
function aSyn(t,m,dur,o){const c=AU.ctx,fl=c.createBiquadFilter(),g=c.createGain(),a=o.a||.005,rel=o.rel||.08;
  fl.type='lowpass';fl.Q.value=o.q||2;fl.frequency.setValueAtTime(o.cut,t);fl.frequency.exponentialRampToValueAtTime(o.cut2||o.cut,t+Math.max(.02,dur*(o.fs||1)));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.v,t+a);g.gain.setValueAtTime(o.v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0008,t+dur+rel);
  fl.connect(g);g.connect(AU.mus);if(o.rev){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(AU.rev)}
  (o.det||[0]).forEach(d=>{const x=c.createOscillator();x.type=o.type||'sawtooth';x.frequency.value=mtof(m);x.detune.value=d;
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vib,t+.25);l.connect(lg);lg.connect(x.detune);l.start(t);l.stop(t+dur+rel+.05)}
    x.connect(fl);x.start(t);x.stop(t+dur+rel+.05)})}
const aKick=(t,v=1)=>aTone(t,'sine',150,.32,.95*v,0,40);
const aSnare=(t,v=1)=>{aNoise(t,.17,'highpass',1300,.7,.42*v);aNoise(t,.3,'bandpass',2300,.9,.16*v,AU.rev);aTone(t,'triangle',200,.09,.3*v)};
const aHat=(t,v=1)=>aNoise(t,.035,'highpass',7800,.6,.12*v);
function aImpact(t,dest){dest=dest||AU.mus;aTone(t,'sine',120,1.6,1,dest,32);aTone(t,'sawtooth',55,1.1,.18,dest,41);
  aNoise(t,2.2,'lowpass',900,.5,.35,dest,120);aNoise(t,1.8,'highpass',4800,.4,.22,dest);aNoise(t,2.4,'bandpass',1800,.6,.25,AU.rev)}

const CH={Dm:[38,[0,3,7]],Bb:[34,[0,4,7]],F:[41,[0,4,7]],C:[36,[0,4,7]],Gm:[43,[0,3,7]],A:[45,[0,4,7]]};
const SEC={B:['Dm','Bb','F','C','Dm','Bb','Gm','A'],A:['Dm','Dm','Bb','C','Dm','Dm','Bb','A']};
const ARP=[0,2,3,2,1,2,3,2,0,2,3,2,1,3,2,1];
// главная тема (шаг, нота, длительность в шестнадцатых)
const LEAD=[[0,69,6],[6,74,2],[8,74,4],[12,76,2],[14,77,2],[16,77,8],[24,74,4],[28,70,4],[32,72,6],[38,77,2],[40,81,4],[44,79,2],[46,77,2],[48,79,12],[60,76,4],
 [64,69,6],[70,74,2],[72,74,4],[76,76,2],[78,77,2],[80,82,8],[88,81,4],[92,77,4],[96,79,6],[102,77,2],[104,74,4],[108,79,4],[112,76,8],[120,73,4],[124,76,4]];
const LEADAT={};LEAD.forEach(n=>LEADAT[n[0]]=n);
const chordNotes=(ch,base)=>{const[r,iv]=CH[ch];const t=iv.map(i=>r+i);return[t[0]+base,t[1]+base,t[2]+base,t[0]+base+12]};
function auStep(s,t){
  const L=ST;
  if(s<0){ // вступление: два такта нарастания до «огни погасли»
    const k=s+32,ch=chordNotes('Dm',24);
    if(k===0)aNoise(t,32*L,'bandpass',260,1.4,.28,0,7000,1);
    if(k<28){aSyn(t,ch[ARP[k%16]],L*.85,{type:'square',cut:600+k*90,cut2:400,v:.035+k*.0015,rel:.05,rev:.2});if(k%2===0)aSyn(t,38,L*1.6,{cut:300,cut2:120,v:.12+k*.003,rel:.05})}
    if([2,8,14,20,26].includes(k)){aTone(t,'sine',90,.5,.6,0,48);aNoise(t,.25,'bandpass',900,1,.12)}
    if(k>=24&&k<28)aSnare(t,.25+(k-24)*.2);
    return;
  }
  const pos=s%256,secB=pos<128,p=pos%128,bar=p>>4,b=p%16,ch=SEC[secB?'B':'A'][bar],[root]=CH[ch];
  if(s===0)aImpact(t);
  // ударные
  const fill=bar===7&&b>=12;
  if(secB?b%4===0:(b===0||b===8||b===10))aKick(t,b===0?1:.85);
  if(fill)aSnare(t,.5+(b-12)*.15);else if(b===4||b===12)aSnare(t,secB?1:.75);
  if(secB?true:b%2===0)aHat(t,b%4===2?1:.55);
  // бас восьмыми
  if(b%2===0){const n=root+((b===6||b===14)?12:0);aSyn(t,n,L*1.7,{cut:secB?1100:800,cut2:160,v:.2,rel:.04,det:[-6,6]});aTone(t,'sine',mtof(n-12),L*1.8,.22)}
  // остинато шестнадцатыми
  const nts=chordNotes(ch,24);aSyn(t,nts[ARP[b]],L*.8,{type:'square',cut:secB?3200:2200,cut2:700,v:b%4===0?.05:.035,rel:.04,rev:.22});
  // медные аккорды
  if(b===0&&(secB||bar>=4))chordNotes(ch,12).slice(0,3).forEach(n=>aSyn(t,n,L*15,{cut:500,cut2:secB?2600:1500,fs:.5,v:secB?.045:.03,a:.12,rel:.4,det:[-9,0,9],rev:.45}));
  if(secB&&b===0)aTone(t,'sine',mtof(root),L*14,.12);
  // мелодия
  if(secB&&LEADAT[p]){const[,m,d]=LEADAT[p];aSyn(t,m,L*d*.95,{cut:3800,cut2:2200,v:.085,a:.02,rel:.18,det:[-6,6],vib:14,rev:.45});aSyn(t,m-12,L*d*.95,{type:'square',cut:1800,v:.03,a:.02,rel:.15})}
  if(!secB&&bar>=4&&b%8===0&&LEADAT[(bar-4)*16+b])aSyn(t,LEADAT[(bar-4)*16+b][1]-12,L*6,{type:'triangle',cut:2000,v:.06,a:.03,rel:.3,rev:.5});
}
function auTick(){const c=AU.ctx;if(!c||!AU.run)return;const now=c.currentTime;if(AU.t<now)AU.t=now+.03;
  while(AU.t<now+.3){auStep(AU.step,AU.t);AU.step++;AU.t+=ST}}

  AU.step=intro?-32:128;AU.t=c.currentTime+.08;AU.run=true;auFade(auVol(),intro?.05:1.5);

}

// износ за круг: манера вождения, мастерство пилота, надёжность машины, характер трассы
function compWear(k,d,t,mode,tr){
  const base=COMPS.find(c=>c[0]===k)[4],m=mode==='push'?1.5:mode==='save'?.75:1,sm=1.25-d.craft/200,rl=1.4-t.car.rel/150;

  return base*m*sm*rl*trk*(1.15-.07*facL(t,fk));

// потеря темпа от износа узлов, с/круг
function compPen(P){if(!P)return 0;const h=k=>P[k].h;
  return Math.max(0,60-h('ice'))*.012+Math.max(0,60-h('ers'))*.01+Math.max(0,40-h('gb'))*.01+Math.max(0,70-h('floor'))*.015+Math.max(0,70-h('fw'))*.012+(h('floor')<=0?1.5:0)+(h('fw')<=0?1.2:0)}

function partPen(id,k){const lim=compLimit(k),u=ensureParts(id)[k].used;if(!lim||u<lim)return 0;return k==='gb'?5:u===lim?10:5}

function retireOdds(d){

  const dr=drive(d);p-=(dr-60)/150;if(dr<45)why.push('потерял мотивацию');

  let lt=tr.base+(100-perf(t,tr))*.06+(100-d.pace)*.035-lap*.03*R.ls;
  if(wet){lt+=7+(100-(d.wet||d.craft))*.03+(c.tyre==='I'?0:8.5)}else lt+=TYRES[c.tyre].off;
  const h=c.health;lt+=(100-h)*.018+(h<35?(35-h)*.09:0);
  lt+=c.mode==='push'?-.35:c.mode==='save'?.45:0;
  lt-=(c.sq-60)*.012;
  lt+=compPen(S.parts[c.did])-specBonus(S.parts[c.did]);
  lt+=gauss()*(.15+(100-(d.cons||d.craft))/100*.35)*(lap===1?2.2:1);
  if(lap===1)lt-=((d.start||80)-80)*.02;
  return lt;
}

/* ---------- стратегия: оценка времени до финиша ---------- */
function stintTable(c,n,d,wet,ls,h0){
  const T=TYRES[c],off=wet?(c==='I'?0:8.5):T.off,w=tyreWear(c,wet,d.tyre,'norm',ls,(R&&UI.screen==='race'?R.tw:W.tw));
  const pre=[0];let h=h0;
  for(let i=0;i<n;i++){pre.push(pre[i]+off+(100-h)*.018+(h<35?(35-h)*.09:0)+(h<10?2.5:0));h=Math.max(0,h-w)}
  return pre;
}
function bestPlan(start,h0,n,maxStops,usedDry,ruleOn,d,wet,ls,pit,minStops=0){
  if(n<=0)return{cost:0,plan:[]};
  const comps=['S','M','H','I'],tb={};comps.forEach(k=>tb[k]=stintTable(k,n,d,wet,ls,100));
  const t0=h0<100?stintTable(start,n,d,wet,ls,h0):tb[start];
  const ok=arr=>!ruleOn||new Set([...usedDry,...arr].filter(x=>x!=='I')).size>=2;
  let best={cost:Infinity,plan:[]};const st=Math.max(1,Math.floor(n/28));
  if(ok([start])&&minStops<1)best={cost:t0[n],plan:[[start,n]]};
  if(maxStops>=1&&minStops<2)for(let k=1;k<n;k+=st)for(const c2 of comps){if(!ok([start,c2]))continue;const v=t0[k]+pit+tb[c2][n-k];if(v<best.cost)best={cost:v,plan:[[start,k],[c2,n-k]]}}
  if(maxStops>=2)for(let k1=1;k1<n-1;k1+=st)for(let k2=k1+1;k2<n;k2+=st)for(const c2 of comps)for(const c3 of comps){if(!ok([start,c2,c3]))continue;
    const v=t0[k1]+pit+tb[c2][k2-k1]+pit+tb[c3][n-k2];if(v<best.cost)best={cost:v,plan:[[start,k1],[c2,k2-k1],[c3,n-k2]]}}
  return best;
}

function startOptions(id){
  const d=drv(id),wet=W.weather[0],res={};
  Object.keys(TYRES).forEach(k=>res[k]=bestPlan(k,100,W.laps,2,[],!wet,d,wet,W.ls,W.tr.pit+2.6+S.rules.pitAdd,!wet&&S.rules.twoStop?2:0));
  const min=Math.min(...Object.values(res).map(r=>r.cost));Object.values(res).forEach(r=>r.delta=r.cost-min);
  return res;
}
// гонка: заехать сейчас на каждый состав или остаться на трассе
function raceOptions(c){
  const d=drv(c.did),k=Math.min(R.N-1,R.lapDone),wet=R.wet[k],rem=Math.max(0,R.N-R.lapDone-1),ruleOn=!R.anyWet&&!wet,used=c.used.filter(x=>x!=='I'),pit=(R.sc>0?R.track.pit*.45:R.track.pit)+2.6+S.rules.pitAdd,ms=ruleOn&&S.rules.twoStop?Math.max(0,2-c.stops):0;
  const res={};
  Object.keys(TYRES).forEach(t=>{const b=bestPlan(t,100,rem,Math.max(1,ms-1),used,ruleOn,d,wet,R.ls,pit,Math.max(0,ms-1));res[t]={cost:pit+b.cost,plan:b.plan}});
  const stay=bestPlan(c.tyre,c.health,rem,2,used,ruleOn,d,wet,R.ls,pit,ms);res.stay={cost:stay.cost,plan:stay.plan};
  const min=Math.min(...Object.values(res).map(r=>r.cost));Object.values(res).forEach(r=>r.delta=r.cost-min);
  return res;
}

function genWeather(tr,laps){
  let wet=Math.random()<tr.rain*.55;const arr=[];let seg=0;const sc=tr.laps/laps,minSeg=Math.ceil(4/sc);
  for(let i=0;i<laps;i++){arr.push(wet);seg++;if(seg>=minSeg&&Math.random()<(wet?.16:tr.rain*.2)*sc){wet=!wet;seg=0}}
  return arr;
}

     steps:real?['media','fp1','fp2','fp3','quali','race']:['fp','quali','race'],step:0,sheet:{},hype:null,
     dayWet:{fri:Math.random()<tr.rain*.6,sat:Math.random()<tr.rain*.6},seed:Math.floor(Math.random()*2147483647)};

function applyGridPen(g){

  g.forEach(x=>{const n=pen[x.id];if(n>15){out.splice(out.indexOf(x),1);x.note=(x.note?x.note+', ':'')+'штраф: последний ряд';back.push(x)}});
  g.forEach(x=>{const n=pen[x.id];if(!n||n>15)return;const i=out.indexOf(x);out.splice(i,1);x.note=(x.note?x.note+', ':'')+'штраф −'+n;out.splice(Math.min(out.length,i+n),0,x)});
  S.gpen={};return out.concat(back);

function runQuali(){

// режим пилота-соперника: атака в борьбе и на финише, бережёт шины и узлы при износе
function aiMode(c,gapAhead,k,wet){
  if(c.me)return;
  const P=S.parts[c.did],left=R.N-k+1,comp=P?Math.min(P.ice.h,P.ers.h,P.gb.h):100;
  if(comp<25||(c.health<30&&!c.pitReq&&left>3))c.mode='save';
  else if((gapAhead<1.2&&c.health>45&&comp>40)||(left<=3&&c.health>25&&comp>30))c.mode=wet&&c.health<60?'norm':'push';
  else c.mode='norm';
}
function aiDecide(c,k,wet,sc){
  if((c.me&&!c.auto)||c.pitReq)return;
  // одно правило для всех команд: сильный стратег (70+) считает варианты оптимизатором, слабый — заезжает по порогу износа
  if(srat(team(c.tid),'strat')>=70&&!sc&&!(wet&&c.tyre!=='I')&&!(!wet&&c.tyre==='I')){const o=raceOptions(c),b=Object.keys(o).find(x=>o[x].delta<.05);if(b&&b!=='stay')c.pitReq=b;return}
  const left=(R.N-k+1)*R.ls;
  if(wet&&c.tyre!=='I'){if(Math.random()<.65)c.pitReq='I';return}
  if(!wet&&c.tyre==='I'){if(Math.random()<.65)c.pitReq=left>14?'H':left>8?'M':'S';return}
  if(left<=1)return;
  const dry=c.used.filter(x=>x!=='I');
  const needSecond=!R.anyWet&&(new Set(dry).size<2||(S.rules.twoStop&&c.stops<2));
  if(S.rules.twoStop&&!R.anyWet&&c.stops===0&&left<R.N*R.ls*.62&&c.health<70){c.pitReq=c.tyre==='M'?'H':'M';return}
  if(c.health<c.thr||(sc&&c.health<62&&left>4)||(needSecond&&left<=3)){
    let ch=left>15?'H':left>8?'M':'S';
    if(needSecond&&ch===c.tyre)ch=ch==='H'?'M':ch==='M'?(left>10?'H':'S'):'M';
    if(left<=3&&c.health>45&&!needSecond)return;
    c.pitReq=ch;
  }
}

    if(broke){c.out=true;c.outLap=k;c.parkF=(k-1)+clamp((R.T-c.cum[k-1])/(R.track.base+5),.05,.95);c.cum.push(Infinity);c.outWhy=broke;feed(`${nm(c.did)} сходит: ${({ice:'выработан двигатель',ers:'отказ ERS',gb:'отказ коробки передач'})[broke]}.`,c.me);continue}
    if(!sc&&Math.random()<(c.mode==='push'?.012:c.mode==='save'?.002:.004)*(1.3-d.craft/100)*(wet?2.2:1)*R.ls*(1.1-(d.exp||50)/1000)*(c.me?1.25-srat(me(),'coach')/250:1)){const loss=rnd(1.5,5);lt+=loss;

      c.errLap=k;feed(`${nm(c.did)} ошибается и теряет ${loss.toFixed(1).replace('.',',')} с${c.mode==='push'?' — повреждено переднее крыло':''}.`,c.me)}
    // прокол

    return{did:x.c.did,tid:x.c.tid,pos:i+1,grid:x.c.grid,out:x.c.out,time:x.t,gap:x.c.out?null:x.t-win,lapsDown:x.c.out||!fin[0]?0:Math.floor((x.c.cum[N]-fin[0].c.cum[N])/(fin[0].c.cum[N]/N)),pts,pen:x.c.pen,stops:x.c.stops,me:x.c.me,best:x.c.best};
  });
  // экономика
  const mine=rows.filter(r=>r.me);
  const ptsMine=mine.reduce((s,r)=>s+r.pts,0);
  const best=Math.min(...mine.map(r=>r.out?99:r.pos));
  const goalOk={finish:mine.every(r=>!r.out),points:mine.some(r=>!r.out&&r.pos<=10),both:mine.every(r=>!r.out&&r.pos<=10),podium:best<=3,win:best===1};
  const inc=[];
  inc.push(['Выплаты FOM',BAL.fomBase]);
  // призовые FOM приходят частями по ходу сезона — по месту в Кубке конструкторов прошлого года
  inc.push([`Призовые FOM (${lastRank(me())}-е место)`,+(fomPrize(lastRank(me()))/NR()).toFixed(2)]);
  S.sponsors.forEach(s=>{inc.push([s.name,s.per]);if(goalOk[s.goal])inc.push([`Бонус: ${s.name}`,s.bonus])});
  const t=me();
  const crash=mine.filter(r=>r.out).length;
  const exp=[['Зарплаты пилотов',t.drivers.reduce((s,id)=>s+drv(id).salary,0)/NR()],['Персонал',staffSalary(t)/NR()],['Логистика и операции',BAL.logistics],['Академия и скаутинг',acadUpkeep()],['Содержание базы',facUpkeep()]];
  if(crash)exp.push([crash>1?'Эвакуация и проверка двух болидов':'Эвакуация и проверка болида',+(crash*BAL.crashCost).toFixed(2)]);
  const net=inc.reduce((s,x)=>s+x[1],0)-exp.reduce((s,x)=>s+x[1],0);
  inc.forEach(([n,v])=>money(v,n==='Выплаты FOM'?'fom':n.startsWith('Бонус')?'bonus':/Призов/.test(n)?'prize':'sponsor',n));
  exp.forEach(([n,v])=>money(-v,EXP_CAT[n]||(/Эвакуац/.test(n)?'repair':'other'),n));
  finClose(W.tr.gp);
  // репутация
  const exp_pos=S.goal*2;
  S.rep=clamp(S.rep+clamp((exp_pos-best)*.08,-1,.4)+(best<=3?.8:0),10,100);
  tasksAfterRace(rows,W.grid||[]);
  if(W.hype){const ok=best<=10;S.rep=clamp(S.rep+(ok?2.5:-3),10,100);news(ok?'Громкие заявления на медиа-дне подтвердились — репутация растёт.':'Обещания на медиа-дне не сбылись — пресса критикует команду.')}
  // тренер пилотов: молодые растут
  t.drivers.forEach(id=>{const d=drv(id);if(d.age<=29&&d.pace<97&&Math.random()<srat(t,'coach')/900){d.pace++;news(`${d.name} прогрессирует: скорость ${d.pace} — работа тренера.`)}else if(Math.random()<srat(t,'coach')/1500&&d.craft<97){d.craft++}});
  // проекты

  // развитие соперников
  S.teams.forEach(o=>{if(o.id===S.pid)return;
    // как у игрока: деньги на разработку (фонд FOM + своя доля) делятся между текущим болидом и следующим
    const m=aiDevBudget(o)/NR()*DIFF_DEV[SET.diff],nx=S.round>NR()*.4?.7:.3;
    PARTS.forEach(([k])=>{if(k==='engine'&&o.engineSup)return;o.next[k]+=m*nx/4*devEff(o,k)*rnd(.7,1.3)});
    if(Math.random()<.12+o.budget/900){const k=pick(['floor','fw','floor','gb','ice','ers']);if(teamSpec(o,k)<SPEC_MAX&&!((k==='ice'||k==='ers')&&(S.rules.freeze||o.engineSup))){o.spec=o.spec||{};o.spec[k]=teamSpec(o,k)+1}}
    let part=pick(['aero','engine','chassis','aero','engine','chassis','rel']);if(part==='engine'&&S.rules.freeze)part='chassis';o.car[part]=clamp(+(o.car[part]+m*(1-nx)*BAL.aiPtsPerM*(.7+o.td.rating/200)*facMul(o,part)*rnd(.6,1.4)/(1+Math.max(0,o.car[part]-70)/40)).toFixed(1),0,100)});
  // новые предложения
  if(S.round%3===2){S.offers.push(mkOffer());S.offers=S.offers.slice(-5)}
  academyRace();autoOrder();ensureIntel();CATS.forEach(([k])=>S.intel.conf[k]=Math.min(.92,S.intel.conf[k]+.035));
  retireCheck();
  if(S.vote)resolveVote();
  if(S.round%6===2&&S.round<NR()-1)newVote();
  const winner=rows[0];
  S.results.push({round:S.round,winner:winner.did,wtid:winner.tid,my:mine.map(r=>r.out?'сход':r.pos)});
  const mtxt=mine.map(r=>`${nm(r.did)} — ${r.out?'сход':r.pos+'-й'}`).join(', ');
  news(`${W.tr.gp}: победа ${drv(winner.did).name} («${team(winner.tid).name}»). У нас: ${mtxt}.`);
  S.lastRace={rows,inc,exp,net,ptsMine,track:W.tr.gp};
  S.day=Math.max(S.day,raceDay(W.tr));
  S.round++;
  save(true);
  UI.screen='result';render();
}

/* ---------- конец сезона ---------- */
function endSeason(){
  const st=teamStandings();const pos=st.findIndex(t=>t.id===S.pid)+1;
  const prize=BAL.champBonus[pos-1]||0;
  if(prize)money(prize,'prize',`Бонус FOM за ${pos}-е место`);
  // владельцы забирают 60% денег сверх годовых обязательных расходов: резерв на год остаётся команде
  const keep=+(mandPerRace()*NR()).toFixed(1),div=S.budget>keep?+((S.budget-keep)*BAL.dividendShare).toFixed(1):0;
  if(div>0){money(-div,'owners','Дивиденды владельцам');news(`Владельцы команды забрали ${fm(div,1)} — деньги сверх годового резерва (${fm(keep,1)}).`)}
  let verdict;
  if(pos<=S.goal){verdict={ok:true,t:`Цель выполнена: ${pos}-е место при задаче ${S.goal}-е. Совет доволен.`};S.rep=clamp(S.rep+6,10,100);S.warnings=0}
  // у команд с целью 1–2-е место «почти» — до двух мест ниже цели: борьба за титул не должна стоить работы за 2-е место
  else if(pos<=S.goal+(S.goal<=2?2:1)){verdict={ok:null,t:`Почти: ${pos}-е место при задаче ${S.goal}-е. Совет ждёт прогресса.`}}
  else{S.warnings++;verdict={ok:false,t:`Провал: ${pos}-е место при задаче ${S.goal}-е. Предупреждение ${S.warnings} из 2.`}}
  const champ=driverStandings()[0];
  S.history.push({season:year(),pos,champ:champ.name,ctid:st[0].id,cname:st[0].name});
  // неистраченный фонд FOM инженеры распределяют поровну
  if(S.devFund>0){const per=S.devFund/4;PARTS.forEach(([k])=>me().next[k]+=per*devEff(me(),k));news(`Инженеры распределили остаток фонда на новый болид: ${fm(S.devFund,1)}.`);S.devFund=0}
  const broke=S.budget<-20;
  if(broke)verdict={ok:false,t:`Банкротство: долг ${fm(-S.budget,1)}. Владельцы закрывают проект.`};
  UI.season={pos,prize,verdict,champ:champ.name,cteam:st[0].name,gameover:S.warnings>=2||broke};
  S.lastPos={};st.forEach((t,i)=>S.lastPos[t.id]=i+1);S.devFund=fundFor(me());
  // межсезонье
  if(!UI.season.gameover){
    S.season++;S.round=0;S.results=[];S.projects=[];S.day=raceDay(seasonTracks()[0])-24;
    // клиентский мотор: как у поставщика минус 3
    const newCar={};S.teams.forEach(t=>{newCar[t.id]={};PARTS.forEach(([k])=>newCar[t.id][k]=clamp(nextStat(t,k),40,99))});
    S.teams.forEach(t=>{if(t.engineSup&&newCar[t.engineSup])newCar[t.id].engine=clamp(newCar[t.engineSup].engine-3,40,99)});
    UI.season.newCar=PARTS.map(([k,n])=>[n,me().car[k],newCar[S.pid][k]]);
    S.teams.forEach(t=>{t.pts=0;PARTS.forEach(([k])=>t.car[k]=newCar[t.id][k]);t.next={aero:0,engine:0,chassis:0,rel:0}});
    S.spent=0;S.rules.freeze=false;S.vote=null;
    Object.values(S.parts||{}).forEach(P=>COMPS.forEach(([k])=>{P[k].used=1;P[k].h=100;P[k].sp=1}));S.gpen={};S.teams.forEach(o=>o.spec={});S.stockNew={};
    const pool=[];
    Object.values(S.drivers).forEach(d=>{d.pts=0;d.wins=0;d.pods=0;d.age++;ensureAttrs(d);d.exp=Math.min(99,d.exp+3);
      if(d.age<=26)d.pace=clamp(d.pace+ri(0,2),50,99);else if(d.age>=33)d.pace=clamp(d.pace-ri(0,2),50,99);
      d.salary=salaryFor(d.pace);
      if(d.team&&d.team!==S.pid){d.contract--;if(d.contract<=0)d.contract=ri(1,3)}
      if(d.team===S.pid)d.contract--;
      // предварительные контракты: переход в нашу команду
      if(d.next&&!d.retired){const from=team(d.team);if(from)from.drivers=from.drivers.filter(x=>x!==d.id);
        d.team=d.next.tid;d.contract=d.next.len;d.salary=d.next.salary;if(!me().drivers.includes(d.id))me().drivers.push(d.id);ensureParts(d.id);
        news(`${d.name} переходит в команду${from&&from.id!==S.pid?` из «${from.name}»`:''}: контракт до ${year()+d.contract-1}.`);delete d.next}
    });
    // завершение карьеры и истёкшие контракты в нашей команде
    STAFF_ROLES.forEach(([k,n])=>{const sf=me()[k];if(!sf)return;sf.contract=(sf.contract||1)-1;
      if(sf.contract<=0){news(`${n} ${sf.name} покидает команду: контракт истёк. Обязанности временно исполняет помощник.`);me()[k]={name:'И. о. — '+pick(FIRST)+' '+pick(LAST),rating:48,salary:.4,contract:1,acting:true}}});
    me().drivers=me().drivers.filter(id=>{const d=drv(id);
      if(d.retiring){d.team=null;d.retired=true;news(`${d.name} завершил карьеру. Нужен новый пилот — смотрите рынок и академию.`);return false}
      if(d.contract<=0){d.team=null;d.contract=0;news(`Контракт ${d.name} истёк — пилот покидает команду.`);return false}
      return true});
    // академия: юниоры взрослеют, старше 23 — выпускаются
    leaguesSeasonEnd();
    S.academy.juniors.forEach(j=>{j.age++;j.exp=Math.min(99,(j.exp||40)+4)});S.academy.juniors=S.academy.juniors.filter(j=>{if(j.age>23){news(`${j.name} покидает академию: возраст.`);return false}return true});
    // уход ветеранов у соперников
    S.teams.forEach(t=>{if(t.id===S.pid)return;t.drivers=t.drivers.map(id=>{const d=drv(id);if(d.retiring||d.age>=45){d.team=null;d.retired=true;
      let fa=Object.values(S.drivers).filter(x=>!x.team&&!x.retired).sort((a,b)=>b.pace-a.pace)[0];
      if(!fa||Math.random()<.4){fa=rookie();S.drivers[fa.id]=fa}fa.team=t.id;fa.contract=ri(1,3);
      news(`${d.name} завершает карьеру. В «${t.name}» приходит ${fa.name}.`);return fa.id}return id})});
    // соперники закрывают вакансии свободными пилотами
    S.teams.forEach(t=>{if(t.id===S.pid)return;while(t.drivers.length<2){let fa=Object.values(S.drivers).filter(x=>!x.team&&!x.retired&&!x.next).sort((a,b)=>b.pace-a.pace)[0];
      if(!fa||Math.random()<.3){fa=rookie();S.drivers[fa.id]=fa}fa.team=t.id;fa.contract=ri(1,3);t.drivers.push(fa.id);ensureParts(fa.id);news(`«${t.name}» подписывает ${fa.name}.`)}});
    for(let i=0;i<2;i++){const r=rookie();S.drivers[r.id]=r}
    // всегда есть доступный резервный пилот
    const rv=mkDriver(pick(FIRST)+' '+pick(LAST),ri(21,27),ri(72,74),ri(72,78),ri(72,78));S.drivers[rv.id]=rv;
    S.sponsors=S.sponsors.filter(()=>Math.random()<.5);
    S.offers=[];for(let i=0;i<4;i++)S.offers.push(mkOffer());
    S.market=staffMarket();
    // цель совета не строже, чем позволяет бюджет команды: от команды с 6-м бюджетом не требуют места выше 5-го
    const bRank=[...S.teams].sort((a,b)=>b.budget-a.budget).findIndex(x=>x.id===S.pid)+1;
    S.goal=clamp(Math.min(S.goal,pos+1)-(verdict.ok?1:0),Math.max(1,bRank-1),S.teams.length-1);
    news(`Сезон ${year()} начинается. Новая цель совета: ${S.goal}-е место или выше.`);
  }
  save(true);UI.screen='season';render();
}

// что требует внимания: срочные проблемы и доступные решения по данным игры (важное — первым)
function bestUpgrade(){
  const t=me(),tr=seasonTracks().slice(S.round,S.round+5);if(!tr.length)return null;
  const w={aero:tr.reduce((a,x)=>a+x.aero*(S.rules.aeroW||1),0)/tr.length,engine:tr.reduce((a,x)=>a+x.engine,0)/tr.length,chassis:1,rel:.6};
  let best=null;PARTS.forEach(([k,n])=>{if(k==='engine'&&(S.rules.freeze||t.engineSup))return;if(S.projects.some(p=>p.part===k))return;
    const u=UPG[0],c=upgCost(k,u),g=u.g*(.7+t.td.rating/200)*partBoost(t,k),val=g*w[k]/c;if(upgBlock(k,c))return;
    if(!best||val>best.val)best={k,n,c,g,val,why:k==='rel'?'меньше риск схода':`на ближайших трассах вес ${w[k].toFixed(2).replace('.',',')}`}});
  return best;
}
function attention(){
  const t=me(),L=[],add=(lvl,txt,d,a,v,btn)=>L.push({lvl,txt,d,a,v,btn});
  if(t.drivers.length<2)add(3,'Нет второго пилота','Без двух пилотов нельзя начать уик-энд.','goto','staff|','К пилотам');
  t.drivers.forEach(id=>COMPS.forEach(([k,n])=>{const P=ensureParts(id)[k],w=nextWear(id,k),q=S.prod.filter(x=>x.k===k).length;
    if(P.h<w*1.05){const fatal=FATAL.has(k);add(fatal?3:2,`${nm(id)}: ${n} не доживёт до финиша (${Math.round(P.h)}%, нужно ~${Math.round(w)}%)`,S.stock[k]>0?'На складе есть узел — поставьте его.':q?`Узел в производстве: ${etaText(Math.min(...S.prod.filter(x=>x.k===k).map(x=>x.days)))}.`:fatal?'Склад пуст — закажите узел, иначе сход.':'Склад пуст — машина потеряет темп.',S.stock[k]>0?'fit':'prod',S.stock[k]>0?`${id}|${k}`:k,S.stock[k]>0?'Поставить':'Заказать')}}));
  const left=Math.max(0,NR()-S.round),net=incPerRace()-mandPerRace();
  if(S.budget<0)add(3,`Бюджет в минусе: ${fm(S.budget,1)}`,'При долге больше 20 млн в конце сезона команду закроют.','goto','money|','Финансы');
  else if(net<0&&S.budget/-net<left)add(2,`Денег хватит примерно на ${Math.floor(S.budget/-net)} ${plural(Math.floor(S.budget/-net),'этап','этапа','этапов')}`,`Обязательные расходы ${fm(mandPerRace(),2)} больше гарантированного дохода ${fm(incPerRace(),2)} за этап.`,'goto','money|','Финансы');
  if(S.vote&&S.vote.mine==null)add(2,'Голосование по регламенту','Решение примут перед следующим уик-эндом.','goto','hq|vote','Голосовать');
  t.drivers.map(drv).filter(d=>d.retiring&&!d.persuaded).forEach(d=>add(2,`${d.name} хочет завершить карьеру`,'Поговорите с ним, пока он не ушёл.','goto','staff|','Поговорить'));
  if(S.sponsors.length<3&&S.offers.length){const o=[...S.offers].sort((a,b)=>b.per-a.per)[0];add(2,`Свободно мест для спонсоров: ${3-S.sponsors.length}`,`Лучшее предложение: «${o.name}», +${fm(o.per,2)} за этап.`,'goto','money|','Спонсоры')}
  const devAv=Math.max(0,Math.min(S.budget-mandPerRace()*3,capLeft()));
  if(S.projects.length<maxProjects()){const b=bestUpgrade();if(b&&devAv>=b.c)add(1,`Свободно слотов разработки: ${maxProjects()-S.projects.length}`,`Выгоднее всего сейчас: доработка «${b.n}» — +${b.g.toFixed(1).replace('.',',')} за ${fm(b.c,1)} (${b.why}).`,'goto','car|sec-upg','К разработке')}
  COMPS.forEach(([k,n])=>{const sp=teamSpec(t,k);if(sp>1&&(S.stockNew||{})[k]>0&&t.drivers.some(id=>(ensureParts(id)[k].sp||1)<sp))add(1,`Готовы узлы новой версии: ${n}, спец. ${sp}`,'На машинах стоит старая версия.','goto','car|sec-parts','К узлам')});
  if(windowOpen()&&seatsNext()>0)add(1,`Место на ${year()+1} свободно: ${seatsNext()}`,'Открыт рынок пилотов — договоритесь о контракте на следующий сезон.','goto','staff|','К рынку');
  const sx=STAFF_ROLES.filter(([k])=>t[k]&&!t[k].acting&&t[k].contract<=1).map(([,n])=>n);if(sx.length&&S.round>NR()*.5)add(S.round>NR()*.8?2:1,`Контракты персонала истекают: ${sx.join(', ')}`,'Без продления их заменят временные сотрудники с рейтингом 48 — разработка и пит-стопы станут хуже.','goto','staff|','К персоналу');
  const acting=STAFF_ROLES.filter(([k])=>t[k]&&t[k].acting).map(([,n])=>n);if(acting.length)add(2,`Временно исполняют обязанности: ${acting.join(', ')}`,'Наймите постоянных сотрудников на рынке персонала.','goto','staff|','К персоналу');
  const ex=t.drivers.map(drv).filter(d=>d.contract<=1&&!d.retiring);if(ex.length&&S.round>NR()*.5)add(1,`Контракт истекает: ${ex.map(d=>d.name).join(', ')}`,'Продлите или найдите замену до конца сезона.','goto','staff|','Переговоры');
  return L.sort((a,b)=>b.lvl-a.lvl);
}

function upgBlock(k,c){const t=me(),pr=S.projects.find(p=>p.part===k);
  if(k==='engine'&&S.rules.freeze)return'двигатели заморожены регламентом до конца сезона';
  if(pr)return`уже идёт проект по этой части — готово ${etaText(pr.days)}`;
  if(S.projects.length>=maxProjects())return`все слоты разработки заняты (${S.projects.length}/${maxProjects()}) — дождитесь окончания проекта или наймите техдиректора сильнее`;
  if(t.car[k]>=99)return'достигнут максимум';
  if(c>capLeft())return`не хватает потолка расходов: осталось ${capLeft()} млн`;
  if(S.budget<c)return`не хватает бюджета: нужно ${c.toFixed(1).replace('.',',')} млн, есть ${fm(S.budget,1)}`;
  return'';}

  const rt=$('#rtop');if(rt){const left=Math.max(0,R.N-Math.min(R.N,lap)+1);rt.innerHTML=`${R.sc>0?'<span class="flag sc">МАШИНА БЕЗОПАСНОСТИ</span>':''}<span>${R.done?'ФИНИШ':left<=1?'ПОСЛЕДНИЙ КРУГ':`ОСТАЛОСЬ ${left} ${plural(left,'КРУГ','КРУГА','КРУГОВ').toUpperCase()}`}</span>`}

// внутренние функции для автотестов — только при открытии с ?debug
// бот-игрок для прогонов экономики (только в режиме отладки): spend — развивается разумно, save — только спонсоры
function botPolicy(pol){
  if(!S)return;const t=me();
  while(S.sponsors.length<3&&S.offers.length){const i=S.offers.reduce((bi,o,j,a)=>o.per>a[bi].per?j:bi,0);const o=S.offers.splice(i,1)[0];S.sponsors.push(o);money(o.sign,'sponsor','Бонус за подписание: '+o.name)}
  // составы: продлить пилотов, закрыть свободное место лучшим доступным
  t.drivers.forEach(id=>{const d=drv(id);if(d.contract<=1&&!d.retiring&&S.round>NR()*.7){d.salary=asking(d);d.contract=3}});
  STAFF_ROLES.forEach(([k])=>{const sf=t[k];if(sf&&!sf.acting&&sf.contract<=1&&S.round>NR()*.7){sf.salary=staffAsk(sf);sf.contract=3}});
  STAFF_ROLES.forEach(([k])=>{if(!t[k]||!t[k].acting||!S.market||!S.market[k])return;const c=[...S.market[k]].sort((a,b)=>b.rating-a.rating).find(c=>hireCost(k,c)<S.budget-10);if(c){money(-hireCost(k,c),'staff','Найм: '+c.name);c.contract=2;t[k]=c;S.market[k]=S.market[k].filter(x=>x!==c)}});
  while(t.drivers.length<2){const fa=Object.values(S.drivers).filter(d=>!d.team&&!d.retired).sort((a,b)=>b.pace-a.pace)[0];if(!fa)break;fa.team=S.pid;fa.contract=2;t.drivers.push(fa.id);ensureParts(fa.id)}
  if(pol==='save')return;
  // зеркало ИИ: та же сумма и та же раскладка, что у соперников, но из настоящего бюджета игрока
  if(pol==='mirror'){const m=Math.min(aiDevBudget(t)/NR(),Math.max(0,S.budget-mandPerRace()*2),capLeft()),nx=S.round>NR()*.4?.7:.3;if(m<=0)return;
    const ff=Math.min(S.devFund,m*nx),fb=m-ff;S.devFund=+(S.devFund-ff).toFixed(2);money(-fb,'dev','Разработка (зеркало ИИ)');S.spent=+(S.spent+fb).toFixed(2);
    PARTS.forEach(([k])=>{if(k==='engine'&&t.engineSup)return;t.next[k]+=m*nx/4*devEff(t,k)});
    const part=pick(['aero','engine','chassis','aero','engine','chassis','rel'].filter(k=>!(k==='engine'&&(t.engineSup||S.rules.freeze))));t.car[part]=clamp(+(t.car[part]+m*(1-nx)*BAL.aiPtsPerM*(.7+t.td.rating/200)*facMul(t,part)/(1+Math.max(0,t.car[part]-70)/40)).toFixed(1),0,100);return}
  const reserve=pol==='risky'?2:10;
  // одна характеристика: все проекты только в аэродинамику
  if(pol==='aero'){if(S.projects.length<maxProjects()&&!S.projects.some(p=>p.part==='aero')){const u=S.budget>30?UPG[1]:UPG[0],c=upgCost('aero',u);if(S.budget-c>reserve&&c<=capLeft()){money(-c,'dev','Доработка');S.spent=+(S.spent+c).toFixed(2);S.projects.push({part:'aero',gain:+(u.g*(.7+t.td.rating/200)*partBoost(t,'aero')).toFixed(1),days:u.d})}}
    if(S.round>NR()*.55&&S.budget>reserve+6){const c=5,ff=Math.min(S.devFund,c),fb=c-ff;if(fb<=capLeft()){S.devFund=+(S.devFund-ff).toFixed(2);money(-fb,'dev','Болид следующего года');S.spent=+(S.spent+fb).toFixed(2);t.next.aero+=c*devEff(t,'aero')}}return}
  // инфраструктура: сначала стройка, разработка только на остаток
  if(pol==='infra'){const k=FACS.map(f=>f[0]).sort((a,b)=>S.fac[a]-S.fac[b]).find(k=>S.fac[k]<5&&!S.facBuild[k]);if(k&&S.budget-FAC_COST[S.fac[k]]>reserve){money(-FAC_COST[S.fac[k]],'build','Стройка');S.facBuild[k]={days:FAC_DAYS[S.fac[k]]};return}}
  if(S.projects.length<maxProjects()){const k=[...PARTS].map(([k])=>k).filter(k=>!S.projects.some(p=>p.part===k)&&!(k==='engine'&&(S.rules.freeze||t.engineSup))).sort((a,b)=>t.car[a]-t.car[b])[0];

  if(S.round>NR()*.55&&S.budget>reserve+6){const k=PARTS.map(([k])=>k).filter(k=>!(t.engineSup&&k==='engine')).sort((a,b)=>t.next[a]-t.next[b])[0],c=5,ff=Math.min(S.devFund,c),fb=c-ff;
    if(fb<=capLeft()){S.devFund=+(S.devFund-ff).toFixed(2);money(-fb,'dev','Болид следующего года');S.spent=+(S.spent+fb).toFixed(2);t.next[k]+=c*devEff(t,k)}}
  if(S.budget>35){const k=FACS.map(f=>f[0]).find(k=>S.fac[k]<5&&!S.facBuild[k]);if(k&&S.budget-FAC_COST[S.fac[k]]>reserve){money(-FAC_COST[S.fac[k]],'build','Стройка');S.facBuild[k]={days:FAC_DAYS[S.fac[k]]}}}
}
// быстрая карьера без отрисовки (только отладка): те же функции игры, интерфейс и сохранение отключены на время прогона
function batchCareer(o){
  const r0=render,s0=save;render=()=>{};save=()=>true;const set0={...SET};Object.assign(SET,{mode:'sim',len:1,intro:0,music:0});
  const out={seasons:[],stopped:null};
  try{
    UI.own=o.team==='own';newGame(o.team==='own'?0:+o.team,'');
    for(let si=0;si<o.seasons;si++){
      const sea={dnf:0,starts:0,pos:[],stops:{},tyres:{},grid:[]};
      for(let r=0;r<NR();r++){
        botPolicy(o.policy);
        startWeekend();me().drivers.forEach(id=>{const st={};Object.keys(W.ideal).forEach(k=>st[k]=clamp(W.ideal[k]+ri(-1,1),1,9));W.setups[id]=st});while(stepName()!=='quali')nextStep();runQuali();
        if(W.seed==null)W.seed=Math.floor(Math.random()*2147483647);
        const rng=mulberry32(W.seed),mr=Math.random;Math.random=rng;try{startRace0()}finally{Math.random=mr}R.rng=rng;
        while(R.lapDone<R.N)withRng(()=>simLap(R.lapDone+1));
        R.T=Math.max(...R.cars.filter(c=>!c.out).map(c=>c.cum[R.N]||0))+1;R.done=true;
        sea.why=sea.why||{};R.cars.filter(c=>c.out).forEach(c=>{const k=(c.me?'me:':'ai:')+(c.outWhy||'?');sea.why[k]=(sea.why[k]||0)+1});R.cars.filter(c=>c.me).forEach(c=>{sea.starts++;if(c.out)sea.dnf++;sea.stops[c.stops]=(sea.stops[c.stops]||0)+1;c.used.forEach(t=>sea.tyres[t]=(sea.tyres[t]||0)+1)});
        sea.allDnf=(sea.allDnf||0)+R.cars.filter(c=>c.out).length;sea.allStarts=(sea.allStarts||0)+R.cars.length;
        if(o.diag){const tr=R.track;out.diag=out.diag||[];R.cars.forEach(c=>{const t=team(c.tid),d=drv(c.did);out.diag.push({me:c.me,tid:c.tid,perf:+((100-perf(t,tr))*.06).toFixed(3),pace:+((100-d.pace)*.035).toFixed(3),sq:+(-(c.sq-60)*.012).toFixed(3),spec:+(-specBonus(S.parts[c.did])).toFixed(3),stops:c.stops,pen:c.pen,time:c.out?null:+(c.cum[R.N]/R.N).toFixed(3),out:c.out})})}
        finishRace();W=null;R=null;
        S.lastRace.rows.filter(x=>x.me).forEach(x=>sea.pos.push(x.out?99:x.pos));
      }
      const st=teamStandings(),cars=S.teams.map(t=>carOverall(t)).sort((a,b)=>b-a);
      sea.cpos=st.findIndex(t=>t.id===S.pid)+1;sea.car=+carOverall(me()).toFixed(1);sea.carBest=+cars[0].toFixed(1);sea.carMed=+cars[Math.floor(cars.length/2)].toFixed(1);
      sea.budgetEnd=S.budget;const F=finState();sea.cats={...F.cats};sea.fac=Object.values(S.fac).reduce((a,v)=>a+v,0);
      endSeason();sea.afterSeason=S.budget;sea.warnings=S.warnings;out.seasons.push(sea);
      if(UI.season&&UI.season.gameover){out.stopped=S.budget<-20?'bankrupt':'fired';break}

  return out;
}
