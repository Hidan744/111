<title>Пит-Уолл</title>

<style>
/* Layout: экран пит-уолла — шапка команды, прокручиваемая панель, нижняя таб-панель как в мобильном приложении */
:root{
  --bg:#0b0f14; --panel:#121a23; --panel2:#18222e; --line:#243242;
  --fg:#e8eef4; --muted:#8597ab; --accent:#ffb020; --accent-ink:#1a1100;
  --good:#3fd27f; --bad:#ff5a4f; --info:#55b6ff;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --team:#ff8a1f;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:16px}
.btn.small{padding:7px 11px;min-height:34px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.chip{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.stat{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv>div{background:var(--panel2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--team) 14%,transparent)}
.tblwrap{overflow-x:auto}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* header */
.top{padding-block:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--team) 0 35%,transparent 35%)}
.badge{width:40px;height:40px;border-radius:8px;background:var(--team);display:grid;place-items:center;font-family:var(--display);color:#0b0f14;font-size:13px;flex:none}
.money{font-family:var(--mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
/* tabbar */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tabs button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent)}
/* title */
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px}
.logo{font-family:var(--display);font-size:52px;line-height:.95;letter-spacing:.01em}
.logo span{color:var(--accent)}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--fg) 0 10px,var(--bg) 10px 20px);opacity:.9;border-radius:2px}
.teampick{display:flex;flex-direction:column;gap:8px}
.teampick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.teampick button.on{border-color:var(--accent);background:var(--panel2)}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:12px;font:inherit;min-height:44px}
/* race */
.racehead{padding-block:8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.lapbox{font-family:var(--display);font-size:20px}
canvas.track{width:100%;display:block;background:var(--panel);border-radius:10px;border:1px solid var(--line)}
.drvctl{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--team);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tyre{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:3px solid;font-size:10px;font-weight:700;font-family:var(--mono);flex:none;background:#0b0f14;color:#e8eef4}
.pitrow{display:flex;gap:6px;align-items:center}
.pitrow button.tbtn{width:40px;height:40px;border-radius:50%;border:3px solid;font-family:var(--mono);font-weight:700;background:var(--bg)}
.pitrow button.tbtn.on{box-shadow:0 0 0 3px var(--accent);background:var(--panel2)}
.feed{font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.feed div{padding-left:10px;border-left:2px solid var(--line)}
.flag{padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em}
.flag.sc{background:#ffd23f;color:#1a1400}
.flag.wet{background:var(--info);color:#04131f}
.flag.dry{background:var(--panel2);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:90%;text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.pos{font-family:var(--display);font-size:13px;width:22px;text-align:center}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.podium div{background:var(--panel2);border-radius:8px 8px 0 0;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.podium div b{font-family:var(--display);font-size:22px}
.podium .p1{min-height:110px;border-top:3px solid var(--accent)}
.podium .p2{min-height:90px}
.podium .p3{min-height:76px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 3D, раскладки для компьютера, настройки */
.cols{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.narrow{max-width:720px;width:100%;margin-inline:auto}
.show{width:100%;aspect-ratio:16/9;max-width:100%;display:block;border-radius:10px;background:radial-gradient(ellipse at 50% 70%,#1d2a38,#0b0f14 70%);touch-action:pan-y;cursor:grab}
.racebody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:10px 24px;display:flex;flex-direction:column;gap:10px}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.viewport{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#06090c;aspect-ratio:16/10;max-width:100%;flex:none}
.viewport>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.viewport>canvas.mini{inset:8px 8px auto auto;width:30%;height:auto;aspect-ratio:1.6;background:rgba(11,15,20,.62);border-radius:8px;border:1px solid rgba(232,238,244,.12)}
.hud{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.hudtag{background:rgba(11,15,20,.72);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:11px;color:var(--fg)}
.camseg{display:flex;gap:4px;flex-wrap:wrap}
.camseg button{background:rgba(11,15,20,.72);border:1px solid rgba(232,238,244,.16);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;min-height:32px}
.camseg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lights{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:flex;gap:8px;background:#06090c;padding:10px 12px;border-radius:10px;border:1px solid #243242}
.lights i{width:22px;height:22px;border-radius:50%;background:#2a1416;display:block}
.lights i.on{background:#ff2a1f;box-shadow:0 0 14px #ff2a1f}
.slider{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.fb{font-size:12.5px}
tr[data-a]{cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8}
@media (max-width:600px){.viewport{aspect-ratio:4/3}.camseg button{padding:4px 7px;font-size:11px;min-height:28px}}
@media (min-width:900px){
  #app{max-width:1180px}
  .cols{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .tabs{grid-template-columns:repeat(5,minmax(0,140px));justify-content:center}
}
@media (min-width:960px){
  #app.wide{max-width:1680px}
  .racebody{display:grid;grid-template-columns:minmax(0,1fr) 400px;overflow:hidden;padding-block:12px}
  .racebody .viewport{aspect-ratio:auto;height:100%}
  .racebody .side{overflow-y:auto;min-height:0;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- модель круга ---------- */
function lapModel(c,lap,wet){
  const tr=R.track,t=team(c.tid),d=drv(c.did);
  let lt=tr.base+(100-perf(t,tr))*.06+(100-d.pace)*.035-lap*.03;
  if(wet){lt+=7+(100-d.craft)*.025+(c.tyre==='I'?0:8.5)}else lt+=TYRES[c.tyre].off;
  const h=c.health;lt+=(100-h)*.018+(h<35?(35-h)*.09:0);
  lt+=c.mode==='push'?-.35:c.mode==='save'?.45:0;
  lt-=(c.sq-60)*.012;
  lt+=gauss()*(.15+(100-d.craft)/100*.35)*(lap===1?2.2:1);
  return lt;
}
function wearRate(c,wet){
  const d=drv(c.did);let w=TYRES[c.tyre].wear;
  if(c.tyre==='I'&&!wet)w=7.5;
  return w*(1.25-d.tyre/200)*(c.mode==='push'?1.45:c.mode==='save'?.7:1);
}

function aiDecide(c,k,wet,sc){
  if(c.me||c.pitReq)return;
  const left=R.N-k+1;
  if(wet&&c.tyre!=='I'){if(Math.random()<.65)c.pitReq='I';return}
  if(!wet&&c.tyre==='I'){if(Math.random()<.65)c.pitReq=left>14?'H':left>8?'M':'S';return}
  if(left<=1)return;
  const dry=c.used.filter(x=>x!=='I');
  const needSecond=!R.anyWet&&new Set(dry).size<2;
  if(c.health<c.thr||(sc&&c.health<62&&left>4)||(needSecond&&left<=3)){
    let ch=left>15?'H':left>8?'M':'S';
    if(needSecond&&ch===c.tyre)ch=ch==='H'?'M':ch==='M'?(left>10?'H':'S'):'M';
    if(left<=3&&c.health>45&&!needSecond)return;
    c.pitReq=ch;
  }
}

    if(Math.random()<pDnf){c.out=true;c.outLap=k;c.parkF=(k-1)+clamp((R.T-c.cum[k-1])/(R.track.base+5),.05,.95);c.cum.push(Infinity);feed(`${nm(c.did)} сходит: ${pick(wet?['вылет в гравий','авария в мокром повороте']:['отказ двигателя','поломка коробки передач','отказ гидравлики','сломана подвеска'])}.`,c.me);continue}
    // ошибка

      lt+=(sc?R.track.pit*.45:R.track.pit)+st;
      c.tyre=c.pitReq;c.health=100;c.stops++;c.used.push(c.tyre);c.pitReq=null;pitted.add(c);
      if(c.me||slow)feed(`${nm(c.did)} в боксах: ${TYRES[c.tyre].n.toLowerCase()}, стоянка ${st.toFixed(1).replace('.',',')} с${slow?' — проблема с колесом':''}.`,c.me);
    }else c.pitReq=null;
    c.health=Math.max(0,c.health-wearRate(c,wet)*(sc?.35:1));
    let end=c.cum[k-1]+lt;
    if(prev&&!sc&&!pitted.has(c)&&!pitted.has(prev)&&c.cum[k-1]-prev.cum[k-1]<2.5){
      if(end<prevEnd+.25){
        if(end<prevEnd){
          const pd=drv(prev.did);
          const p=clamp(.22+(prevEnd-end)*.35-R.track.over*.38+(d.craft-pd.craft)/150-(wet?.05:0),.05,.92);
          if(Math.random()<p){if(c.me||prev.me)feed(`${nm(c.did)} обгоняет ${nm(prev.did)}!`,true)}
          else end=prevEnd+rnd(.25,.6);
        }else end=prevEnd+.25+rnd(0,.2);
      }
    }
    c.last=lt;if(!sc&&!pitted.has(c)&&k>1)c.best=Math.min(c.best,lt);
    c.cum.push(end);
    if(!pitted.has(c)){if(prevEnd===null||end>prevEnd){prevEnd=end;prev=c}}
  }
  if(sc){
    const ord=R.cars.filter(c=>!c.out).sort((a,b)=>a.cum[k]-b.cum[k]);
    for(let i=1;i<ord.length;i++){const g=ord[i].cum[k]-ord[i-1].cum[k];ord[i].cum[k]=ord[i-1].cum[k]+Math.min(g,.9)}
    R.sc--;if(R.sc===0)feed('Машина безопасности уходит. Рестарт!');
  }
  if(k<R.N&&R.wet[k]!==wet)feed(R.wet[k]?'Начинается дождь!':'Дождь прекращается, трасса подсыхает.');
  R.lapDone=k;
}
function carProgress(c,T){
  const cum=c.cum;let i=0;
  while(i<cum.length-1&&cum[i+1]<=T)i++;
  if(i>=cum.length-1){return{laps:i,f:0,done:i>=R.N}}
  const a=cum[i],b=cum[i+1];
  if(!isFinite(b))return{laps:i,f:0,out:true};
  return{laps:i,f:clamp((T-a)/(b-a),-.5,1),done:false};
}
function liveOrder(){
  const T=R.T;
  const arr=R.cars.map(c=>{const p=carProgress(c,T);return{c,p,prog:c.out?-1e6+c.cum.length:p.laps+p.f}});
  arr.sort((a,b)=>b.prog-a.prog);
  const lead=arr[0];
  arr.forEach(x=>{
    if(x.c.out){x.gap='Сход';return}
    if(x===lead){x.gap='Лидер';return}
    const L=Math.min(x.p.laps,R.N);
    const g=x.c.cum[L]-lead.c.cum[L];
    const lapsDown=lead.p.laps-x.p.laps-(x.p.f>lead.p.f?0:0);
    x.gap=lapsDown>=1&&g>R.track.base?`+${lapsDown} кр.`:fgap(Math.max(0,g));
  });
  return arr;
}
let lastTs=0,lastUi=0;
function loop(ts){
  if(UI.screen!=='race'||!R)return;
  const dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0;lastTs=ts;
  if(R.count>0){
    R.count-=dt;
    const n=clamp(Math.floor((3.6-R.count)/.6),0,5);
    document.querySelectorAll('#lights i').forEach((el,i)=>el.classList.toggle('on',i<n&&R.count>0));
    if(R.count<=0){const l=$('#lights');if(l)l.hidden=true;feed('Огни погасли — старт!')}
  }else if(!R.paused&&!R.done){
    R.T+=dt*6.5*R.speed;
    // досчитать круги
    for(;;){
      const k=R.lapDone;if(k>=R.N)break;
      const run=R.cars.filter(c=>!c.out);if(!run.length)break;
      const lead=Math.min(...run.map(c=>c.cum[k]));
      if(R.T>=lead)simLap(k+1);else break;
    }
    if(R.lapDone>=R.N){
      const run=R.cars.filter(c=>!c.out);
      if(run.every(c=>R.T>=c.cum[R.N])){R.done=true;finishRace();return}
    }
  }
  if(G)draw3D(dt);
  drawRace();
  if(ts-lastUi>300){lastUi=ts;updateRaceUi()}
  requestAnimationFrame(loop);
}
function drawRace(){
  const cv=$('#trk');if(!cv)return;
  const{ctx,w,h}=fitBox(cv);if(!w)return;
  const mini=cv.classList.contains('mini');
  const wetNow=R.wet[Math.min(R.N-1,R.lapDone)];
  const tf=drawTrack(ctx,w,h,R.path,mini?Math.max(4,w*.03):Math.max(10,w*.035),wetNow);
  const ord=liveOrder();
  for(let i=ord.length-1;i>=0;i--){
    const x=ord[i];if(x.c.out||x.p.done)continue;
    const[px,py]=tf(pointAt(R.path,x.p.f));
    const t=team(x.c.tid);
    ctx.beginPath();ctx.arc(px,py,mini?(x.c.me?4:2.6):(x.c.me?7:5),0,Math.PI*2);ctx.fillStyle=t.color;ctx.fill();
    if(x.c.me&&mini){ctx.lineWidth=1.5;ctx.strokeStyle='#ffffff';ctx.stroke()}
    else if(x.c.me){ctx.lineWidth=2.5;ctx.strokeStyle='#ffffff';ctx.stroke();
      ctx.font='600 11px JetBrains Mono, monospace';ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.fillText(String(i+1),px,py-11)}
    else{ctx.lineWidth=1;ctx.strokeStyle='#0b0f14';ctx.stroke()}
  }
  if(R.sc>0){ctx.fillStyle='#ffd23f';ctx.font='600 12px JetBrains Mono, monospace';ctx.textAlign='left';ctx.fillText('SC',10,18)}
}
function finishRace(){
  const N=R.N;
  const fin=R.cars.filter(c=>!c.out).map(c=>{
    const dry=new Set(c.used.filter(x=>x!=='I'));
    if(!R.anyWet&&dry.size<2){c.pen=10}
    return{c,t:c.cum[N]+c.pen};
  }).sort((a,b)=>a.t-b.t);
  const dnf=R.cars.filter(c=>c.out).sort((a,b)=>b.cum.length-a.cum.length).map(c=>({c,t:Infinity}));
  const res=[...fin,...dnf];
  const win=fin[0]?fin[0].t:0;
  const rows=res.map((x,i)=>{
    const pts=x.c.out?0:(POINTS[i]||0);
    const d=drv(x.c.did);d.pts+=pts;team(x.c.tid).pts+=pts;
    if(i===0&&!x.c.out)d.wins++;if(i<3&&!x.c.out)d.pods++;
    return{did:x.c.did,tid:x.c.tid,pos:i+1,grid:x.c.grid,out:x.c.out,time:x.t,gap:x.c.out?null:x.t-win,pts,pen:x.c.pen,stops:x.c.stops,me:x.c.me,best:x.c.best};
  });
  // экономика
  const mine=rows.filter(r=>r.me);
  const ptsMine=mine.reduce((s,r)=>s+r.pts,0);
  const best=Math.min(...mine.map(r=>r.out?99:r.pos));
  const goalOk={finish:mine.every(r=>!r.out),points:mine.some(r=>!r.out&&r.pos<=10),both:mine.every(r=>!r.out&&r.pos<=10),podium:best<=3,win:best===1};
  const inc=[];
  S.sponsors.forEach(s=>{inc.push([s.name,s.per]);if(goalOk[s.goal])inc.push([`Бонус: ${s.name}`,s.bonus])});
  if(ptsMine)inc.push(['Призовые за очки',+(ptsMine*.12).toFixed(2)]);
  const t=me();
  const exp=[['Зарплаты пилотов',t.drivers.reduce((s,id)=>s+drv(id).salary,0)/NR()],['Персонал',(t.td.salary+t.crew.salary)/NR()],['Логистика и операции',.6]];
  const net=inc.reduce((s,x)=>s+x[1],0)-exp.reduce((s,x)=>s+x[1],0);
  S.budget=+(S.budget+net).toFixed(2);
  // репутация
  const exp_pos=S.goal*2;
  S.rep=clamp(S.rep+(exp_pos-best)*.25+(best<=3?1:0),10,100);
  // проекты
  const done=[];
  S.projects.forEach(p=>{p.left--;if(p.left<=0){t.car[p.part]=clamp(+(t.car[p.part]+p.gain).toFixed(1),0,100);done.push(p)}});
  S.projects=S.projects.filter(p=>p.left>0);
  done.forEach(p=>news(`Обновление готово: ${PARTS.find(x=>x[0]===p.part)[1].toLowerCase()} +${p.gain.toFixed(1).replace('.',',')}.`));
  // развитие соперников
  S.teams.forEach(o=>{if(o.id===S.pid)return;const part=pick(['aero','engine','chassis','aero','engine','chassis','rel']);o.car[part]=clamp(+(o.car[part]+o.budget/60*rnd(.2,1.3)*DIFF_DEV[SET.diff]).toFixed(1),0,100)});
  // новые предложения
  if(S.round%3===2){S.offers.push(mkOffer());S.offers=S.offers.slice(-5)}
  const winner=rows[0];
  S.results.push({round:S.round,winner:winner.did,wtid:winner.tid,my:mine.map(r=>r.out?'сход':r.pos)});
  const mtxt=mine.map(r=>`${nm(r.did)} — ${r.out?'сход':r.pos+'-й'}`).join(', ');
  news(`${W.tr.gp}: победа ${drv(winner.did).name} («${team(winner.tid).name}»). У нас: ${mtxt}.`);
  S.lastRace={rows,inc,exp,net,ptsMine,track:W.tr.gp};
  S.round++;
  save();
  UI.screen='result';render();
}

function endSeason(){
  const st=teamStandings();const pos=st.findIndex(t=>t.id===S.pid)+1;
  const prize=+((S.teams.length+1-pos)*4+6).toFixed(1);
  S.budget=+(S.budget+prize).toFixed(2);
  let verdict;
  if(pos<=S.goal){verdict={ok:true,t:`Цель выполнена: ${pos}-е место при задаче ${S.goal}-е. Совет доволен.`};S.rep=clamp(S.rep+6,10,100);S.warnings=0}
  else if(pos<=S.goal+1){verdict={ok:null,t:`Почти: ${pos}-е место при задаче ${S.goal}-е. Совет ждёт прогресса.`}}
  else{S.warnings++;verdict={ok:false,t:`Провал: ${pos}-е место при задаче ${S.goal}-е. Предупреждение ${S.warnings} из 2.`}}
  const champ=driverStandings()[0];
  S.history.push({season:year(),pos,champ:champ.name,ctid:st[0].id,cname:st[0].name});
  UI.season={pos,prize,verdict,champ:champ.name,cteam:st[0].name,gameover:S.warnings>=2};
  // межсезонье
  if(!UI.season.gameover){
    S.season++;S.round=0;S.results=[];
    S.teams.forEach(t=>{t.pts=0;PARTS.forEach(([k])=>t.car[k]=+(72+(t.car[k]-72)*.85).toFixed(1))});
    const pool=[];
    Object.values(S.drivers).forEach(d=>{d.pts=0;d.age++;
      if(d.age<=26)d.pace=clamp(d.pace+ri(0,2),50,99);else if(d.age>=33)d.pace=clamp(d.pace-ri(0,2),50,99);
      d.salary=salaryFor(d.pace);
      if(d.team&&d.team!==S.pid){d.contract--;if(d.contract<=0)d.contract=ri(1,3)}
      if(d.team===S.pid)d.contract--;
    });
    // уход ветеранов у соперников
    S.teams.forEach(t=>{if(t.id===S.pid)return;t.drivers=t.drivers.map(id=>{const d=drv(id);if(d.age>=45||(d.age>=39&&Math.random()<.4)){d.team=null;d.retired=true;
      let fa=Object.values(S.drivers).filter(x=>!x.team&&!x.retired).sort((a,b)=>b.pace-a.pace)[0];
      if(!fa||Math.random()<.4){fa=rookie();S.drivers[fa.id]=fa}fa.team=t.id;fa.contract=ri(1,3);
      news(`${d.name} завершает карьеру. В «${t.name}» приходит ${fa.name}.`);return fa.id}return id})});
    for(let i=0;i<2;i++){const r=rookie();S.drivers[r.id]=r}
    S.sponsors=S.sponsors.filter(()=>Math.random()<.5);
    S.offers=[];for(let i=0;i<4;i++)S.offers.push(mkOffer());
    S.market=staffMarket();
    S.goal=clamp(Math.min(S.goal,pos+1)-(verdict.ok?1:0),1,S.teams.length-1);
    news(`Сезон ${year()} начинается. Новая цель совета: ${S.goal}-е место или выше.`);
  }
  save();UI.screen='season';render();
}

   ${card('Графика',opt('gfx',[[0,'Низкая'],[1,'Средняя'],[2,'Высокая']]),HAS3D?'Высокая — тени, сглаживание, больше деревьев и зрителей. На слабом телефоне выберите «Низкую».':'<span style="color:var(--bad)">3D недоступно на этом устройстве, гонка будет показана схемой.</span>')}
   ${card('Вид гонки',opt('view',[['3d','3D-трансляция'],['2d','Схема трассы']]))}
   ${card('Камера по умолчанию',opt('cam',CAMS),'В гонке камеру можно переключить в любой момент.')}
  </div><div class="col">
   ${card('Скорость гонки по умолчанию',opt('speed',[[1,'×1'],[4,'×4'],[16,'×16']]))}
   ${card('Длина гонки',opt('len',[[0.6,'Короткая'],[1,'Стандарт'],[1.5,'Длинная']]),'Меняется со следующего уик-энда.')}
   ${card('Сложность',opt('diff',[[0,'Лёгкая'],[1,'Нормальная'],[2,'Сложная']]),'Влияет на скорость развития соперников и качество их настроек.')}
   ${S?card('Карьера',`<button class="btn danger block" data-a="reset">${UI.arm==='reset'?'Нажмите ещё раз — карьера будет удалена':'Сбросить карьеру'}</button>`):''}
  </div></div></div>`;
}
function updateRaceUi(){
  if(!$('#tt'))return;
  const ord=liveOrder();
  const lap=Math.min(R.N,Math.max(1,(ord[0]&&ord[0].p.laps)+1));
  $('#lap').textContent=R.done?'Финиш':`Круг ${lap}/${R.N}`;
  const k=Math.min(R.N-1,Math.max(0,lap-1)),wet=R.wet[k];
  let radar='';for(let i=k+1;i<Math.min(R.N,k+4);i++)if(R.wet[i]!==wet){radar=`<span class="flag ${R.wet[i]?'wet':'dry'}">${R.wet[i]?'Дождь':'Сухо'} через ${i-k}</span>`;break}
  $('#flags').innerHTML=`<div class="row">${R.sc>0?'<span class="flag sc">SC</span>':''}${radar}<span class="flag ${wet?'wet':'dry'}">${wet?'ДОЖДЬ':'СУХО'}</span></div>`;
  [...$('#spd').children].forEach(b=>b.classList.toggle('on',(R.paused?0:R.speed)===+b.dataset.v));
  const cs=$('#cams');if(cs)[...cs.children].forEach(b=>b.classList.toggle('on',UI.cam===b.dataset.v));
  const fi=ord.findIndex(x=>x.c.did===UI.follow);
  if(fi>=0)$('#follow').textContent=`${G?CAMS.find(c=>c[0]===UI.cam)[1]+' · ':''}${drv(UI.follow).name} · ${ord[fi].c.out?'сход':'P'+(fi+1)} · ${ord[fi].gap}`;
  $('#tt').innerHTML='<tbody>'+ord.map((x,i)=>{const t=team(x.c.tid),ty=TYRES[x.c.tyre];
    return`<tr data-a="follow" data-v="${x.c.did}"${x.c.me?' class="me"':''}><td class="pos">${x.c.out?'—':i+1}</td><td><span class="chip" style="background:${t.color}"></span> ${esc(nm(x.c.did))}</td><td class="num">${x.gap}</td><td><span class="tyre" style="border-color:${ty.col};width:18px;height:18px;border-width:2px;font-size:9px">${ty.l}</span></td><td class="num muted">${Math.round(x.c.health)}%</td></tr>`}).join('')+'</tbody>';
  ord.forEach((x,i)=>{if(!x.c.me)return;const c=x.c,id=c.did;
    $('#p-'+id).textContent=c.out?'—':(i+1);
    $('#g-'+id).textContent=c.out?'Сход':`${x.gap} · пит-стопов ${c.stops}`;
    const ty=TYRES[c.tyre],te=$('#ty-'+id);te.textContent=ty.l;te.style.borderColor=ty.col;
    const hb=$('#hb-'+id);hb.style.width=c.health+'%';hb.style.background=c.health<30?'var(--bad)':c.health<55?'var(--accent)':'var(--good)';
    ['push','norm','save'].forEach(m=>$(`#m-${id}-${m}`).classList.toggle('on',c.mode===m));
    Object.keys(TYRES).forEach(t=>$(`#pit-${id}-${t}`).classList.toggle('on',c.pitReq===t));
    const dry=new Set(c.used.filter(x=>x!=='I'));
    let st=c.pitReq?`Заезд в боксы на ${TYRES[c.pitReq].n.toLowerCase()} шины — на ближайшем круге.`:c.health<30?'Шины изношены — пора в боксы!':'';
    if(!c.out&&!R.anyWet&&dry.size<2&&lap>R.N*.5)st+=(st?' ':'')+'Нужен второй тип сухих шин!';
    $('#st-'+id).textContent=c.out?'Машина сошла с дистанции.':st;
    $('#ctl-'+id).style.opacity=c.out?.5:1;
  });
  $('#feed').innerHTML=R.feed.slice(0,7).map(f=>`<div style="${f.mine?'border-color:var(--team)':''}"><span class="muted mono" style="font-size:11px">КР ${f.l}</span> ${esc(f.t)}</div>`).join('');
}

/* --- итоги --- */
function vResult(){
  const L=S.lastRace,rows=L.rows;
  const p=[rows[1],rows[0],rows[2]];
  return`<div class="racehead wrap"><div class="grow"><div class="eyebrow">Итоги гонки</div><h2>${L.track}</h2></div></div>
  <div class="scroll wrap">
   <div class="podium">${p.map((r,i)=>r?`<div class="p${[2,1,3][i]}"><b>${[2,1,3][i]}</b><span class="ell" style="font-weight:700">${esc(nm(r.did))}</span><span class="chip" style="background:${team(r.tid).color};margin:0 auto;width:28px;height:4px"></span><span class="muted ell">${esc(team(r.tid).short)}</span></div>`:'<div></div>').join('')}</div>
   <div class="card" style="padding:8px 10px"><div class="tblwrap"><table><thead><tr><th>#</th><th>Пилот</th><th class="num">Старт</th><th class="num">Время</th><th class="num">Очки</th></tr></thead><tbody>
   ${rows.map(r=>`<tr${r.me?' class="me"':''}><td class="pos">${r.out?'—':r.pos}</td><td><span class="chip" style="background:${team(r.tid).color}"></span> ${esc(drv(r.did).name)}${r.pen?' <span class="pill bad">+10 с</span>':''}</td><td class="num muted">${r.grid}</td><td class="num">${r.out?'сход':r.pos===1?fsec(r.time):fgap(r.gap)}</td><td class="num">${r.pts||''}</td></tr>`).join('')}
   </tbody></table></div></div>
   <div class="card"><div class="row between"><h3>Финансы этапа</h3><span class="money" style="color:${L.net>=0?'var(--good)':'var(--bad)'}">${L.net>=0?'+':''}${fm(L.net,2)}</span></div>
    ${L.inc.map(x=>`<div class="row between"><span>${esc(x[0])}</span><span class="mono" style="color:var(--good)">+${x[1].toFixed(2).replace('.',',')}</span></div>`).join('')}
    ${L.exp.map(x=>`<div class="row between"><span>${esc(x[0])}</span><span class="mono" style="color:var(--bad)">−${x[1].toFixed(2).replace('.',',')}</span></div>`).join('')}
   </div>
   <button class="btn primary block" data-a="hub">В штаб</button>
  </div>`;
}
function vSeason(){
  const s=UI.season;
  if(s.gameover)return`<div class="title wrap"><div class="stripes"></div><div class="eyebrow">Решение совета директоров</div><h1>Вы уволены</h1><p>${esc(s.verdict.t)}</p><p class="muted">Чемпион: ${esc(s.champ)}. Кубок конструкторов: ${esc(s.cteam)}.</p><button class="btn primary block" data-a="restart">Новая карьера</button><div class="stripes"></div></div>`;
  return`<div class="scroll wrap">
   <div><div class="eyebrow">Сезон ${year()-1} завершён</div><h1>${s.pos}-е место</h1></div>
   <div class="card"><h3>Совет директоров</h3><p style="color:${s.verdict.ok?'var(--good)':s.verdict.ok===false?'var(--bad)':'var(--accent)'}">${esc(s.verdict.t)}</p></div>
   <div class="kv"><div><span class="eyebrow">Призовые</span><b style="color:var(--good)">+${s.prize}</b></div><div><span class="eyebrow">Новая цель</span><b>${S.goal}-е</b></div></div>
   <div class="card"><p>Чемпион мира: <b>${esc(s.champ)}</b><br>Кубок конструкторов: <b>${esc(s.cteam)}</b></p>
   <p class="muted" style="font-size:13px">Новый регламент сблизил болиды. Контракты пилотов уменьшились на год — проверьте вкладку «Команда».</p></div>
   <button class="btn primary block" data-a="hub">Начать сезон ${year()}</button>
  </div>`;
}

/* ---------- действия ---------- */
let toastT;
function toast(t){let el=$('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
const keepScroll=fn=>{const sc=$('#sc');const y=sc?sc.scrollTop:0;fn();const s2=$('#sc');if(s2)s2.scrollTop=y};

document.addEventListener('input',e=>{
  if(e.target.id==='tname')UI.teamName=e.target.value;
  const k=e.target.dataset&&e.target.dataset.k;if(k&&W){W.setup[k]=+e.target.value;const o=$('#sv-'+k);if(o)o.textContent=e.target.value}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v||'';
  const armed=UI.arm;UI.arm=null;
  switch(a){
   case'continue':S=load();if(!S){toast('Сохранение не найдено');return}UI.screen='hub';UI.tab='hq';render();break;
   case'new':UI.screen='new';render();break;
   case'home':UI.screen='title';render();break;
   case'pick':UI.pickTeam=+v;keepScroll(render);break;
   case'year0':UI.year0=+v;keepScroll(render);break;
   case'real':UI.real=v==='1';keepScroll(render);break;
   case'create':newGame(UI.pickTeam,UI.teamName);UI.screen='hub';UI.tab='hq';render();break;
   case'restart':wipe();S=null;UI.screen='new';render();break;
   case'tab':UI.tab=v;render();$('#sc').scrollTop=0;break;
   case'stand':UI.stand=v;keepScroll(render);break;
   case'hub':UI.screen='hub';UI.tab='hq';render();break;
   case'weekend':startWeekend();break;
   case'prac':practiceRun();break;
   case'toquali':UI.screen='quali';render();break;
   case'settings':UI.back=UI.screen;UI.screen='settings';render();break;
   case'back':UI.screen=UI.back||'title';render();break;
   case'set':{const[k,val]=v.split('|');SET[k]=typeof DEF_SET[k]==='number'?+val:val;saveSet();keepScroll(render);break}
   case'reset':{if(armed!=='reset'){UI.arm='reset';keepScroll(render);return}wipe();S=null;UI.screen='title';render();break}
   case'cam':UI.cam=v;updateRaceUi();break;
   case'follow':UI.follow=v;updateRaceUi();break;
   case'qrisk':{const[id,r]=v.split('|');W.risk[id]=r==='1';render();break}
   case'runq':runQuali();break;
   case'stire':{const[id,t]=v.split('|');W.start[id]=t;render();break}
   case'race':startRace();break;
   case'spd':{const n=+v;if(n===0)R.paused=!R.paused;else{R.paused=false;R.speed=n}updateRaceUi();break}
   case'mode':{const[id,m]=v.split('|');const c=R.cars.find(x=>x.did===id);if(c&&!c.out){c.mode=m;updateRaceUi()}break}
   case'pit':{const[id,t]=v.split('|');const c=R.cars.find(x=>x.did===id);if(c&&!c.out){c.pitReq=c.pitReq===t?null:t;updateRaceUi()}break}
   case'endseason':endSeason();break;
   case'upg':{const[part,k]=v.split('|');const u=UPG.find(x=>x.k===k),c=upgCost(part,u);if(S.budget<c)return;
     const g=+(u.g*(.7+me().td.rating/200)*rnd(.8,1.2)).toFixed(1);
     S.budget=+(S.budget-c).toFixed(2);S.projects.push({part,gain:g,left:u.r});save();toast('Проект запущен');keepScroll(render);break}
   case'fire':{if(armed!=='fire'+v){UI.arm='fire'+v;keepScroll(render);return}
     const d=drv(v),fee=+(d.salary*.5).toFixed(2);S.budget=+(S.budget-fee).toFixed(2);d.team=null;d.contract=0;me().drivers=me().drivers.filter(x=>x!==v);
     news(`${d.name} покидает команду.`);save();toast(`Пилот уволен, компенсация ${fee.toFixed(1).replace('.',',')} млн`);keepScroll(render);break}
   case'extend':{const d=drv(v);d.contract=2;d.salary=+(d.salary*1.1).toFixed(2);save();toast(`Контракт продлён на 2 года`);keepScroll(render);break}
   case'hire':{const d=drv(v),fee=+(d.salary*.5).toFixed(2);if(me().drivers.length>=2||S.budget<fee)return;
     S.budget=+(S.budget-fee).toFixed(2);d.team=S.pid;d.contract=2;me().drivers.push(d.id);news(`${d.name} подписывает контракт с командой.`);save();toast(`${d.name} в команде`);keepScroll(render);break}
   case'staff':{const[k,i]=v.split('|');const c=S.market[k][+i],cost=hireCost(k,c);if(S.budget<cost)return;
     S.budget=+(S.budget-cost).toFixed(2);me()[k]=c;S.market[k].splice(+i,1);news(`Новый ${k==='td'?'технический директор':'шеф механиков'}: ${c.name}.`);save();toast('Сотрудник нанят');keepScroll(render);break}
   case'sign':{if(S.sponsors.length>=3)return;const o=S.offers.splice(+v,1)[0];S.sponsors.push(o);S.budget=+(S.budget+o.sign).toFixed(2);save();toast(`Контракт с «${o.name}» подписан`);keepScroll(render);break}
   case'drop':{if(armed!=='drop'+v){UI.arm='drop'+v;keepScroll(render);return}S.sponsors.splice(+v,1);save();keepScroll(render);break}
  }
});
window.addEventListener('resize',()=>{if(UI.screen!=='race')after()});

render();
window.__pitwall={get S(){return S},get R(){return R}};
})();
</script>
